name: RHI Linux NativeAOT

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/OpenUsd.Rendering/**'
      - 'src/OpenUsd.Rendering.Silk*/**'
      - 'tests/OpenUsd.RhiProbe/**'
      - 'tests/OpenUsd.Rendering.ConformanceTests/VulkanCompositionPresentationTests.cs'
      - '.github/workflows/rhi-linux-aot.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/OpenUsd.Rendering/**'
      - 'src/OpenUsd.Rendering.Silk*/**'
      - 'tests/OpenUsd.RhiProbe/**'
      - 'tests/OpenUsd.Rendering.ConformanceTests/VulkanCompositionPresentationTests.cs'
      - '.github/workflows/rhi-linux-aot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-nativeaot-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish RHI probe
        run: >
          dotnet publish tests/OpenUsd.RhiProbe/OpenUsd.RhiProbe.csproj
          -c Release -f net10.0 -r linux-x64 -p:AotProbe=true
      - name: Run Vulkan RHI and presentation probe
        shell: pwsh
        run: |
          $publish = 'tests/OpenUsd.RhiProbe/bin/Release/net10.0/linux-x64/publish'
          $env:OPENUSD_VULKAN_PRESENTATION_ITERATIONS = '10'
          ./eng/run-rhi-probe.ps1 `
            -Rid linux-x64 `
            -PublishRoot $publish `
            -SkipPublish
