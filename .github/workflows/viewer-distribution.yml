name: viewer distribution

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['native artifact pipeline']
    types: [completed]
    branches: [main]
  push:
    branches: [ master, main ]
    paths: &viewer-distribution-paths
      - '.github/workflows/viewer-distribution.yml'
      - 'eng/publish-viewer-bundle.ps1'
      - 'eng/sign-viewer-bundle.ps1'
      - 'eng/test-viewer-bundle-smoke.ps1'
      - 'eng/pack-packages.ps1'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'eng/build-cesium-shim.ps1'
      - 'eng/native-install-metadata.ps1'
      - 'src/OpenUsd.Viewer/**'
      - 'src/OpenUsd.Viewer.App/**'
      - 'src/OpenUsd.Runtime.Core*/**'
      - 'src/OpenUsd.Runtime.Imaging*/**'
      - 'src/OpenUsd.Rendering*/**'
      - 'src/OpenUsd/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'version.json'
  pull_request:
    branches: [ master, main ]
    paths: *viewer-distribution-paths

permissions:
  contents: read
  actions: read

jobs:
  pack-viewer-inputs:
    name: pack Viewer inputs ${{ matrix.rid }}
    outputs:
      ready: ${{ steps.native-ready.outputs.ready }}
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: viewer-distribution-pack-${{ github.ref }}-${{ matrix.rid }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    env:
      NATIVE_PIPELINE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      NATIVE_SOURCE: ${{ github.event_name == 'workflow_run' && 'archive' || 'build' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - name: Report validated checkout commit
        shell: pwsh
        env:
          VALIDATED_BRANCH: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          CHECKOUT_FALLBACK_SHA: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
        run: |
          $validated = (git rev-parse HEAD).Trim()
          $branch = $env:VALIDATED_BRANCH
          # A tag release sets ref_name to the tag, so origin/<ref> does not
          # resolve. Plain `git rev-parse` echoes the argument and exits 128,
          # which the pwsh shell propagates and fails the step -- that is how
          # release run 31250563169 lost all three package jobs.
          $branchHead = git rev-parse --verify --quiet "refs/remotes/origin/$branch"
          if ($LASTEXITCODE -ne 0 -or -not $branchHead) {
            $branchHead = $env:CHECKOUT_FALLBACK_SHA
          }
          $global:LASTEXITCODE = 0
          $branchHead = "$branchHead".Trim()
          Write-Host "::notice::WORKFLOW_CHECKOUT_VALIDATION: viewer-distribution.yml pack job is validating commit $validated from '$branch'; current branch head is $branchHead."
          if ($validated -ne $branchHead) {
            Write-Host "::warning::WORKFLOW_CHECKOUT_STALE: viewer-distribution.yml pack job is validating $validated, not current '$branch' head $branchHead. For workflow_run, this is the native artifact pipeline commit and can lag behind the branch head."
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - id: native-cache
        if: env.NATIVE_SOURCE == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/install/${{ matrix.rid }}
            native/install/shim/${{ matrix.rid }}
            native/install/vulkan-sdk-1.4.321.0
            native/build/shim/${{ matrix.rid }}
          key: >-
            native-${{ matrix.rid }}-${{ hashFiles(
              'eng/openusd.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/check-linux-native-prerequisites.ps1',
              'eng/native-install-metadata.ps1',
              'native/CMakeLists.txt',
              'native/CMakePresets.json',
              'native/**/CMakeLists.txt',
              'native/**/*.cmake',
              'native/**/*.json',
              'native/**/*.in',
              'native/**/resources/**',
              'native/**/*.c',
              'native/**/*.cc',
              'native/**/*.cpp',
              'native/**/*.cxx',
              'native/**/*.m',
              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
              '!native/.cache/**'
            ) }}
      - name: Install Linux package prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang
          libgl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev libwayland-dev zlib1g-dev
          build-essential cmake ninja-build pkg-config libxt-dev libxtst-dev
      - name: Preflight Linux native build prerequisites
        if: >-
          matrix.rid == 'linux-x64' &&
          env.NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./eng/check-linux-native-prerequisites.ps1
      - name: Prepare validated six-entry Metal library
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          ./eng/shaders/prepare-metal-library.ps1 `
            -OutputRoot eng/shaders/out/package-metal-library
      - name: Install macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Fetch locked native sources
        if: env.NATIVE_SOURCE == 'build' && steps.native-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: ./eng/fetch-native.ps1 -Rid ${{ matrix.rid }}
      # Deliberately never builds OpenUSD from source. A miss means the native
      # tree changed and the pipeline has not published that tree yet, so
      # building here would spend about two and a half hours per RID on work
      # the pipeline is already doing, and this workflow restores rather than
      # saves, so the result would be thrown away. The workflow_run trigger
      # re-runs this properly once the archive exists, so the coverage is
      # deferred rather than lost -- and the notice says so out loud instead of
      # leaving a silent gap.
      - name: Report a deferred smoke when the native tree is not published yet
        if: env.NATIVE_SOURCE == 'build' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host (
            '::notice::VIEWER_SMOKE_DEFERRED: no verified native install for ' +
            '${{ matrix.rid }} at this commit. The native artifact pipeline has ' +
            'not published this native tree yet; this workflow will re-run ' +
            'automatically through workflow_run once it has.')
      - id: native-ready
        shell: pwsh
        run: |
          $ready = '${{ env.NATIVE_SOURCE }}' -eq 'archive' -or
            '${{ steps.native-cache.outputs.cache-hit }}' -eq 'true'
          "ready=$($ready.ToString().ToLowerInvariant())" |
            Out-File $env:GITHUB_OUTPUT -Append
      - name: Download verified native pipeline archive
        if: env.NATIVE_PIPELINE_RUN_ID != '' && steps.native-ready.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.NATIVE_PIPELINE_RUN_ID }}
          name: openusd-native-${{ matrix.rid }}
          path: artifacts/native-pipeline/${{ matrix.rid }}
      - name: Extract verified native archive
        if: env.NATIVE_SOURCE == 'archive' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid ${{ matrix.rid }} `
            -Source archive `
            -PipelineRoot artifacts/native-pipeline/${{ matrix.rid }}
      - name: Verify native install metadata
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $requireVulkanRuntime =
            $IsWindows -and $env:NATIVE_SOURCE -eq 'build'
          ./eng/native-install-metadata.ps1 `
            -Operation Verify `
            -Rid ${{ matrix.rid }} `
            -RequireVulkanRuntime:$requireVulkanRuntime
      - id: cesium-vcpkg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/.cache/vcpkg-*
            native/build/cesium/${{ matrix.rid }}/vcpkg_installed
          key: >-
            cesium-vcpkg-${{ matrix.rid }}-${{ hashFiles(
              'eng/cesium.lock.json',
              'eng/fetch-cesium-native.ps1',
              'eng/build-cesium-native.ps1',
              'eng/build-cesium-shim.ps1'
            ) }}
      - name: Build Cesium native install
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-cesium-native.ps1 -Rid ${{ matrix.rid }} -SkipSmokeProbe
      - name: Build Cesium shim
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-cesium-shim.ps1 -Rid ${{ matrix.rid }}
      - name: Pack the runtime packages for this RID
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        env:
          Platform: ''
        run: |
          ./eng/pack-packages.ps1 `
            -Scope runtime `
            -Rid ${{ matrix.rid }} `
            -OutputPath artifacts/nupkg
      - name: Pack the platform-neutral packages
        if: matrix.rid == 'linux-x64' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        env:
          Platform: ''
        run: ./eng/pack-packages.ps1 -Scope managed -OutputPath artifacts/nupkg
      - name: Pack the Metal package
        if: matrix.rid == 'osx-arm64' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        env:
          Platform: ''
        run: ./eng/pack-packages.ps1 -Scope metal -OutputPath artifacts/nupkg
      - name: Upload packed Viewer inputs
        if: steps.native-ready.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-viewer-input-nupkg-${{ matrix.rid }}
          path: artifacts/nupkg
          if-no-files-found: error
          retention-days: 14

  viewer-distribution:
    name: viewer distribution ${{ matrix.rid }}
    needs: pack-viewer-inputs
    # Skips rather than fails when the pack job deferred: there is nothing to
    # smoke, and workflow_run re-runs both once the native archive exists.
    if: needs.pack-viewer-inputs.outputs.ready == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - name: Report validated checkout commit
        shell: pwsh
        env:
          VALIDATED_BRANCH: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          CHECKOUT_FALLBACK_SHA: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
        run: |
          $validated = (git rev-parse HEAD).Trim()
          $branch = $env:VALIDATED_BRANCH
          # A tag release sets ref_name to the tag, so origin/<ref> does not
          # resolve. Plain `git rev-parse` echoes the argument and exits 128,
          # which the pwsh shell propagates and fails the step -- that is how
          # release run 31250563169 lost all three package jobs.
          $branchHead = git rev-parse --verify --quiet "refs/remotes/origin/$branch"
          if ($LASTEXITCODE -ne 0 -or -not $branchHead) {
            $branchHead = $env:CHECKOUT_FALLBACK_SHA
          }
          $global:LASTEXITCODE = 0
          $branchHead = "$branchHead".Trim()
          Write-Host "::notice::WORKFLOW_CHECKOUT_VALIDATION: viewer-distribution.yml smoke job is validating commit $validated from '$branch'; current branch head is $branchHead."
          if ($validated -ne $branchHead) {
            Write-Host "::warning::WORKFLOW_CHECKOUT_STALE: viewer-distribution.yml smoke job is validating $validated, not current '$branch' head $branchHead. For workflow_run, this is the native artifact pipeline commit and can lag behind the branch head."
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - name: Install Linux viewer smoke prerequisites
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1 libgl1 libglx0 libopengl0 libgl1-mesa-dri libx11-6 xvfb
      - name: Install Linux hang diagnostic tools
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get install -y gdb
          dotnet tool update --global dotnet-stack
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          # Run 31251898756 reached the timeout path but createdump could not
          # open /proc/<pid>/mem under Ubuntu's default ptrace_scope=1.
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Download packed Viewer inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openusd-viewer-input-nupkg-*
          merge-multiple: true
          path: artifacts/nupkg
      - name: Build package-only Viewer bundle
        shell: pwsh
        run: |
          ./eng/publish-viewer-bundle.ps1 `
            -Rid ${{ matrix.rid }} `
            -PackageSource artifacts/nupkg
      - name: Smoke the installed Viewer bundle
        if: matrix.rid != 'linux-x64'
        shell: pwsh
        run: |
          $archive = Get-ChildItem `
            artifacts/viewer-distribution/artifacts/${{ matrix.rid }} `
            -Filter 'OpenUsd.Viewer.${{ matrix.rid }}.*' |
            Where-Object { $_.Name -notmatch '\.symbols\.|\.sha256$|\.json$' } |
            Select-Object -First 1
          if ($null -eq $archive)
          {
            throw 'The Viewer bundle archive was not produced.'
          }
          ./eng/test-viewer-bundle-smoke.ps1 `
            -Rid ${{ matrix.rid }} `
            -BundlePath $archive.FullName
      - name: Smoke the installed Linux Viewer bundle
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac -nolisten tcp \
            >artifacts/viewer-distribution/linux-xvfb.out \
            2>artifacts/viewer-distribution/linux-xvfb.err &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          bundle=$(find artifacts/viewer-distribution/artifacts/linux-x64 \
            -maxdepth 1 -name 'OpenUsd.Viewer.linux-x64.tar.gz' -print -quit)
          if [ -z "$bundle" ]; then
            echo 'The Linux Viewer bundle archive was not produced.' >&2
            exit 1
          fi
          pwsh ./eng/test-viewer-bundle-smoke.ps1 \
            -Rid linux-x64 \
            -BundlePath "$bundle"
      - name: Upload Viewer distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-viewer-${{ matrix.rid }}
          path: artifacts/viewer-distribution/artifacts/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload Viewer smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-viewer-smoke-${{ matrix.rid }}
          path: artifacts/viewer-distribution-smoke
          if-no-files-found: warn
          retention-days: 14

  viewer-distribution-smoke-passed:
    name: viewer distribution smoke passed
    needs: [ pack-viewer-inputs, viewer-distribution ]
    if: >-
      always() &&
      needs.pack-viewer-inputs.outputs.ready == 'true' &&
      needs.viewer-distribution.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report smoke success
        run: |
          {
            echo '## Viewer distribution smoke passed'
            echo
            echo 'All Viewer distribution smoke matrix legs ran and passed.'
          } >> "$GITHUB_STEP_SUMMARY"

  viewer-distribution-smoke-deferred:
    name: viewer distribution smoke deferred (native artifacts unavailable)
    needs: pack-viewer-inputs
    if: >-
      always() &&
      needs.pack-viewer-inputs.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report deferred smoke
        run: |
          echo "::warning title=Viewer distribution smoke deferred::The Viewer bundle smoke did not run; \
          verified native artifacts were unavailable for this commit."
          {
            echo '## Viewer distribution smoke deferred'
            echo
            echo 'The Viewer bundle smoke did not run because verified native artifacts'
            echo 'were not available for this commit yet.'
            echo
            echo 'This is an expected deferral, not smoke evidence. The workflow_run'
            echo 'trigger will run the smoke after the native artifact pipeline publishes'
            echo 'the matching native archives.'
          } >> "$GITHUB_STEP_SUMMARY"
