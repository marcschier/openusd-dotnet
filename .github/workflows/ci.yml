name: ci

on:
  workflow_call:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Restore
        run: dotnet restore OpenUsd.slnx
      - name: Verify generated interop
        run: python eng/generate-interop.py --verify
      - name: Verify generated capability contract
        run: python eng/generate-capabilities.py --verify
      - name: Verify checked shader identity
        if: runner.os == 'Linux'
        run: >
          python eng/shaders/scripts/checked_payload.py
          --checked-root eng/shaders/checked
          --lock eng/shaders/toolchain.lock.json
          --manifest eng/shaders/shader-manifest.json
      - name: Build
        run: >
          dotnet build OpenUsd.slnx -c Release --no-restore
          -p:OpenUsdRequireMetalShaderLibrary=false
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format OpenUsd.slnx --verify-no-changes --no-restore
      - name: Check line length
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/check-line-length.ps1
      - name: Validate documentation
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/test-documentation.ps1
      - name: Validate native artifact workflow
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/test-native-artifact-workflow.ps1
      - name: Validate Linux native prerequisites
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/test-linux-native-prerequisites.ps1
      - name: Validate render native archive
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/test-render-native-archive.ps1
      - name: Validate continuous safety workflow
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/test-continuous-safety-workflow.ps1
      - name: Validate render capability gates
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/test-render-capability-gates.ps1
      - name: Verify Vulkan test runtime
        if: runner.os != 'macOS'
        shell: pwsh
        run: >
          ./eng/test-vulkan-test-runtime.ps1
          -Root tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0
      - name: Test
        if: runner.os != 'macOS'
        shell: pwsh
        run: |
          if ($IsWindows) {
            ./eng/run-vulkan-conformance-tests.ps1 -Configuration Release
            $projects = @(
              Get-ChildItem tests -Recurse -Filter '*.csproj' -File |
                Where-Object {
                  $_.BaseName.EndsWith(
                    '.Tests',
                    [StringComparison]::Ordinal) -and
                  $_.BaseName -cne 'OpenUsd.Rendering.ConformanceTests' -and
                  $_.BaseName -cne 'OpenUsd.NativeCoverage.Tests' -and
                  $_.BaseName -cne 'OpenUsd.Cesium.Tests'
                } |
                Select-Object -ExpandProperty FullName
            )
            if ($projects.Count -eq 0) {
              throw 'No non-conformance managed test projects were found.'
            }
            ./eng/run-managed-tests.ps1 `
              -Project $projects `
              -Configuration Release
          } else {
            ./eng/run-managed-tests.ps1 -Configuration Release
          }
      - name: Confirm macOS compile-only coverage
        if: runner.os == 'macOS'
        run: >
          echo "Regular macOS CI is compile-only; Metal execution runs after
          Xcode-validated shader generation in shaders.yml."

  aot-smoke:
    name: NativeAOT compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - name: Install NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish sample
        run: >
          dotnet publish samples/OpenUsd.HelloStage/OpenUsd.HelloStage.csproj
          -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true
      - name: Compile native interop probe
        run: >
          dotnet publish tests/OpenUsd.NativeProbe/OpenUsd.NativeProbe.csproj
          -c Release -f net10.0 -r ${{ matrix.rid }} -p:AotProbe=true
      - name: Run managed NativeAOT safety probe
        shell: pwsh
        run: |
          $probe = "tests/OpenUsd.NativeProbe/bin/Release/net10.0/${{ matrix.rid }}/publish/OpenUsd.NativeProbe"
          if ($IsWindows) {
            $probe += '.exe'
          }
          & $probe --managed-safety
          if ($LASTEXITCODE -ne 0) {
            throw "Managed NativeAOT safety probe failed with exit code $LASTEXITCODE."
          }
      - name: Compile hdSilk interop probe
        run: >
          dotnet publish tests/OpenUsd.SilkProbe/OpenUsd.SilkProbe.csproj
          -c Release -f net10.0 -r ${{ matrix.rid }} -p:AotProbe=true
          -p:OpenUsdRequireMetalShaderLibrary=false
      - name: Publish win-x64 RHI probe
        if: runner.os == 'Windows'
        run: >
          dotnet publish tests/OpenUsd.RhiProbe/OpenUsd.RhiProbe.csproj
          -c Release -f net10.0 -r win-x64 -p:AotProbe=true
      - name: Run win-x64 RHI probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publish = "tests/OpenUsd.RhiProbe/bin/Release/net10.0/win-x64/publish"
          ./eng/run-rhi-probe.ps1 `
            -Rid win-x64 `
            -PublishRoot $publish `
            -SkipPublish

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - name: Install native runtime prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential clang cmake ninja-build pkg-config
          libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev libxt-dev libxtst-dev
          x11-utils xvfb zlib1g-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: openusd-cache
        with:
          path: |
            native/install/linux-x64
            native/install/vulkan-sdk-1.4.321.0
          # Saved by the linux-x64 job of .github/workflows/native.yml. That key
          # and path list must stay character-identical to this one: hashFiles
          # over a different file list yields a different digest, so any drift
          # makes this restore miss on every run and fail the gate permanently.
          # eng/openusd.install.lock.json is the abi-free projection of
          # eng/openusd.lock.json; ABI bumps do not change the locked install.
          key: >-
            openusd-install-linux-x64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1'
            ) }}
      - name: Verify OpenUSD install cache
        if: steps.openusd-cache.outputs.cache-hit != 'true'
        run: |
          echo "Coverage needs the verified linux-x64 OpenUSD install cache produced by .github/workflows/native.yml."
          echo "The expensive cache is keyed by eng/openusd.install.lock.json and the native fetch/build scripts."
          echo "If install-affecting inputs changed, run the native artifact pipeline before the coverage gate."
          exit 1
      - name: Build current native shim
        shell: pwsh
        run: |
          $env:OPENUSD_ROOT = Join-Path $PWD 'native/install/linux-x64'
          $env:VULKAN_SDK = Join-Path $PWD 'native/install/vulkan-sdk-1.4.321.0'
          Push-Location native
          try {
            cmake --preset linux-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build --preset linux-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --install build/shim/linux-x64 --prefix install/shim/linux-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Execute hdSilk native probe
        run: >
          ctest --test-dir native/build/shim/linux-x64
          -R '^hdsilk_probe$' --output-on-failure
      - name: Build coverage tests
        run: |
          dotnet build tests/OpenUsd.Tests/OpenUsd.Tests.csproj -c Release -f net10.0
          dotnet build tests/OpenUsd.NativeCoverage.Tests/OpenUsd.NativeCoverage.Tests.csproj -c Release -f net10.0
          dotnet build tests/OpenUsd.Cesium.Tests/OpenUsd.Cesium.Tests.csproj -c Release -f net10.0
      - name: Execute Linux GLX Storm-to-hdSilk parity capture
        shell: pwsh
        env:
          OPENUSD_PARITY_CAPTURE_REQUIRED: '1'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $env:DISPLAY = ':94'
          $xvfb = Start-Process Xvfb `
            -ArgumentList @($env:DISPLAY, '-screen', '0', '1280x720x24', '-ac', '-nolisten', 'tcp') `
            -RedirectStandardOutput artifacts/ci-linux-parity-xvfb.out `
            -RedirectStandardError artifacts/ci-linux-parity-xvfb.err `
            -PassThru
          try {
            for ($i = 0; $i -lt 100; $i++) {
              & xdpyinfo -display $env:DISPLAY > $null 2>&1
              if ($LASTEXITCODE -eq 0) {
                break
              }
              Start-Sleep -Milliseconds 50
            }
            ./eng/run-parity-capture.ps1 -Rid linux-x64 -Configuration Release
          } finally {
            Stop-Process -Id $xvfb.Id -ErrorAction SilentlyContinue
          }
      - name: Upload Linux parity diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-linux-parity-${{ github.run_id }}
          path: |
            artifacts/parity-capture/linux-x64
            artifacts/ci-linux-parity-xvfb.out
            artifacts/ci-linux-parity-xvfb.err
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults
          if-no-files-found: warn
      - name: Test managed-only coverage
        shell: pwsh
        run: |
          $results = Join-Path $PWD 'TestResults/managed'
          ./eng/run-managed-tests.ps1 `
            -Project tests/OpenUsd.Tests/OpenUsd.Tests.csproj `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--results-directory', $results,
              '--coverage',
              '--coverage-settings', (Join-Path $PWD 'eng/coverage.config'),
              '--coverage-output-format', 'cobertura',
              '--coverage-output', 'coverage.managed.cobertura.xml')
      - name: Test native-backed coverage
        shell: pwsh
        run: |
          $results = Join-Path $PWD 'TestResults/native'
          ./eng/run-native-managed-tests.ps1 `
            -Project tests/OpenUsd.NativeCoverage.Tests/OpenUsd.NativeCoverage.Tests.csproj `
            -Framework net10.0 `
            -Rid linux-x64 `
            -Configuration Release `
            -TestArguments @(
              '--results-directory', $results,
              '--coverage',
              '--coverage-settings', (Join-Path $PWD 'eng/coverage.config'),
              '--coverage-output-format', 'cobertura',
              '--coverage-output', 'coverage.native.cobertura.xml')
      - name: Test optional Cesium authoring
        shell: pwsh
        # Excluded from the generic managed sweep because it opens a real stage
        # and that sweep does not stage a native runtime. It needs only the core
        # shim, not a cesium-native build, so it runs against the default
        # OPENUSD_WITH_CESIUM=OFF install like everything else here.
        run: >
          ./eng/run-native-managed-tests.ps1
          -Project tests/OpenUsd.Cesium.Tests/OpenUsd.Cesium.Tests.csproj
          -Framework net10.0
          -Rid linux-x64
          -Configuration Release
      - name: Merge coverage
        shell: pwsh
        run: >
          ./eng/merge-cobertura-line-coverage.ps1
          -CoverageFile TestResults/managed/coverage.managed.cobertura.xml,TestResults/native/coverage.native.cobertura.xml
          -OutputPath TestResults/coverage.cobertura.xml
      - name: Enforce coverage threshold
        shell: pwsh
        run: >
          ./eng/check-coverage.ps1
          -CoverageFile TestResults/coverage.cobertura.xml
          -MinLineRate 0.80
