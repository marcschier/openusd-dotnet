              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
