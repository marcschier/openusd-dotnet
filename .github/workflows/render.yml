name: render platform smoke

# Disposable diagnostic ref only; qualification source and prior attempts stay unchanged.
on:
  workflow_dispatch:
    inputs:
      native-source:
        description: Exact original failed staged artifact, never a build
        required: true
        default: archive
        type: choice
        options:
          - archive
      diagnostic-b905-abort-runtime:
        description: Approved ONE runtime-pinned diagnostic, never qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-b905-abort-runtime-once
  cancel-in-progress: false

jobs:
  diagnostic-b905-abort-runtime:
    name: Runtime-pinned diagnostic ONLY reconstructed host, not qualification
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/diagnostic-b905-abort-runtime-once' &&
      github.run_attempt == 1 &&
      inputs['diagnostic-b905-abort-runtime'] &&
      inputs['native-source'] == 'archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage exact historical runtime privately, not a system installation
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          url = "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.13/dotnet-runtime-10.0.13-linux-x64.tar.gz"
          expected = "9574d95364110409416735e7842796f8d614c21d74cb25d204a3e4cfd11b2c05efdf19ca89b8069650a04f64add2705967dcb04b8665a36d7a3f30a5d8c05afe"
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "b905-verified-runtime-10.0.13"
          root.mkdir(exist_ok=False)
          archive = root / "runtime.tar.gz"
          digest = hashlib.sha512()
          total = 0
          with urllib.request.urlopen(url, timeout=45) as response, archive.open("xb") as stream:
              if response.geturl() != url:
                  raise RuntimeError("Private runtime redirect refused.")
              while chunk := response.read(1048576):
                  total += len(chunk)
                  if total > 67108864:
                      raise RuntimeError("Private runtime download limit.")
                  digest.update(chunk)
                  stream.write(chunk)
          if digest.hexdigest() != expected:
              raise RuntimeError("Exact official runtime integrity mismatch.")
          with tarfile.open(archive) as package:
              members = package.getmembers()
              if sum(item.size for item in members) > 268435456:
                  raise RuntimeError("Private runtime extraction limit.")
              for item in members:
                  if not (item.isdir() or item.isfile()) or item.name.startswith("/") or ".." in pathlib.PurePosixPath(item.name).parts:
                      raise RuntimeError("Private runtime member type/path refused.")
              package.extractall(root, filter="data")
          archive.unlink()
          if not (root / "dotnet").is_file() or not (root / "shared/Microsoft.NETCore.App/10.0.13/libcoreclr.so").is_file():
              raise RuntimeError("Exact private runtime layout missing.")
          with open(os.environ["GITHUB_PATH"], "a") as stream:
              stream.write(str(root) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("DOTNET_ROOT=" + str(root) + "\nDOTNET_ROOT_X64=" + str(root) + "\n")
          PY
      - name: One runtime-pinned diagnostic or safe preflight failure
        env:
          GH_TOKEN: ${{ github.token }}
          B905_ONCE_APPROVED: 'true'
          B905_FALLBACK_REPLACEMENT_APPROVED: 'true'
          B905_RUNTIME_PINNED_APPROVED: 'true'
        shell: bash
        run: |
          test "$B905_RUNTIME_PINNED_APPROVED" = true
          set +e
          python3 eng/diagnose-b905-linux-once.py
          diagnostic_exit=$?
          set -e
          if test -f artifacts/b905-replacement-diagnostic-only/result.json; then
            mkdir artifacts/b905-runtime-pinned-diagnostic-only
            mv artifacts/b905-replacement-diagnostic-only/result.json \
              artifacts/b905-runtime-pinned-diagnostic-only/result.json
          fi
          exit "$diagnostic_exit"
      - name: Retain ONLY bounded runtime-pinned diagnostic text
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-b905-abort-runtime-once-${{ github.run_id }}
          path: artifacts/b905-runtime-pinned-diagnostic-only/result.json
          if-no-files-found: error
          retention-days: 7
