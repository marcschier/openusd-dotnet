name: render platform smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  codec-minimiser:
    name: Exact397 codec-only distinct bounded controls; not qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Minimise the actual codec boundary without Viewer or SDK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/diagnostics/minimise_codec.py
      - name: Retain only bounded codec/provider/control data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codec-minimiser-${{ github.run_id }}
          path: artifacts/397a-codec-minimiser/result.json
          if-no-files-found: error
          retention-days: 7
