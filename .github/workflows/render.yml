      - name: Resolve the Linux Vulkan loader and lavapipe ICD
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          steps.linux-vulkan.outputs.ready == 'true'
        id: linux-vulkan-runtime
        shell: bash
        run: |
          set -euo pipefail
          # These were hardcoded and silently went stale: Ubuntu 24.04 ships Mesa 25.x,
          # which no longer installs the lavapipe manifest where the old path expected it,
          # so a required gate reported the ICD as unavailable. Discover both instead, and
          # fail loudly with what was actually present rather than skipping, because
          # lavapipe does implement the external-memory FD path this gate proves.
          loader=""
          for candidate in \
            /usr/lib/x86_64-linux-gnu/libvulkan.so.1 \
            /usr/lib/libvulkan.so.1; do
            if [ -f "$candidate" ]; then loader="$candidate"; break; fi
          done
          if [ -z "$loader" ]; then
            loader="$(ldconfig -p | awk '/libvulkan\.so\.1/ {print $NF; exit}')"
          fi
          if [ -z "$loader" ] || [ ! -f "$loader" ]; then
            echo "::error::No Vulkan loader was found."
            exit 1
          fi
          icd="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d \
            /usr/lib/x86_64-linux-gnu/vulkan/icd.d \
            -name 'lvp_icd*.json' 2>/dev/null | sort | head -n1 || true)"
          if [ -z "$icd" ]; then
            echo "::error::No lavapipe ICD manifest was found. Present manifests:"
            find /usr/share/vulkan /etc/vulkan /usr/lib/x86_64-linux-gnu/vulkan \
              -name '*.json' 2>/dev/null || true
            exit 1
          fi
          echo "Using Vulkan loader $loader and lavapipe ICD $icd."
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "icd=$icd" >> "$GITHUB_OUTPUT"
      - name: Execute required X11 Vulkan import smoke
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.linux-vulkan.outputs.ready == 'true')
        env:
          OPENUSD_REQUIRE_VULKAN_PRESENTATION: '1'
          OPENUSD_ALLOW_UNAVAILABLE_CAPABILITY: '1'
        run: >
          ./eng/run-avalonia-vulkan-smoke-linux.sh
          x11
          artifacts/avalonia-vulkan-smoke/linux-x64
          '${{ steps.linux-vulkan-runtime.outputs.loader }}'
          '${{ steps.linux-vulkan-runtime.outputs.icd }}'
      - name: Execute required Wayland Vulkan import smoke
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.linux-vulkan.outputs.ready == 'true')
        env:
          OPENUSD_REQUIRE_VULKAN_PRESENTATION: '1'
          OPENUSD_ALLOW_UNAVAILABLE_CAPABILITY: '1'
        run: >
          ./eng/run-avalonia-vulkan-smoke-linux.sh
          wayland
          artifacts/avalonia-vulkan-smoke/linux-x64
          '${{ steps.linux-vulkan-runtime.outputs.loader }}'
          '${{ steps.linux-vulkan-runtime.outputs.icd }}'
      - name: Execute Linux Vulkan transparent opacity conformance
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.linux-vulkan.outputs.ready == 'true')
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ steps.linux-vulkan-runtime.outputs.icd }}
          VK_ICD_FILENAMES: ${{ steps.linux-vulkan-runtime.outputs.icd }}
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          dotnet build $project -c Release -f net10.0
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanDeviceTests/VulkanCompositesStraightAlphaOverDestination')
      - name: Execute Linux deformation, displacement, and environment conformance
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.linux-vulkan.outputs.ready == 'true')
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ steps.linux-vulkan-runtime.outputs.icd }}
          VK_ICD_FILENAMES: ${{ steps.linux-vulkan-runtime.outputs.icd }}
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          $methods = @(
            'SwiftShaderDeformationKernelMatchesTheCpuEvaluator',
            'SwiftShaderDeformationKernelWritesOnlyPositionsAndNormals',
            'SwiftShaderGpuDeformedImageMatchesTheCpuResolvedImage',
            'SwiftShaderRepeatedFramesReuseAndChangedPosesDispatchOnce',
            'SwiftShaderDeformationSurvivesADeviceGenerationReset',
            'SwiftShaderAnIneligibleRigDrawsTheCpuGeometry',
            'SwiftShaderDeformationParametersAreBoundedByTheirOwnSize',
            'SwiftShaderAFailedDeformationSetupDrawsTheCpuGeometry',
            'SwiftShaderAFailedDeformationDispatchDrawsTheCpuGeometry',
            'SwiftShaderADeviceLossDuringDeformationDispatchPropagates',
            'SwiftShaderShadowsFollowTheDeformedSurface',
            'SwiftShaderDeformationKernelIsIdempotentForOneIdentity'
          )
          $methods += @(
            'SwiftShaderRendersAConstantDisplacementAsDisplacedGeometry',
            'SwiftShaderRendersATextureDisplacementPerVertex',
            'SwiftShaderShadowsFollowTheDisplacedSurface',
            'SwiftShaderRendersAnUnsupportedDisplacementUndisplaced',
            'SwiftShaderRepeatedFramesReuseTheDisplacedGeometry',
            'SwiftShaderDisplacesTheDeformedSurfaceRatherThanTheBindPose',
            'SwiftShaderRepairingAHeightFieldReachesSelectionAndShadows'
          )
          $methods += @(
            'SwiftShaderLightsAQuadByTheDirectionAndOrientationOfATexturedDome',
            'SwiftShaderResolvesTheDomeContributionScalesAndRoughness',
            'SwiftShaderFallsBackForAnUnsupportedDomeAndReleasesTheEnvironment',
            'SwiftShaderLetsATexturedDomeSuppressTheDeterministicHeadlight',
            'SwiftShaderLetsAnUnsupportedDomeSuppressTheDeterministicHeadlight',
            'SwiftShaderReturnsTheSpecularPeakAtExactAlignment',
            'SwiftShaderKeepsANearMirrorBoundedAtEveryRoughness',
            'SwiftShaderFollowsRotatedAndNonUniformlyScaledPrimsWithTheEnvironment',
            'SwiftShaderLeavesAGeneratedUnlitMaterialUnlitUnderADome'
          )
          $methods += @(
            'SwiftShaderAppliesUsdLuxDomeLinking',
            'SwiftShaderSplitsTheSpecularSkyByDomeLink',
            'SwiftShaderMasksAnUntexturedDomePerDraw',
            'SwiftShaderKeepsEveryInstanceTransformAcrossSplitDomeMasks',
            'SwiftShaderUploadsTheEnvironmentAgainAfterAFailedSubmission'
          )
          $methods += 'SwiftShaderResolvesNestedInstanceLinkMasks'
          dotnet build $project -c Release -f net10.0
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              "/*/*/VulkanDeviceTests/($($methods -join '|'))")
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanDisplayTransformTests/*')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanSubprimPickingTests/*')
      - name: Execute Linux sampled OpenVDB volume conformance
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.linux-vulkan.outputs.ready == 'true')
        shell: pwsh
        # Real Linux execution of the Vulkan volume legs, not an inherited claim from
        # the Windows job. The runtime is the one the GLX parity capture already staged
        # in this job: OPENUSD_PLUGIN_PATH names its plugin root, which carries both the
        # hdSilk delegate and OpenUSD's hioOpenVDB reader, and LD_LIBRARY_PATH is
        # exported here rather than from inside the test host because the ELF loader
        # reads it once at process start. The D3D12 and cross-backend legs of the class
        # report a platform skip here; they are gated by the Windows job.
        env:
          VK_DRIVER_FILES: ${{ steps.linux-vulkan-runtime.outputs.icd }}
          VK_ICD_FILENAMES: ${{ steps.linux-vulkan-runtime.outputs.icd }}
          OPENUSD_PLUGIN_PATH: ${{ github.workspace }}/artifacts/parity-capture/linux-x64/runtime/plugin/usd
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/parity-capture/linux-x64/runtime/lib:${{ github.workspace }}/artifacts/parity-capture/linux-x64/runtime/bin
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          dotnet build $project -c Release -f net10.0
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeRenderingConformanceTests/(UniformDensityVolumeGatesOnVulkan|SampledOpenVdbDensityGatesOnVulkan)')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumePipelineSelectionConformanceTests/*')
          # The Vulkan legs of the depth gate; its D3D12 legs report a platform skip here.
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeDepthSamplingConformanceTests/*')
      - name: Execute Linux OpenColorIO alias identity evidence
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        env:
          OPENUSD_PLUGIN_PATH: ${{ github.workspace }}/artifacts/parity-capture/linux-x64/runtime/plugin/usd
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/parity-capture/linux-x64/runtime/lib:${{ github.workspace }}/artifacts/parity-capture/linux-x64/runtime/bin
        # Required, and required to have actually executed: Linux grants unprivileged
        # symbolic links, so the alias identity behaviour cannot be left unproven here.
        run: ./eng/test-ocio-alias-evidence.ps1 -Configuration Release
      - name: Upload OpenColorIO alias evidence
        if: always() && steps.native-ready.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-ocio-alias-evidence-linux-x64-${{ github.run_id }}
          path: tests/OpenUsd.Rendering.Tests/bin/Release/net10.0/ocio-alias-evidence.txt
          if-no-files-found: error
      - name: Classify the Linux volume evidence
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.linux-vulkan.outputs.ready == 'true')
        shell: pwsh
        # linux-x64 is already an advertised evidence platform for the sampled-volume gate,
        # so a capability skip here must fail rather than quietly ship an unbacked claim.
        # Only the Vulkan legs run in this job, so only they are classified.
        run: >
          ./eng/assert-volume-evidence.ps1
          -Root tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes
          -Backend vulkan
      - name: Upload Linux sampled volume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-volume-evidence-linux-x64-${{ github.run_id }}
          path: |
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes/*.txt
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes/*.json
          if-no-files-found: warn
      - name: Execute X11 Storm child switching gate
        if: steps.native-ready.outputs.ready == 'true'
        env:
          OPENUSD_LINUX_STORM_SWITCH_COUNT: '100'
          OPENUSD_LINUX_STORM_SURVIVAL_SECONDS: '90'
          OPENUSD_LINUX_STORM_FRESH_PROCESS_COUNT: '10'
          OPENUSD_REQUIRE_VULKAN_PRESENTATION: ${{ steps.linux-vulkan.outputs.ready == 'true' && '1' || '0' }}
          OPENUSD_ALLOW_UNAVAILABLE_CAPABILITY: '1'
        run: bash ./eng/run-storm-native-child-linux.sh x11
      - name: Execute whole-shell XWayland Storm child switching gate
        if: steps.native-ready.outputs.ready == 'true'
        env:
          OPENUSD_LINUX_STORM_SWITCH_COUNT: '100'
          OPENUSD_LINUX_STORM_SURVIVAL_SECONDS: '90'
          OPENUSD_LINUX_STORM_FRESH_PROCESS_COUNT: '10'
          OPENUSD_REQUIRE_VULKAN_PRESENTATION: ${{ steps.linux-vulkan.outputs.ready == 'true' && '1' || '0' }}
          OPENUSD_ALLOW_UNAVAILABLE_CAPABILITY: '1'
        run: bash ./eng/run-storm-native-child-linux.sh xwayland
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-linux-presentation-${{ github.run_id }}
          path: |
            artifacts/platform-smoke/linux-x11
            artifacts/platform-smoke/linux-wayland
            artifacts/parity-capture/linux-x64
            artifacts/silk-probe/linux-x64/shared-stage-soak.json
            artifacts/native-input/linux-x64/source.json
            artifacts/package-linux-storm-child
            artifacts/avalonia-vulkan-smoke/linux-x64
            artifacts/storm-native-child-linux
            artifacts/linux-storm-ctest-xvfb.log
            artifacts/linux-parity-xvfb.out
            artifacts/linux-parity-xvfb.err
            tests/OpenUsd.Package.Tests/bin/Release/net10.0/TestResults
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults
          if-no-files-found: error
      - name: Upload adjusted IoU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-adjusted-iou-linux-x64-${{ github.run_id }}
          path: tests/**/parity-capture-adjusted-iou.tsv
          if-no-files-found: warn

  macos-arm64:
    name: macOS arm64 Storm child and Metal
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 360
    env:
      DEFER_ON_NATIVE_CACHE_MISS: >-
        ${{ github.event_name == 'push' &&
            inputs['native-pipeline-run-id'] == '' &&
            'true' || 'false' }}
      NATIVE_PIPELINE_RUN_ID: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id ||
            inputs['native-pipeline-run-id'] }}
      NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            inputs['native-source'] || 'build' }}
      NATIVE_URL: ${{ inputs['macos-native-url'] }}
      NATIVE_SHA256: ${{ inputs['macos-native-sha256'] }}
      OpenUsdRequireMetalShaderLibrary: 'true'
      OPENUSD_PACKAGE_EXECUTION_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Restore-only, and keyed character-identically to the cache native.yml saves.
      # Push runs defer on a miss so these four render consumers never rebuild OpenUSD.
      - id: native-cache
        if: env.NATIVE_SOURCE == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/install/osx-arm64
            native/install/shim/osx-arm64
            native/install/vulkan-sdk-1.4.321.0
            native/build/shim/osx-arm64
          key: >-
            native-osx-arm64-${{ hashFiles(
              'eng/openusd.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/check-linux-native-prerequisites.ps1',
              'eng/native-install-metadata.ps1',
              'native/CMakeLists.txt',
              'native/CMakePresets.json',
              'native/**/CMakeLists.txt',
              'native/**/*.cmake',
              'native/**/*.json',
              'native/**/*.in',
              'native/**/resources/**',
              'native/**/*.c',
              'native/**/*.cc',
              'native/**/*.cpp',
              'native/**/*.cxx',
              'native/**/*.m',
              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
              '!native/.cache/**'
            ) }}
      - name: Report a deferred render smoke when the native tree is not published yet
        if: >-
          env.NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native-input/osx-arm64 | Out-Null
          [ordered]@{
            schemaVersion = 1
            status = 'deferred'
            source = 'cache'
            rid = 'osx-arm64'
            reason = 'The verified native install is not published for this cache key yet.'
          } | ConvertTo-Json -Depth 4 |
            Set-Content artifacts/native-input/osx-arm64/source.json
          Write-Host (
            '::notice::RENDER_SMOKE_DEFERRED: no verified native install for ' +
            'osx-arm64 at this commit. The native artifact pipeline has not ' +
            'published this native tree yet; a workflow_run render will cover ' +
            'native changes once the archive exists.')
      - name: Decide native input readiness
        id: native-ready
        shell: pwsh
        run: |
          $source = '${{ env.NATIVE_SOURCE }}'
          $ready = $source -eq 'archive' -or
            '${{ steps.native-cache.outputs.cache-hit }}' -eq 'true' -or
            '${{ env.DEFER_ON_NATIVE_CACHE_MISS }}' -ne 'true'
          "ready=$($ready.ToString().ToLowerInvariant())" |
            Out-File $env:GITHUB_OUTPUT -Append
      - name: Record restored native cache input
        if: env.NATIVE_SOURCE == 'build' && steps.native-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native-input/osx-arm64 | Out-Null
          [ordered]@{
            schemaVersion = 1
            source = 'cache'
            rid = 'osx-arm64'
            openUsdCommit = (Get-Content eng/openusd.lock.json -Raw |
              ConvertFrom-Json).openUsd.commit
          } | ConvertTo-Json -Depth 4 |
            Set-Content artifacts/native-input/osx-arm64/source.json
      - name: Select Xcode 16.4
        if: steps.native-ready.outputs.ready == 'true'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Validate native archive metadata preservation
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/test-render-native-archive.ps1
      - name: Install native build prerequisites
        if: steps.native-ready.outputs.ready == 'true'
        run: brew install cmake ninja
      - name: Build and validate the manifest-derived combined Metal library
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/shaders/fetch-toolchain.ps1 -Rid osx-arm64
          ./eng/shaders/build-toolchain.ps1 -Rid osx-arm64
          ./eng/shaders/build-shaders.ps1 `
            -Rid osx-arm64 `
            -ArtifactScope Metal `
            -OutputRoot eng/shaders/out/render-macos
          ./eng/shaders/prepare-metal-library.ps1 `
            -OutputRoot eng/shaders/out/checked-payload/osx-arm64
      - name: Download verified native pipeline archive
        if: env.NATIVE_PIPELINE_RUN_ID != '' && steps.native-ready.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.NATIVE_PIPELINE_RUN_ID }}
          name: openusd-native-osx-arm64
          path: artifacts/native-pipeline/osx-arm64
      - name: Prepare pinned native input
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (env.NATIVE_SOURCE == 'archive' || steps.native-cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          $pipelineRoot = if ($env:NATIVE_PIPELINE_RUN_ID) {
            'artifacts/native-pipeline/osx-arm64'
          } else {
            ''
          }
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid osx-arm64 `
            -Source $env:NATIVE_SOURCE `
            -ArchiveUri $env:NATIVE_URL `
            -ArchiveSha256 $env:NATIVE_SHA256 `
            -PipelineRoot $pipelineRoot
      - name: Verify native install metadata
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/native-install-metadata.ps1 `
            -Operation Verify `
            -Rid osx-arm64
      - id: cesium-vcpkg-cache
        if: steps.native-ready.outputs.ready == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/.cache/vcpkg-*
            native/build/cesium/osx-arm64/vcpkg_installed
          key: >-
            cesium-vcpkg-osx-arm64-${{ hashFiles(
              'eng/cesium.lock.json',
              'eng/fetch-cesium-native.ps1',
              'eng/build-cesium-native.ps1',
              'eng/build-cesium-shim.ps1'
            ) }}
      # Release run 31251906449 failed because the full package gates required
      # libopenusd_cesium.dylib from the package-only archive path.
      - name: Build Cesium native install
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-cesium-native.ps1 -Rid osx-arm64 -SkipSmokeProbe
      - name: Build Cesium shim
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-cesium-shim.ps1 -Rid osx-arm64
      # No PhysX step here. The pinned vcpkg port declares
      # "(windows & x64 & !mingw & !uwp) | (linux & x64) | (linux & arm64)", so the simulation SDK
      # has no arm64-osx build, no macOS physics package exists, and the physics package gate
      # reports absent prerequisites on this runner instead of pretending to cover a package.
      - name: Execute immutable macOS package-only gates
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          dotnet build tests/OpenUsd.Package.Tests/OpenUsd.Package.Tests.csproj -c Release
          $testApp = 'tests/OpenUsd.Package.Tests/bin/Release/net10.0/OpenUsd.Package.Tests'
          & $testApp --minimum-expected-tests 26
          if ($LASTEXITCODE -ne 0) {
            throw "The macOS package-only gates failed with $LASTEXITCODE."
          }
          $evidencePath = 'artifacts/package-macos-storm-child/package-evidence.json'
          if (-not (Test-Path $evidencePath)) {
            throw "The immutable macOS package evidence is missing: $evidencePath"
          }
          ./eng/validate-macos-package-evidence.ps1 `
            -RequireArchiveSource:($env:NATIVE_SOURCE -eq 'archive')
      - name: Execute staged NativeAOT shared-stage probes
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/run-native-probe.ps1 -Rid osx-arm64 -SkipNativeAbiProbe
          ./eng/run-silk-probe.ps1 -Rid osx-arm64
          ./eng/run-silk-probe.ps1 -Rid osx-arm64 -MetalComposition
      - name: Resolve macOS CGL parity capability
        if: steps.native-ready.outputs.ready == 'true'
        id: macos-cgl
        shell: pwsh
        run: ./eng/resolve-macos-cgl-capability.ps1
      - name: Execute macOS CGL Storm-to-Metal parity capture
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.macos-cgl.outputs.available == 'true')
        shell: pwsh
        run: ./eng/run-parity-capture.ps1 -Rid osx-arm64 -Configuration Release
      - name: Execute actual IOSurface Metal composition tests
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $conformanceProject = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          $viewerProject = 'tests/OpenUsd.Viewer.Tests/OpenUsd.Viewer.Tests.csproj'
          dotnet build $conformanceProject `
            -c Release `
            -f net10.0 `
            -p:OpenUsdRequireMetalShaderLibrary=true
          dotnet build $viewerProject `
            -c Release `
            -f net10.0 `
            -p:OpenUsdRequireMetalShaderLibrary=true
          ./eng/run-managed-tests.ps1 `
            -Project $conformanceProject `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/MetalCompositionPresentationTests/*')
          ./eng/run-managed-tests.ps1 `
            -Project $conformanceProject `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/StormSilkParityCaptureDriverTests/MaterialXGeneratedUnlitMatchesPreviewSelfConsistencyOnMetal')
          ./eng/run-managed-tests.ps1 `
            -Project $conformanceProject `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/MetalDeviceTests/CompositesStraightAlphaOverDestinationOnMacOS')
          ./eng/run-managed-tests.ps1 `
            -Project $viewerProject `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/MetalCompositionViewportLifecycleTests/*')
      - name: Stage macOS hdSilk volume runtime
        id: macos-volume-runtime
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        # Staged here rather than reusing the CGL parity capture's runtime, because that
        # capture runs only when resolve-macos-cgl-capability.ps1 proves hosted CGL works.
        # The Metal volume gates do not touch OpenGL, so binding them to that capability
        # would make a Metal pixel gate vanish whenever hosted CGL regressed.
        run: ./eng/stage-hdsilk-runtime.ps1 -Rid osx-arm64
      - name: Execute macOS sampled OpenVDB volume conformance
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        # The executed Metal pixel gate. It runs the same shared helper, stages, crops and
        # thresholds as the Windows and Linux legs, so a Metal backend that ignored the
        # density grid would fail here exactly as D3D12 did. DYLD_LIBRARY_PATH is exported
        # from the step rather than from inside the test host because dyld reads it once at
        # process start, and OpenUsdRequireMetalShaderLibrary stages the combined
        # mesh.metallib beside the host so the checked volumeFragmentMain entry point
        # resolves. The Vulkan, D3D12, and cross-backend legs of the class report platform
        # skips here; they are gated by the Windows and Linux jobs.
        #
        # The default --minimum-expected-tests of 1 is deliberate. It counts executed, not
        # skipped, tests, so it fails when both legs skip -- which on this runner can only
        # mean the metallib or the staged runtime is wrong -- while still letting the
        # uniform leg run and the sampled leg record an hioOpenVDB capability skip that the
        # classify step below is responsible for judging.
        env:
          OPENUSD_PLUGIN_PATH: ${{ steps.macos-volume-runtime.outputs.plugin }}
          DYLD_LIBRARY_PATH: ${{ steps.macos-volume-runtime.outputs.library-path }}
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          dotnet build $project `
            -c Release `
            -f net10.0 `
            -p:OpenUsdRequireMetalShaderLibrary=true
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeRenderingConformanceTests/(UniformDensityVolumeGatesOnMetal|SampledOpenVdbDensityGatesOnMetal)')
      - name: Classify the macOS volume evidence
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        # A skipped gate still exits zero, and an artifact of skip notes reads exactly like
        # an artifact of measured deltas. This step separates them and writes
        # volume-evidence-metal-status.json into the uploaded evidence, so the osx-arm64
        # support claim can only be promoted from a run whose status is "executed".
        # Missing or malformed evidence is a wiring fault and fails the job outright.
        # -AllowCapabilitySkip is the one thing to remove once a run records "executed":
        # dropping it makes the Metal volume gate required evidence on this runner, the
        # way the D3D12 WARP gate already is on the Windows job.
        run: >
          ./eng/assert-volume-evidence.ps1
          -Root tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes
          -Backend metal
          -AllowCapabilitySkip
          -SkipDepthGate
      - name: Upload macOS sampled volume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-volume-evidence-osx-arm64-${{ github.run_id }}
          path: |
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes/*.txt
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes/*.json
            artifacts/hdsilk-runtime/osx-arm64/runtime.json
          if-no-files-found: warn
      - name: Execute native probe and Storm/Metal no-restart switching loops
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: >
          ./eng/run-storm-native-child-macos.ps1
          -SwitchCount 100
          -SurvivalSeconds 90
          -NativeSource $env:NATIVE_SOURCE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-macos-arm64-${{ github.run_id }}
          path: |
            artifacts/platform-smoke/macos-arm64
            artifacts/render-capability/macos-cgl.json
            artifacts/storm-native-child-macos
            artifacts/parity-capture/osx-arm64
            artifacts/metal-composition-probe/osx-arm64
            artifacts/package-macos-storm-child
            artifacts/native-input/osx-arm64/source.json
            eng/shaders/out/render-macos
            eng/shaders/out/checked-payload/osx-arm64
            native/build/shim/osx-arm64/Testing
            TestResults
          if-no-files-found: error
      - name: Upload adjusted IoU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-adjusted-iou-osx-arm64-${{ github.run_id }}
          path: tests/**/parity-capture-adjusted-iou.tsv
          if-no-files-found: warn
