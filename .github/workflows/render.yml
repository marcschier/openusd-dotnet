            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanCompositionPresentationTests/D3D11BridgeImportsPixelsAndReusesKeyedMutex')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanDeviceTests/VulkanCompositesStraightAlphaOverDestination')
      - name: Execute ten required Avalonia hdSilk Vulkan processes
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.vulkan-icd.outputs.available == 'true')
        shell: pwsh
        run: >
          ./eng/run-avalonia-vulkan-smoke.ps1
          -IcdPath '${{ steps.vulkan-icd.outputs.path }}'
          -Required
          -Repetitions 10
          -TimeoutSeconds 120
      - name: Execute fresh NativeAOT Vulkan probe
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.vulkan-icd.outputs.available == 'true')
        shell: pwsh
        run: >
          ./eng/run-avalonia-vulkan-smoke.ps1
          -IcdPath '${{ steps.vulkan-icd.outputs.path }}'
          -Required
          -AotProbe
          -TimeoutSeconds 120
      - name: Verify viewer source identity and evidence contract
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/test-viewer-source-identity.ps1
          ./eng/test-viewer-evidence-contract.ps1
      - name: Execute ABI v4 switching and retired-kind quarantine evidence
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.vulkan-icd.outputs.available == 'true')
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ steps.vulkan-icd.outputs.path }}
          VK_ICD_FILENAMES: ${{ steps.vulkan-icd.outputs.path }}
          OPENUSD_REQUIRE_VULKAN_PRESENTATION: '1'
        run: |
          ./eng/run-storm-native-child.ps1 `
            -SwitchCount 100 `
            -SurvivalSeconds 90 `
            -FreshProcessCount 15
      - name: Upload mandatory Vulkan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-windows-vulkan-${{ github.run_id }}
          path: |
            artifacts/render-capability/windows-vulkan.json
            artifacts/avalonia-vulkan-smoke/win-x64
            artifacts/avalonia-vulkan-smoke/win-x64-aot
            artifacts/storm-native-child
            TestResults
            artifacts/native-input/win-x64/source.json
          if-no-files-found: error

  linux-presentation:
    name: Linux X11 and compositor-managed XWayland required gate
    if: >-
