name: render platform smoke

on:
  workflow_call:
    inputs:
      native-source:
        required: false
        default: archive
        type: string
      windows-native-url:
        required: false
        type: string
      windows-native-sha256:
        required: false
        type: string
      linux-native-url:
        required: false
        type: string
      linux-native-sha256:
        required: false
        type: string
      macos-native-url:
        required: false
        type: string
      macos-native-sha256:
        required: false
        type: string
      native-pipeline-run-id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      native-source:
        description: Build pinned OpenUSD inputs or download immutable tarballs
        required: true
        default: build
        type: choice
        options:
          - build
          - archive
      windows-native-url:
        description: HTTPS tar.gz for win-x64 (archive mode)
        required: false
        type: string
      windows-native-sha256:
        description: SHA-256 for the win-x64 tar.gz
        required: false
        type: string
      linux-native-url:
        description: HTTPS tar.gz for linux-x64 (archive mode)
        required: false
        type: string
      linux-native-sha256:
        description: SHA-256 for the linux-x64 tar.gz
        required: false
        type: string
      macos-native-url:
        description: HTTPS tar.gz for osx-arm64 (archive mode)
        required: false
        type: string
      macos-native-sha256:
        description: SHA-256 for the osx-arm64 tar.gz
        required: false
        type: string
      native-pipeline-run-id:
        description: Native artifact workflow run ID to consume instead of URL archives
        required: false
        type: string
  # Render was release-only until 0.6.0-alpha and hid stale shared-stage soak
  # ABI constants plus capability regressions until the release gate. Native
  # changes arrive through the verified archive producer instead of rebuilding
  # OpenUSD in these four one-hour consumers.
  workflow_run:
    workflows: ['native artifact pipeline']
    types: [completed]
    branches: [main]
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/render.yml'
      - 'eng/prepare-workflow-native-input.ps1'
      - 'eng/prepare-render-native.ps1'
      - 'eng/native-install-metadata.ps1'
      - 'eng/test-render-native-archive.ps1'
      - 'eng/test-linux-native-prerequisites.ps1'
      - 'eng/test-shared-stage-soak-identity.ps1'
      - 'eng/test-storm-native-child-linux.sh'
      - 'eng/test-viewer-source-identity.ps1'
      - 'eng/test-viewer-evidence-contract.ps1'
      - 'eng/test-ocio-alias-evidence.ps1'
      - 'eng/run-parity-capture.ps1'
      - 'eng/run-platform-smoke.ps1'
      - 'eng/run-native-probe.ps1'
      - 'eng/run-silk-probe.ps1'
      - 'eng/run-avalonia-vulkan-smoke.ps1'
      - 'eng/run-avalonia-vulkan-smoke-linux.sh'
      - 'eng/publish-avalonia-vulkan-smoke.ps1'
      - 'eng/run-storm-native-child.ps1'
      - 'eng/run-storm-native-child-linux.sh'
      - 'eng/run-storm-native-child-macos.ps1'
      - 'eng/resolve-macos-cgl-capability.ps1'
      - 'eng/validate-linux-package-evidence.ps1'
      - 'eng/validate-macos-package-evidence.ps1'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'eng/build-cesium-shim.ps1'
      - 'eng/shaders/**'
      - 'src/OpenUsd.Rendering*/**'
      - 'src/OpenUsd.Viewer/**'
      - 'src/OpenUsd.Viewer.App/**'
      - 'tests/OpenUsd.Rendering.ConformanceTests/**'
      - 'tests/OpenUsd.Rendering.Tests/**'
      - 'tests/OpenUsd.Viewer.Tests/**'
      - 'tests/OpenUsd.Package.Tests/**'
      - 'test-assets/parity/**'
      - 'native/hdSilk/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'version.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-wgl:
    name: Windows WGL
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      DEFER_ON_NATIVE_CACHE_MISS: >-
        ${{ github.event_name == 'push' &&
            inputs['native-pipeline-run-id'] == '' &&
            'true' || 'false' }}
      NATIVE_PIPELINE_RUN_ID: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id ||
            inputs['native-pipeline-run-id'] }}
      NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            inputs['native-source'] || 'build' }}
      NATIVE_URL: ${{ inputs['windows-native-url'] }}
      NATIVE_SHA256: ${{ inputs['windows-native-sha256'] }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Restore-only, and keyed character-identically to the cache native.yml saves.
      # Push runs defer on a miss so these four render consumers never rebuild OpenUSD.
      - id: native-cache
        if: env.NATIVE_SOURCE == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/install/win-x64
            native/install/shim/win-x64
            native/install/vulkan-sdk-1.4.321.0
            native/build/shim/win-x64
          key: >-
            native-win-x64-${{ hashFiles(
              'eng/openusd.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/check-linux-native-prerequisites.ps1',
              'eng/native-install-metadata.ps1',
              'native/CMakeLists.txt',
              'native/CMakePresets.json',
              'native/**/CMakeLists.txt',
              'native/**/*.cmake',
              'native/**/*.json',
              'native/**/*.in',
              'native/**/resources/**',
              'native/**/*.c',
              'native/**/*.cc',
              'native/**/*.cpp',
              'native/**/*.cxx',
              'native/**/*.m',
              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
              '!native/.cache/**'
            ) }}
      - name: Report a deferred render smoke when the native tree is not published yet
        if: >-
          env.NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native-input/win-x64 | Out-Null
          [ordered]@{
            schemaVersion = 1
            status = 'deferred'
            source = 'cache'
            rid = 'win-x64'
            reason = 'The verified native install is not published for this cache key yet.'
          } | ConvertTo-Json -Depth 4 |
            Set-Content artifacts/native-input/win-x64/source.json
          Write-Host (
            '::notice::RENDER_SMOKE_DEFERRED: no verified native install for ' +
            'win-x64 at this commit. The native artifact pipeline has not ' +
            'published this native tree yet; a workflow_run render will cover ' +
            'native changes once the archive exists.')
      - name: Decide native input readiness
        id: native-ready
        shell: pwsh
        run: |
          $source = '${{ env.NATIVE_SOURCE }}'
          $ready = $source -eq 'archive' -or
            '${{ steps.native-cache.outputs.cache-hit }}' -eq 'true' -or
            '${{ env.DEFER_ON_NATIVE_CACHE_MISS }}' -ne 'true'
          "ready=$($ready.ToString().ToLowerInvariant())" |
            Out-File $env:GITHUB_OUTPUT -Append
      - name: Record restored native cache input
        if: env.NATIVE_SOURCE == 'build' && steps.native-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native-input/win-x64 | Out-Null
          [ordered]@{
            schemaVersion = 1
            source = 'cache'
            rid = 'win-x64'
            openUsdCommit = (Get-Content eng/openusd.lock.json -Raw |
              ConvertFrom-Json).openUsd.commit
          } | ConvertTo-Json -Depth 4 |
            Set-Content artifacts/native-input/win-x64/source.json
      - name: Validate native archive subtree staging
        shell: pwsh
        run: ./eng/test-render-native-archive.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: env.NATIVE_SOURCE == 'build'
      - name: Download verified native pipeline archive
        if: env.NATIVE_PIPELINE_RUN_ID != '' && steps.native-ready.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.NATIVE_PIPELINE_RUN_ID }}
          name: openusd-native-win-x64
          path: artifacts/native-pipeline/win-x64
      - name: Prepare pinned native input
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (env.NATIVE_SOURCE == 'archive' || steps.native-cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          $pipelineRoot = if ($env:NATIVE_PIPELINE_RUN_ID) {
            'artifacts/native-pipeline/win-x64'
          } else {
            ''
          }
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid win-x64 `
            -Source $env:NATIVE_SOURCE `
            -ArchiveUri $env:NATIVE_URL `
            -ArchiveSha256 $env:NATIVE_SHA256 `
            -PipelineRoot $pipelineRoot
      - name: Verify native install metadata
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $requireVulkanRuntime = $IsWindows -and $env:NATIVE_SOURCE -eq 'build'
          ./eng/native-install-metadata.ps1 `
            -Operation Verify `
            -Rid win-x64 `
            -RequireVulkanRuntime:$requireVulkanRuntime
      - name: Execute staged NativeAOT shared-stage probes
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/test-shared-stage-soak-identity.ps1
          ./eng/run-native-probe.ps1 -Rid win-x64 -SkipNativeAbiProbe
          ./eng/run-silk-probe.ps1 -Rid win-x64 -SharedStageSoak
      - name: Execute mandatory WGL shared-stage soak
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: >
          ./eng/run-platform-smoke.ps1
          -Platform windows-wgl
          -SharedStageSoak
          -SoakSeconds 90
      - name: Execute Windows WGL Storm-to-hdSilk parity capture
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/run-parity-capture.ps1 -Rid win-x64 -Configuration Release -StormGl Mesa
      - name: Execute D3D12 transparent opacity conformance
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          dotnet build $project -c Release -f net10.0
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/D3D12DeviceTests/WarpCompositesStraightAlphaOverDestination')
      - name: Execute GPU deformation, displacement, and environment conformance
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          $warpMethods = @(
            'WarpDeformationKernelMatchesTheCpuEvaluator',
            'WarpDeformationKernelWritesOnlyPositionsAndNormals',
            'WarpGpuDeformedImageMatchesTheCpuResolvedImage',
            'WarpRepeatedFramesReuseAndChangedPosesDispatchOnce',
            'WarpDeformationSurvivesADeviceGenerationReset',
            'WarpAnIneligibleRigDrawsTheCpuGeometry',
            'WarpDeformationParametersAreBoundedByTheirOwnSize',
            'WarpAFailedDeformationSetupDrawsTheCpuGeometry',
            'WarpAFailedDeformationDispatchDrawsTheCpuGeometry',
            'WarpADeviceLossDuringDeformationDispatchPropagates',
            'WarpShadowsFollowTheDeformedSurface',
            'WarpDeformationKernelIsIdempotentForOneIdentity'
          )
          $warpMethods += @(
            'WarpRendersAConstantDisplacementAsDisplacedGeometry',
            'WarpRendersATextureDisplacementPerVertex',
            'WarpShadowsFollowTheDisplacedSurface',
            'WarpRendersAnUnsupportedDisplacementUndisplaced',
            'WarpRepeatedFramesReuseTheDisplacedGeometry',
            'WarpDisplacesTheDeformedSurfaceRatherThanTheBindPose',
            'WarpRepairingAHeightFieldReachesSelectionAndShadows'
          )
          $warpMethods += @(
            'WarpLightsAQuadByTheDirectionAndOrientationOfATexturedDome',
            'WarpResolvesTheDomeContributionScalesAndRoughness',
            'WarpFallsBackForAnUnsupportedDomeAndReleasesTheEnvironment',
            'WarpLetsATexturedDomeSuppressTheDeterministicHeadlight',
            'WarpLetsAnUnsupportedDomeSuppressTheDeterministicHeadlight',
            'WarpReturnsTheSpecularPeakAtExactAlignment',
            'WarpKeepsANearMirrorBoundedAtEveryRoughness',
            'WarpFollowsRotatedAndNonUniformlyScaledPrimsWithTheEnvironment',
            'WarpLeavesAGeneratedUnlitMaterialUnlitUnderADome'
          )
          $warpMethods += @(
            'WarpAppliesUsdLuxDomeLinking',
            'WarpSplitsTheSpecularSkyByDomeLink',
            'WarpMasksAnUntexturedDomePerDraw',
            'WarpKeepsEveryInstanceTransformAcrossSplitDomeMasks',
            'WarpUploadsTheEnvironmentAgainAfterAFailedSubmission'
          )
          $warpMethods += 'WarpResolvesNestedInstanceLinkMasks'
          $vulkanMethods = @(
            'SwiftShaderDeformationKernelMatchesTheCpuEvaluator',
            'SwiftShaderDeformationKernelWritesOnlyPositionsAndNormals',
            'SwiftShaderGpuDeformedImageMatchesTheCpuResolvedImage',
            'SwiftShaderRepeatedFramesReuseAndChangedPosesDispatchOnce',
            'SwiftShaderDeformationSurvivesADeviceGenerationReset',
            'SwiftShaderAnIneligibleRigDrawsTheCpuGeometry',
            'SwiftShaderDeformationParametersAreBoundedByTheirOwnSize',
            'SwiftShaderAFailedDeformationSetupDrawsTheCpuGeometry',
            'SwiftShaderAFailedDeformationDispatchDrawsTheCpuGeometry',
            'SwiftShaderADeviceLossDuringDeformationDispatchPropagates',
            'SwiftShaderShadowsFollowTheDeformedSurface',
            'SwiftShaderDeformationKernelIsIdempotentForOneIdentity'
          )
          $vulkanMethods += @(
            'SwiftShaderRendersAConstantDisplacementAsDisplacedGeometry',
            'SwiftShaderRendersATextureDisplacementPerVertex',
            'SwiftShaderShadowsFollowTheDisplacedSurface',
            'SwiftShaderRendersAnUnsupportedDisplacementUndisplaced',
            'SwiftShaderRepeatedFramesReuseTheDisplacedGeometry',
            'SwiftShaderDisplacesTheDeformedSurfaceRatherThanTheBindPose',
            'SwiftShaderRepairingAHeightFieldReachesSelectionAndShadows'
          )
          $vulkanMethods += @(
            'SwiftShaderLightsAQuadByTheDirectionAndOrientationOfATexturedDome',
            'SwiftShaderResolvesTheDomeContributionScalesAndRoughness',
            'SwiftShaderFallsBackForAnUnsupportedDomeAndReleasesTheEnvironment',
            'SwiftShaderLetsATexturedDomeSuppressTheDeterministicHeadlight',
            'SwiftShaderLetsAnUnsupportedDomeSuppressTheDeterministicHeadlight',
            'SwiftShaderReturnsTheSpecularPeakAtExactAlignment',
            'SwiftShaderKeepsANearMirrorBoundedAtEveryRoughness',
            'SwiftShaderFollowsRotatedAndNonUniformlyScaledPrimsWithTheEnvironment',
            'SwiftShaderLeavesAGeneratedUnlitMaterialUnlitUnderADome'
          )
          $vulkanMethods += @(
            'SwiftShaderAppliesUsdLuxDomeLinking',
            'SwiftShaderSplitsTheSpecularSkyByDomeLink',
            'SwiftShaderMasksAnUntexturedDomePerDraw',
            'SwiftShaderKeepsEveryInstanceTransformAcrossSplitDomeMasks',
            'SwiftShaderUploadsTheEnvironmentAgainAfterAFailedSubmission'
          )
          $vulkanMethods += 'SwiftShaderResolvesNestedInstanceLinkMasks'
          dotnet build $project -c Release -f net10.0
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              "/*/*/D3D12DeviceTests/($($warpMethods -join '|'))")
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              "/*/*/VulkanDeviceTests/($($vulkanMethods -join '|'))")
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/D3D12DisplayTransformTests/*')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanDisplayTransformTests/*')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/D3D12SubprimPickingTests/*')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VulkanSubprimPickingTests/*')
      - name: Execute sampled OpenVDB volume conformance
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        # The D3D12 WARP volume gate is required evidence, not an optional extra.
        # A backend that ignores the sampled density grid still passes a
        # sampled-versus-uniform check on its own, so the same job also runs the
        # Vulkan gate and the cross-backend comparison that makes such a backend
        # visible. Both device paths are software here: WARP and the packaged
        # SwiftShader ICD that run-managed-tests.ps1 selects. The hdSilk and
        # hioOpenVDB plugins come from the parity runtime staged earlier in this
        # job, just as they do in the Linux volume step.
        env:
          Platform: ''
          OPENUSD_PLUGIN_PATH: ${{ github.workspace }}/artifacts/parity-capture/win-x64/runtime/plugin/usd
        run: |
          $runtimeRoot = Join-Path $PWD 'artifacts/parity-capture/win-x64/runtime'
          $env:PATH = @(
            (Join-Path $runtimeRoot 'bin'),
            (Join-Path $runtimeRoot 'lib'),
            $env:PATH
          ) -join [System.IO.Path]::PathSeparator
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          dotnet build $project -c Release -f net10.0
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeRenderingConformanceTests/*')
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumePipelineSelectionConformanceTests/*')
          # Authors its own grid, so it needs no native runtime and covers a density
          # resolution the one checked-in VDB does not have.
          ./eng/run-managed-tests.ps1 `
            -Project $project `
            -Framework net10.0 `
            -Configuration Release `
            -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeDepthSamplingConformanceTests/*')
      - name: Classify the Windows volume evidence
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        # win-x64 is already an advertised evidence platform for the sampled-volume gate,
        # so a run that skipped it would make that claim false. There is no
        # -AllowCapabilitySkip here for exactly that reason: a capability skip on this
        # runner must fail rather than quietly ship an unbacked claim.
        run: |
          $volumes = 'tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes'
          ./eng/assert-volume-evidence.ps1 -Root $volumes -Backend vulkan
          ./eng/assert-volume-evidence.ps1 -Root $volumes -Backend d3d12 -SkipUniformGate
      - name: Upload sampled volume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-volume-evidence-win-x64-${{ github.run_id }}
          path: |
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes/*.txt
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/volumes/*.json
          if-no-files-found: warn
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-windows-wgl-${{ github.run_id }}
          path: |
            artifacts/platform-smoke/windows-wgl
            artifacts/parity-capture/win-x64
            artifacts/silk-probe/win-x64/shared-stage-soak.json
            artifacts/native-input/win-x64/source.json
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults
          if-no-files-found: warn
      - name: Upload adjusted IoU evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-adjusted-iou-win-x64-${{ github.run_id }}
          path: tests/**/parity-capture-adjusted-iou.tsv
          if-no-files-found: warn

  windows-vulkan-required:
    name: Windows Avalonia Vulkan required
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      DEFER_ON_NATIVE_CACHE_MISS: >-
        ${{ github.event_name == 'push' &&
            inputs['native-pipeline-run-id'] == '' &&
            'true' || 'false' }}
      NATIVE_PIPELINE_RUN_ID: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id ||
            inputs['native-pipeline-run-id'] }}
      NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            inputs['native-source'] || 'build' }}
      NATIVE_URL: ${{ inputs['windows-native-url'] }}
      NATIVE_SHA256: ${{ inputs['windows-native-sha256'] }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Restore-only, and keyed character-identically to the cache native.yml saves.
      # Push runs defer on a miss so these four render consumers never rebuild OpenUSD.
      - id: native-cache
        if: env.NATIVE_SOURCE == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/install/win-x64
            native/install/shim/win-x64
            native/install/vulkan-sdk-1.4.321.0
            native/build/shim/win-x64
          key: >-
            native-win-x64-${{ hashFiles(
