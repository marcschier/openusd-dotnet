            schemaVersion = 1
            status = 'skipped'
            completedAt = [DateTimeOffset]::UtcNow.ToString('O')
            platform = 'windows-vulkan'
            reason = $reason
          } | ConvertTo-Json -Depth 4 |
            Set-Content artifacts/render-capability/windows-vulkan.json
          Write-Host "[vulkan-icd] Skipped: $reason"
          "available=false" >> $env:GITHUB_OUTPUT
      - name: Execute required D3D11 destination pixel test
        if: >-
          steps.native-ready.outputs.ready == 'true' &&
          (steps.vulkan-icd.outputs.available == 'true')
