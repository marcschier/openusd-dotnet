name: render platform smoke

# Disposable isolated ref only. The qualification branch retains its original workflow.
on:
  workflow_dispatch:
    inputs:
      native-source:
        description: Diagnostic consumes the original failed staged artifact, never a build
        required: true
        default: archive
        type: choice
        options:
          - archive
      diagnostic-b905-abort:
        description: Approved ONE bounded Linux replay, not qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-b905-abort-once
  cancel-in-progress: false

jobs:
  diagnostic-b905-abort:
    name: Diagnostic ONLY reconstructed Linux host, not qualification
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/diagnostic-b905-abort-once' &&
      github.run_attempt == 1 &&
      inputs['diagnostic-b905-abort'] &&
      inputs['native-source'] == 'archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One bounded original-artifact replay or truthful unavailable outcome
        env:
          GH_TOKEN: ${{ github.token }}
          B905_ONCE_APPROVED: 'true'
        run: python3 eng/diagnose-b905-linux-once.py
      - name: Retain ONLY bounded diagnostic text
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-b905-abort-once-${{ github.run_id }}
          path: artifacts/b905-diagnostic-only/result.json
          if-no-files-found: error
          retention-days: 7
