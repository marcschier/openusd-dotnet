          }
          # Narrowed gate. A hosted Windows runner has no GPU driver and therefore no
          # system Vulkan ICD. Software Vulkan cannot stand in for one: SwiftShader
          # implements neither VK_KHR_external_memory_win32 nor
          # VK_KHR_external_semaphore_win32, so it can never export an image to the D3D11
          # shared handle that every proof below is about. Unblocking this needs a
          # GPU-equipped runner; see docs/testing.md, "Render gate capability limits".
          $reason =
            'This host has no system Vulkan ICD, so Vulkan composition evidence cannot run.'
          New-Item -ItemType Directory -Force -Path artifacts/render-capability | Out-Null
