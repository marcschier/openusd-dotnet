name: render platform smoke
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  codec-repair-controls:
    name: Locked-source codec build-option controls; not qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify locked-source codec repair against tiny original red control
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/diagnostics/verify_codec_repair.py
      - name: Retain only codec build/control JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codec-repair-controls-${{ github.run_id }}
          path: artifacts/397a-codec-repair/result.json
          if-no-files-found: error
          retention-days: 7
