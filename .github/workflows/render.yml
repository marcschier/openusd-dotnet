name: render platform smoke
on:
  workflow_dispatch:
    inputs:
      exact-397-allocator-diagnostic:
        description: One diagnostic target from the actual failed397 artifact, never qualification
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnostic-397a-allocator-fault-once
  cancel-in-progress: false
jobs:
  exact-397-allocator-diagnostic:
    if: >-
      github.ref == 'refs/heads/diagnostic-397a-allocator-fault-once' &&
      github.run_attempt == 1 && inputs['exact-397-allocator-diagnostic']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 397a8812ae8a7578171ab6859295f98637b9dcdd
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: private-diagnostic-source
          persist-credentials: false
      - name: Stage exact actual397 runtime privately and retain source identity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile, urllib.request
          url = "https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.13/dotnet-runtime-10.0.13-linux-x64.tar.gz"
          expected = "9574d95364110409416735e7842796f8d614c21d74cb25d204a3e4cfd11b2c05efdf19ca89b8069650a04f64add2705967dcb04b8665a36d7a3f30a5d8c05afe"
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "397a-verified-runtime-10.0.13"
          root.mkdir(exist_ok=False)
          archive = root / "runtime.tar.gz"
          digest = hashlib.sha512()
          total = 0
          with urllib.request.urlopen(url, timeout=45) as response, archive.open("xb") as stream:
              if response.geturl() != url:
                  raise RuntimeError("Private runtime redirect refused.")
              while chunk := response.read(1048576):
                  total += len(chunk)
                  if total > 67108864:
                      raise RuntimeError("Private runtime download limit.")
                  digest.update(chunk)
                  stream.write(chunk)
          if total != 36648012 or digest.hexdigest() != expected:
              raise RuntimeError("Exact actual397 official runtime integrity mismatch.")
          with tarfile.open(archive) as package:
              members = package.getmembers()
              if sum(item.size for item in members) > 268435456:
                  raise RuntimeError("Private runtime extraction limit.")
              for item in members:
                  if not (item.isdir() or item.isfile()) or item.name.startswith("/") or ".." in pathlib.PurePosixPath(item.name).parts:
                      raise RuntimeError("Private runtime member type/path refused.")
              package.extractall(root, filter="data")
          archive.unlink()
          with open(os.environ["GITHUB_PATH"], "a") as stream:
              stream.write(str(root) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("DOTNET_ROOT=" + str(root) + "\nDOTNET_ROOT_X64=" + str(root) + "\n")
          PY
          test "$(git rev-parse HEAD)" = 397a8812ae8a7578171ab6859295f98637b9dcdd
          pwsh -NoProfile -Command '. ./eng/shared-stage-soak-identity.ps1; $hash = Get-OpenUsdSoakSourceHash $PWD.Path; "EXACT_397_SOAK_SOURCE_HASH=$hash" | Out-File $env:GITHUB_ENV -Append'
      - name: One actual397 fault-thread diagnostic with fresh120s owned-exit bound
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_397_ONCE_APPROVED: 'true'
        shell: bash
        run: python3 private-diagnostic-source/eng/diagnostics/diagnose_397a_linux_once.py
      - name: Retain only bounded fault-thread and fixed-label metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-397a-allocator-fault-once-${{ github.run_id }}
          path: artifacts/397a-fault-diagnostic-only/result.json
          if-no-files-found: error
          retention-days: 7
