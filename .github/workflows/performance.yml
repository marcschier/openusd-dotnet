name: performance safety

on:
  workflow_call:
    inputs:
      full_benchmarks:
        description: Run the complete informational BenchmarkDotNet suite
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_benchmarks:
        description: Run the complete informational BenchmarkDotNet suite
        required: false
        type: boolean
        default: false
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/performance.yml'
      - 'benchmarks/OpenUsd.Benchmarks/**'
      - 'docs/rendering.md'
      - 'docs/testing.md'
      - 'eng/run-performance.ps1'
      - 'global.json'
      - 'OpenUsd.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'src/OpenUsd/**'
      - 'src/OpenUsd.Interop/**'
      - 'src/OpenUsd.Rendering/**'
      - 'src/OpenUsd.Rendering.Silk/**'
      - 'tests/OpenUsd.Performance.Tests/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - '.github/workflows/performance.yml'
      - 'benchmarks/OpenUsd.Benchmarks/**'
      - 'docs/rendering.md'
      - 'docs/testing.md'
      - 'eng/run-performance.ps1'
      - 'global.json'
      - 'OpenUsd.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'src/OpenUsd/**'
      - 'src/OpenUsd.Interop/**'
      - 'src/OpenUsd.Rendering/**'
      - 'src/OpenUsd.Rendering.Silk/**'
      - 'tests/OpenUsd.Performance.Tests/**'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: deterministic gates and benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - name: Run deterministic gates and short benchmark smoke
        if: inputs.full_benchmarks != true
        shell: pwsh
        run: >
          ./eng/run-performance.ps1
          -Mode Smoke
          -BenchmarkJob Short
          -Repeat 3
          -ArtifactsPath artifacts/performance
      - name: Run deterministic gates and full benchmark artifacts
        if: inputs.full_benchmarks == true
        shell: pwsh
        run: >
          ./eng/run-performance.ps1
          -Mode Artifacts
          -BenchmarkJob Short
          -Repeat 3
          -ArtifactsPath artifacts/performance
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.run_id }}
          path: artifacts/performance/
          if-no-files-found: error
          retention-days: 30
