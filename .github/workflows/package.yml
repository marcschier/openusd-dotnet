name: package

on:
  workflow_call:
    inputs:
      linux-native-source:
        required: false
        default: build
        type: string
      linux-native-url:
        required: false
        type: string
      linux-native-sha256:
        required: false
        type: string
      macos-native-source:
        required: false
        default: build
        type: string
      macos-native-url:
        required: false
        type: string
      macos-native-sha256:
        required: false
        type: string
      native-pipeline-run-id:
        required: false
        type: string
      cesium-pipeline-run-id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      linux-native-source:
        description: Build Linux inputs or download an immutable native archive
        required: true
        default: build
        type: choice
        options:
          - build
          - archive
      linux-native-url:
        description: HTTPS tar.gz for linux-x64 archive mode
        required: false
        type: string
      linux-native-sha256:
        description: SHA-256 for the linux-x64 tar.gz
        required: false
        type: string
      macos-native-source:
        description: Build macOS inputs or download an immutable native archive
        required: true
        default: build
        type: choice
        options:
          - build
          - archive
      macos-native-url:
        description: HTTPS tar.gz for osx-arm64 archive mode
        required: false
        type: string
      macos-native-sha256:
        description: SHA-256 for the osx-arm64 tar.gz
        required: false
        type: string
      native-pipeline-run-id:
        description: Native artifact workflow run ID to consume instead of URL archives
        required: false
        type: string
  # These gates only ever ran inside a release, and it cost five release runs
  # to ship 0.5.0-alpha because four of them were first-ever executions. This
  # runs them on every push to main instead, reusing the verified archive the
  # native pipeline just produced for the same commit rather than rebuilding
  # OpenUSD -- so the cost is the package jobs alone, not another 2.5 hours per
  # RID. A push trigger would rebuild, because the native cache here is a
  # separate namespace from the one native.yml fills.
  workflow_run:
    workflows: ['native artifact pipeline']
    types: [completed]
    branches: [main]
  # workflow_run alone is not enough: native.yml is path-filtered to native
  # inputs, so it never fires for a change to the packaging targets or the
  # package tests -- which is exactly what broke three of these gates. These
  # paths cover the managed side. Exact cache hits reuse native.yml's install;
  # a pull-request cache miss builds from the checked-out source rather than
  # treating a deferred package gate as qualification.
  push:
    branches: [ master, main ]
    paths: &package-paths
      - '.github/workflows/package.yml'
      - 'eng/pack-packages.ps1'
      - 'eng/generate-native-notices.py'
      - 'eng/shaderc-source-patches.lock.json'
      - 'eng/patches/shaderc/**'
      - 'eng/generate-sbom.py'
      - 'LICENSE'
      - 'NOTICE'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'eng/build-cesium-shim.ps1'
      - 'eng/physx.lock.json'
      - 'eng/fetch-physx-native.ps1'
      - 'eng/build-physx-native.ps1'
      - 'eng/build-physx-shim.ps1'
      - 'eng/run-native-probe.ps1'
      - 'eng/run-silk-probe.ps1'
      - 'eng/native-install-metadata.ps1'
      - 'native/CMakeLists.txt'
      - 'native/CMakePresets.json'
      - 'native/hdSilk/**'
      - 'native/openusd_cesium/**'
      - 'native/openusd_physx/**'
      - 'src/OpenUsd.Mcp/**'
      - 'src/OpenUsd.Runtime.Packaging/**'
      - 'src/OpenUsd.Runtime.Core*/**'
      - 'src/OpenUsd.Runtime.Imaging*/**'
      - 'src/OpenUsd.Runtime.Cesium*/**'
      - 'src/OpenUsd.Runtime.Physics*/**'
      # The managed physics library and the schema resources it embeds are packed and executed by
      # the physics package gates, so a change to either has to run them. The wildcard above matches
      # only the runtime packages; without these two, removing an <EmbeddedResource> or editing the
      # generated schema would skip the only gate that reads them out of a packed assembly.
      - 'src/OpenUsd.Physics/**'
      - 'schemas/**'
      - 'tests/OpenUsd.Package.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'version.json'
  pull_request:
    branches: [ master, main ]
    paths: *package-paths

permissions:
  contents: read
  actions: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-execution:
    name: ${{ matrix.name }} package-only NativeAOT execution
    # A workflow_run fires whatever the upstream conclusion was, so a failed or
    # cancelled native pipeline would otherwise send these jobs looking for an
    # archive that was never uploaded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rid: win-x64
          - name: Linux x64
            runner: ubuntu-24.04
            rid: linux-x64
          - name: macOS arm64
            runner: macos-15
            rid: osx-arm64
    outputs:
      ready: ${{ steps.native-ready.outputs.ready }}
    env:
      OPENUSD_PACKAGE_EXECUTION_REQUIRED: 'true'
      DEVELOPER_DIR: ${{ matrix.rid == 'osx-arm64' && '/Applications/Xcode_16.4.app/Contents/Developer' || '' }}
      DEFER_ON_NATIVE_CACHE_MISS: >-
        ${{ github.event_name == 'push' &&
            'true' || 'false' }}
      NATIVE_PIPELINE_RUN_ID: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id ||
            inputs['native-pipeline-run-id'] }}
      WINDOWS_NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' || 'build' }}
      LINUX_NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs['linux-native-source'] || 'build') }}
      LINUX_NATIVE_URL: ${{ inputs['linux-native-url'] }}
      LINUX_NATIVE_SHA256: ${{ inputs['linux-native-sha256'] }}
      MACOS_NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs['macos-native-source'] || 'build') }}
      MACOS_NATIVE_URL: ${{ inputs['macos-native-url'] }}
      MACOS_NATIVE_SHA256: ${{ inputs['macos-native-sha256'] }}
      OpenUsdRequireMetalShaderLibrary: >-
        ${{ matrix.rid == 'osx-arm64' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A workflow_run checks out the default branch by default, not the
          # commit that produced the archive these jobs are about to consume.
          # Pinning the triggering SHA keeps the tests and the native payload
          # describing the same tree.
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - name: Report validated checkout commit
        shell: pwsh
        env:
          VALIDATED_BRANCH: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          CHECKOUT_FALLBACK_SHA: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
        run: |
          $validated = (git rev-parse HEAD).Trim()
          $branch = $env:VALIDATED_BRANCH
          # A tag release sets ref_name to the tag, so origin/<ref> does not
          # resolve. Plain `git rev-parse` echoes the argument and exits 128,
          # which the pwsh shell propagates and fails the step -- that is how
          # release run 31250563169 lost all three package jobs.
          $branchHead = git rev-parse --verify --quiet "refs/remotes/origin/$branch"
          if ($LASTEXITCODE -ne 0 -or -not $branchHead) {
            $branchHead = $env:CHECKOUT_FALLBACK_SHA
          }
          $global:LASTEXITCODE = 0
          $branchHead = "$branchHead".Trim()
          Write-Host "::notice::WORKFLOW_CHECKOUT_VALIDATION: package.yml is validating commit $validated from '$branch'; current branch head is $branchHead."
          if ($validated -ne $branchHead) {
            Write-Host "::warning::WORKFLOW_CHECKOUT_STALE: package.yml is validating $validated, not current '$branch' head $branchHead. For workflow_run, this is the native artifact pipeline commit and can lag behind the branch head."
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.401
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      # Restore-only, and keyed character-identically to the cache native.yml
      # saves. Identical because hashFiles over a different file list yields a
      # different digest and the restore would silently never hit -- the same
      # failure the coverage gate shipped with. Restore-only because this
      # workflow consumes the native install rather than producing it: a save
      # here could write a smaller archive under the producer's key, and
      # actions/cache never overwrites, so native.yml would restore a partial
      # tree from then on. On a miss the steps below build from source, which is
      # slow but correct and only happens while the native pipeline is still
      # producing the archive for a native change.
      - id: native-cache
        if: >-
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/install/${{ matrix.rid }}
            native/install/shim/${{ matrix.rid }}
            native/install/vulkan-sdk-1.4.363.0
            native/install/shaderc/${{ matrix.rid }}
            native/build/shim/${{ matrix.rid }}
          key: >-
            native-${{ matrix.rid }}-${{ hashFiles(
              'eng/openusd.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/cmake/ShaderCompiler.cmake',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE',
              'eng/check-linux-native-prerequisites.ps1',
              'eng/native-install-metadata.ps1',
              'native/CMakeLists.txt',
              'native/CMakePresets.json',
              'native/**/CMakeLists.txt',
              'native/**/*.cmake',
              'native/**/*.json',
              'native/**/*.in',
              'native/**/resources/**',
              'native/**/*.c',
              'native/**/*.cc',
              'native/**/*.cpp',
              'native/**/*.cxx',
              'native/**/*.m',
              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
              '!native/.cache/**'
            ) }}
      - name: Install Linux package and NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang
          libgl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev libwayland-dev zlib1g-dev
      - name: Install Linux native build prerequisites
        if: >-
          matrix.rid == 'linux-x64' &&
          env.LINUX_NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS != 'true'
        run: >-
          sudo apt-get install -y
          build-essential cmake ninja-build pkg-config libxt-dev libxtst-dev patchelf binutils
      - name: Validate Linux native prerequisite preflight contract
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: ./eng/test-linux-native-prerequisites.ps1
      - name: Preflight Linux native build prerequisites
        if: >-
          matrix.rid == 'linux-x64' &&
          env.LINUX_NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS != 'true'
        shell: pwsh
        run: ./eng/check-linux-native-prerequisites.ps1
      - name: Prepare validated six-entry Metal library
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          ./eng/shaders/prepare-metal-library.ps1 `
            -OutputRoot eng/shaders/out/package-metal-library
      - name: Install macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Fetch locked native sources
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS != 'true' &&
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        shell: pwsh
        run: ./eng/fetch-native.ps1 -Rid ${{ matrix.rid }}
      - name: Build locked native install
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS != 'true' &&
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        shell: pwsh
        run: ./eng/build-native.ps1 -Rid ${{ matrix.rid }}
      # A main push can defer while native.yml produces the matching archive;
      # workflow_run reruns these gates against that exact artifact. Pull requests
      # build from source on a cache miss so their exact-head package gates never
      # pass by skipping native work.
      - name: Report a deferred smoke when the native tree is not published yet
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          env.DEFER_ON_NATIVE_CACHE_MISS == 'true' &&
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        shell: pwsh
        run: |
          Write-Host (
            '::notice::PACKAGE_SMOKE_DEFERRED: no verified native install for ' +
            '${{ matrix.rid }} at this commit. The native artifact pipeline has ' +
            'not published this native tree yet; this main push will be covered ' +
            'by workflow_run once it has.')
      - id: native-ready
        shell: pwsh
        run: |
          $source = switch ('${{ matrix.rid }}') {
            'win-x64' { '${{ env.WINDOWS_NATIVE_SOURCE }}' }
            'linux-x64' { '${{ env.LINUX_NATIVE_SOURCE }}' }
            'osx-arm64' { '${{ env.MACOS_NATIVE_SOURCE }}' }
            default { 'build' }
          }
          $ready = $source -eq 'archive' -or
            '${{ steps.native-cache.outputs.cache-hit }}' -eq 'true' -or
            '${{ env.DEFER_ON_NATIVE_CACHE_MISS }}' -ne 'true'
          "ready=$($ready.ToString().ToLowerInvariant())" |
            Out-File $env:GITHUB_OUTPUT -Append
      - name: Download verified native pipeline archive
        if: env.NATIVE_PIPELINE_RUN_ID != '' && steps.native-ready.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.NATIVE_PIPELINE_RUN_ID }}
          name: openusd-native-${{ matrix.rid }}
          path: artifacts/native-pipeline/${{ matrix.rid }}
      - name: Extract immutable Windows native archive
        if: >-
          matrix.rid == 'win-x64' &&
          env.WINDOWS_NATIVE_SOURCE == 'archive' &&
          steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid win-x64 `
            -Source archive `
            -PipelineRoot artifacts/native-pipeline/win-x64
      - name: Extract immutable Linux native archive
        if: >-
          matrix.rid == 'linux-x64' &&
          env.LINUX_NATIVE_SOURCE == 'archive' &&
          steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $pipelineRoot = if ($env:NATIVE_PIPELINE_RUN_ID) {
            'artifacts/native-pipeline/linux-x64'
          } else {
            ''
          }
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid linux-x64 `
            -Source archive `
            -ArchiveUri $env:LINUX_NATIVE_URL `
            -ArchiveSha256 $env:LINUX_NATIVE_SHA256 `
            -PipelineRoot $pipelineRoot
      - name: Extract immutable macOS native archive
        if: >-
          matrix.rid == 'osx-arm64' &&
          env.MACOS_NATIVE_SOURCE == 'archive' &&
          steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $pipelineRoot = if ($env:NATIVE_PIPELINE_RUN_ID) {
            'artifacts/native-pipeline/osx-arm64'
          } else {
            ''
          }
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid osx-arm64 `
            -Source archive `
            -ArchiveUri $env:MACOS_NATIVE_URL `
            -ArchiveSha256 $env:MACOS_NATIVE_SHA256 `
            -PipelineRoot $pipelineRoot
      - name: Verify native install metadata
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $requireVulkanRuntime =
            $IsWindows -and $env.WINDOWS_NATIVE_SOURCE -eq 'build'
          ./eng/native-install-metadata.ps1 `
            -Operation Verify `
            -Rid ${{ matrix.rid }} `
            -RequireVulkanRuntime:$requireVulkanRuntime
      - name: Verify complete archived native notices
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          python ./eng/generate-native-notices.py verify `
            --rid ${{ matrix.rid }} --install-root native/install/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw 'Native redistribution notices are incomplete or stale.' }
      - name: Verify public-release Linux Core codec package
        if: matrix.rid == 'linux-x64' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          dotnet pack `
            src/OpenUsd.Runtime.Core.linux-x64/OpenUsd.Runtime.Core.linux-x64.csproj `
            -c Release `
            --nologo `
            -p:PublicRelease=true `
            -o artifacts/linux-core-codec-package
      # The current Cesium shim still compiles when the verified SDK is reused,
      # so archive consumers continue to require the platform build toolchain.
      # Kept as its own named step rather than folded into the common install:
      # eng/test-linux-native-prerequisites.ps1 requires the archive-mode
      # prerequisites to stay free of build-only packages, and that contract is
      # what stops OpenUSD itself being quietly rebuilt on the archive path.
      - name: Install Linux Cesium build prerequisites
        if: matrix.rid == 'linux-x64' && steps.native-ready.outputs.ready == 'true'
        run: >-
          sudo apt-get install -y
          build-essential cmake ninja-build pkg-config libxt-dev libxtst-dev
          libvulkan1
      - id: cesium-sdk
        name: Import an exact-source verified Cesium SDK when available
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CESIUM_PIPELINE_RUN_ID: ${{ inputs['cesium-pipeline-run-id'] }}
          CESIUM_SOURCE_HEAD: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
                github.event.pull_request.head.sha || github.sha }}
        run: |
          $arguments = @('consume', '--rid', '${{ matrix.rid }}', '--source', $env:CESIUM_SOURCE_HEAD)
          if ($env:CESIUM_PIPELINE_RUN_ID) { $arguments += @('--run-id', $env:CESIUM_PIPELINE_RUN_ID) }
          python eng/cesium-sdk-artifact.py @arguments
      - id: cesium-vcpkg-cache
        if: steps.native-ready.outputs.ready == 'true' && steps.cesium-sdk.outputs.reused != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/.cache/vcpkg-*
            native/build/cesium/${{ matrix.rid }}/vcpkg_installed
          key: >-
            cesium-vcpkg-v2-${{ matrix.rid }}-${{ hashFiles(
              'eng/cesium.lock.json',
              'eng/fetch-cesium-native.ps1',
              'eng/build-cesium-native.ps1'
            ) }}
      - name: Build Cesium native install
        if: steps.native-ready.outputs.ready == 'true' && steps.cesium-sdk.outputs.reused != 'true'
        shell: pwsh
        run: ./eng/build-cesium-native.ps1 -Rid ${{ matrix.rid }} -SkipSmokeProbe
      - name: Verify complete Cesium redistribution notices
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: >
          python eng/generate-native-notices.py verify
          --family cesium --rid ${{ matrix.rid }}
          --install-root native/install/cesium/${{ matrix.rid }}
      - name: Build Cesium shim
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-cesium-shim.ps1 -Rid ${{ matrix.rid }} -PackageConsumer
      - id: physx-vcpkg-cache
        if: matrix.rid != 'osx-arm64' && steps.native-ready.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/.cache/vcpkg-*
            native/build/physx/${{ matrix.rid }}/vcpkg_installed
          key: >-
            physx-vcpkg-v2-${{ matrix.rid }}-${{ hashFiles(
              'eng/physx.lock.json',
              'eng/fetch-physx-native.ps1',
              'eng/build-physx-native.ps1'
            ) }}
      # The physics package carries a solver built from source, so the package job builds it here
      # rather than consuming the native archive. The simulation SDK is compiled statically, and
      # its GPU modules are proprietary NVIDIA blobs that are staged locally and never packaged.
      #
      # macOS is excluded because the pinned vcpkg port declares no arm64-osx support, so there is
      # no macOS physics package to build inputs for.
      - name: Build PhysX native install
        if: matrix.rid != 'osx-arm64' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-physx-native.ps1 -Rid ${{ matrix.rid }}
      - name: Build PhysX shim
        if: matrix.rid != 'osx-arm64' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/build-physx-shim.ps1 -Rid ${{ matrix.rid }} -PackageConsumer
      # The pinned port links PhysXVehicle2 into its aggregate SDK target only on Windows, so the
      # Linux vehicle path is the one that can regress without anyone noticing. This drives a real
      # four wheeled engine drive vehicle on Linux, which is the proof behind the vehicle
      # capability the physics package advertises there.
      - name: Prove Linux PhysX vehicles
        if: matrix.rid == 'linux-x64' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: >
          ctest
          --test-dir native/build/shim/linux-x64-physx
          -R openusd_physx_vehicle_probe
          --output-on-failure
      - name: Execute managed NativeAOT probe
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: >
          ./eng/run-native-probe.ps1
          -Rid ${{ matrix.rid }}
          -SkipNativeAbiProbe
      - name: Execute hdSilk NativeAOT probe
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: ./eng/run-silk-probe.ps1 -Rid ${{ matrix.rid }}
      - name: Verify relocated Linux ELF closure and NativeAOT Open without loader overrides
        if: runner.os == 'Linux' && steps.native-ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          repository = Path.cwd()
          clean = Path(tempfile.mkdtemp(prefix="openusd-clean-", dir=os.environ["RUNNER_TEMP"]))
          environment = {"PATH": "/usr/bin:/bin", "HOME": str(clean), "LANG": "C.UTF-8"}
          try:
              for root in (repository / "native/install/linux-x64/lib",
                           repository / "native/install/shim/linux-x64/lib"):
                  for library in root.iterdir():
                      if library.is_file() and ".so" in library.name:
                          shutil.copyfile(library, clean / library.name)
              shutil.copytree(repository / "native/install/linux-x64/lib/usd", clean / "usd")
              executable = clean / "OpenUsd.NativeProbe"
              shutil.copy2(repository / "artifacts/native-probe/linux-x64/OpenUsd.NativeProbe", executable)
              print("source=" + subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip())
              for library in sorted(clean.glob("*.so*")):
                  result = subprocess.run(["ldd", str(library)], env=environment,
                                          capture_output=True, text=True, check=True)
                  print(library.name + " sha256=" + hashlib.sha256(library.read_bytes()).hexdigest())
                  if "not found" in result.stdout:
                      raise RuntimeError(library.name + "\n" + result.stdout)
              subprocess.run([str(executable), "--properties", str(clean / "usd"),
                              str(clean / "properties")], cwd=clean, env=environment, check=True)
              print("CLEAN_LINUX_ELF_CLOSURE_AND_NATIVEAOT_OPEN_OK")
          finally:
              shutil.rmtree(clean)
          PY
      - name: Build package tests
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        # The MSVC developer environment exports Platform=x64, which makes MSBuild
        # write to bin\x64\Release instead of bin\Release and leaves the executable
        # the next step runs missing. Clear it for the managed build and run.
        env:
          Platform: ''
        run: dotnet build tests/OpenUsd.Package.Tests/OpenUsd.Package.Tests.csproj -c Release
      - name: Verify Metal package staging
        if: runner.os == 'macOS' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          dotnet pack `
            src/OpenUsd.Rendering.Silk.Metal/OpenUsd.Rendering.Silk.Metal.csproj `
            -c Release `
            -p:OpenUsdRequireMetalShaderLibrary=true `
            -p:OpenUsdMetalPythonExecutable=python `
            -o eng/shaders/out/package-metal
          python eng/shaders/scripts/verify-metal-package.py `
            --package-root eng/shaders/out/package-metal `
            --library eng/shaders/checked/mesh.metallib `
            --manifest eng/shaders/checked/mesh.metallib.manifest.json
      - name: Run required package execution gates
        if: steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        env:
          Platform: ''
        run: |
          $testApp = "tests/OpenUsd.Package.Tests/bin/Release/net10.0/OpenUsd.Package.Tests"
          if ($IsWindows) {
            $testApp += ".exe"
          }
          if (-not (Test-Path $testApp))
          {
            throw "The package test executable was not built at '$testApp'."
          }
          & $testApp --minimum-expected-tests 26
          exit $LASTEXITCODE
      - name: Require Linux ABI-9 SONAME topology and package-only evidence
        if: runner.os == 'Linux' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $archiveMode = $env:LINUX_NATIVE_SOURCE -eq 'archive'
          ./eng/validate-linux-package-evidence.ps1 `
            -RequireArchiveSource:$archiveMode
      - name: Require macOS signed Storm child package-only evidence
        if: runner.os == 'macOS' && steps.native-ready.outputs.ready == 'true'
        shell: pwsh
        run: |
          $archiveMode = $env:MACOS_NATIVE_SOURCE -eq 'archive'
          ./eng/validate-macos-package-evidence.ps1 `
            -RequireArchiveSource:$archiveMode
      - name: Upload package test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}-package-test-results
          path: |
            tests/OpenUsd.Package.Tests/bin/Release/net10.0/TestResults
            eng/shaders/out/package-metal-library/metallib-manifest.json
            eng/shaders/out/package-metal-library/mesh.metallib
            eng/shaders/out/package-metal/*.nupkg
            native/install/cesium/${{ matrix.rid }}/THIRD-PARTY-CESIUM.md
            artifacts/native-input/linux-x64/source.json
            artifacts/native-input/osx-arm64/source.json
            artifacts/package-linux-storm-child
            artifacts/package-macos-storm-child
