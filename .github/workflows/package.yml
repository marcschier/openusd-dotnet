name: package

on:
  workflow_call:
    inputs:
      linux-native-source:
        required: false
        default: build
        type: string
      linux-native-url:
        required: false
        type: string
      linux-native-sha256:
        required: false
        type: string
      macos-native-source:
        required: false
        default: build
        type: string
      macos-native-url:
        required: false
        type: string
      macos-native-sha256:
        required: false
        type: string
      native-pipeline-run-id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      linux-native-source:
        description: Build Linux inputs or download an immutable native archive
        required: true
        default: build
        type: choice
        options:
          - build
          - archive
      linux-native-url:
        description: HTTPS tar.gz for linux-x64 archive mode
        required: false
        type: string
      linux-native-sha256:
        description: SHA-256 for the linux-x64 tar.gz
        required: false
        type: string
      macos-native-source:
        description: Build macOS inputs or download an immutable native archive
        required: true
        default: build
        type: choice
        options:
          - build
          - archive
      macos-native-url:
        description: HTTPS tar.gz for osx-arm64 archive mode
        required: false
        type: string
      macos-native-sha256:
        description: SHA-256 for the osx-arm64 tar.gz
        required: false
        type: string
      native-pipeline-run-id:
        description: Native artifact workflow run ID to consume instead of URL archives
        required: false
        type: string
  # These gates only ever ran inside a release, and it cost five release runs
  # to ship 0.5.0-alpha because four of them were first-ever executions. This
  # runs them on every push to main instead, reusing the verified archive the
  # native pipeline just produced for the same commit rather than rebuilding
  # OpenUSD -- so the cost is the package jobs alone, not another 2.5 hours per
  # RID. A push trigger would rebuild, because the native cache here is a
  # separate namespace from the one native.yml fills.
  workflow_run:
    workflows: ['native artifact pipeline']
    types: [completed]
    branches: [main]
  # workflow_run alone is not enough: native.yml is path-filtered to native
  # inputs, so it never fires for a change to the packaging targets or the
  # package tests -- which is exactly what broke three of these gates. These
  # paths cover the managed side, and the native install is restored from the
  # cache native.yml already saved rather than rebuilt.
  push:
    branches: [ master, main ]
    paths: &package-paths
      - '.github/workflows/package.yml'
      - 'eng/pack-packages.ps1'
      - 'eng/run-native-probe.ps1'
      - 'eng/run-silk-probe.ps1'
      - 'eng/native-install-metadata.ps1'
      - 'src/OpenUsd.Runtime.Packaging/**'
      - 'src/OpenUsd.Runtime.Core*/**'
      - 'src/OpenUsd.Runtime.Imaging*/**'
      - 'src/OpenUsd.Runtime.Cesium*/**'
      - 'tests/OpenUsd.Package.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'version.json'
  pull_request:
    branches: [ master, main ]
    paths: *package-paths

permissions:
  contents: read
  actions: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-execution:
    name: ${{ matrix.name }} package-only NativeAOT execution
    # A workflow_run fires whatever the upstream conclusion was, so a failed or
    # cancelled native pipeline would otherwise send these jobs looking for an
    # archive that was never uploaded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rid: win-x64
          - name: Linux x64
            runner: ubuntu-latest
            rid: linux-x64
          - name: macOS arm64
            runner: macos-15
            rid: osx-arm64
    env:
      OPENUSD_PACKAGE_EXECUTION_REQUIRED: 'true'
      NATIVE_PIPELINE_RUN_ID: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id ||
            inputs['native-pipeline-run-id'] }}
      WINDOWS_NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' || 'build' }}
      LINUX_NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs['linux-native-source'] || 'build') }}
      LINUX_NATIVE_URL: ${{ inputs['linux-native-url'] }}
      LINUX_NATIVE_SHA256: ${{ inputs['linux-native-sha256'] }}
      MACOS_NATIVE_SOURCE: >-
        ${{ (github.event_name == 'workflow_run' ||
            inputs['native-pipeline-run-id']) && 'archive' ||
            (github.event_name == 'workflow_dispatch' &&
            inputs['macos-native-source'] || 'build') }}
      MACOS_NATIVE_URL: ${{ inputs['macos-native-url'] }}
      MACOS_NATIVE_SHA256: ${{ inputs['macos-native-sha256'] }}
      OpenUsdRequireMetalShaderLibrary: >-
        ${{ matrix.rid == 'osx-arm64' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # A workflow_run checks out the default branch by default, not the
          # commit that produced the archive these jobs are about to consume.
          # Pinning the triggering SHA keeps the tests and the native payload
          # describing the same tree.
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows' && env.WINDOWS_NATIVE_SOURCE == 'build'
        with:
          arch: x64
      # Restore-only, and keyed character-identically to the cache native.yml
      # saves. Identical because hashFiles over a different file list yields a
      # different digest and the restore would silently never hit -- the same
      # failure the coverage gate shipped with. Restore-only because this
      # workflow consumes the native install rather than producing it: a save
      # here could write a smaller archive under the producer's key, and
      # actions/cache never overwrites, so native.yml would restore a partial
      # tree from then on. On a miss the steps below build from source, which is
      # slow but correct and only happens while the native pipeline is still
      # producing the archive for a native change.
      - id: native-cache
        if: >-
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/install/${{ matrix.rid }}
            native/install/shim/${{ matrix.rid }}
            native/install/vulkan-sdk-1.4.321.0
            native/build/shim/${{ matrix.rid }}
          key: >-
            native-${{ matrix.rid }}-${{ hashFiles(
              'eng/openusd.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/check-linux-native-prerequisites.ps1',
              'eng/native-install-metadata.ps1',
              'native/CMakeLists.txt',
              'native/CMakePresets.json',
              'native/**/CMakeLists.txt',
              'native/**/*.cmake',
              'native/**/*.json',
              'native/**/*.in',
              'native/**/resources/**',
              'native/**/*.c',
              'native/**/*.cc',
              'native/**/*.cpp',
              'native/**/*.cxx',
              'native/**/*.m',
              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
              '!native/.cache/**'
            ) }}
      - name: Install Linux package and NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          clang
          libgl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev libwayland-dev zlib1g-dev
      - name: Install Linux native build prerequisites
        if: >-
          matrix.rid == 'linux-x64' &&
          env.LINUX_NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true'
        run: >-
          sudo apt-get install -y
          build-essential cmake ninja-build pkg-config libxt-dev libxtst-dev
      - name: Validate Linux native prerequisite preflight contract
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: ./eng/test-linux-native-prerequisites.ps1
      - name: Preflight Linux native build prerequisites
        if: >-
          matrix.rid == 'linux-x64' &&
          env.LINUX_NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./eng/check-linux-native-prerequisites.ps1
      - name: Prepare validated six-entry Metal library
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          ./eng/shaders/prepare-metal-library.ps1 `
            -OutputRoot eng/shaders/out/package-metal-library
      - name: Install macOS native build prerequisites
        if: >-
          runner.os == 'macOS' &&
          env.MACOS_NATIVE_SOURCE == 'build' &&
          steps.native-cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja
      - name: Fetch locked native sources
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        shell: pwsh
        run: ./eng/fetch-native.ps1 -Rid ${{ matrix.rid }}
      - name: Build locked native install
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          (matrix.rid != 'win-x64' || env.WINDOWS_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'linux-x64' || env.LINUX_NATIVE_SOURCE == 'build') &&
          (matrix.rid != 'osx-arm64' || env.MACOS_NATIVE_SOURCE == 'build')
        shell: pwsh
        run: ./eng/build-native.ps1 -Rid ${{ matrix.rid }}
      - name: Download verified native pipeline archive
        if: env.NATIVE_PIPELINE_RUN_ID != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.NATIVE_PIPELINE_RUN_ID }}
          name: openusd-native-${{ matrix.rid }}
          path: artifacts/native-pipeline/${{ matrix.rid }}
      - name: Extract immutable Windows native archive
        if: matrix.rid == 'win-x64' && env.WINDOWS_NATIVE_SOURCE == 'archive'
        shell: pwsh
        run: |
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid win-x64 `
            -Source archive `
            -PipelineRoot artifacts/native-pipeline/win-x64
      - name: Extract immutable Linux native archive
        if: matrix.rid == 'linux-x64' && env.LINUX_NATIVE_SOURCE == 'archive'
        shell: pwsh
        run: |
          $pipelineRoot = if ($env:NATIVE_PIPELINE_RUN_ID) {
            'artifacts/native-pipeline/linux-x64'
          } else {
            ''
          }
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid linux-x64 `
            -Source archive `
            -ArchiveUri $env:LINUX_NATIVE_URL `
            -ArchiveSha256 $env:LINUX_NATIVE_SHA256 `
            -PipelineRoot $pipelineRoot
      - name: Extract immutable macOS native archive
        if: matrix.rid == 'osx-arm64' && env.MACOS_NATIVE_SOURCE == 'archive'
        shell: pwsh
        run: |
          $pipelineRoot = if ($env:NATIVE_PIPELINE_RUN_ID) {
            'artifacts/native-pipeline/osx-arm64'
          } else {
            ''
          }
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid osx-arm64 `
            -Source archive `
            -ArchiveUri $env:MACOS_NATIVE_URL `
            -ArchiveSha256 $env:MACOS_NATIVE_SHA256 `
            -PipelineRoot $pipelineRoot
      - name: Verify native install metadata
        shell: pwsh
        run: |
          $requireVulkanRuntime =
            $IsWindows -and $env.WINDOWS_NATIVE_SOURCE -eq 'build'
          ./eng/native-install-metadata.ps1 `
            -Operation Verify `
            -Rid ${{ matrix.rid }} `
            -RequireVulkanRuntime:$requireVulkanRuntime
      - name: Execute managed NativeAOT probe
        shell: pwsh
        run: >
          ./eng/run-native-probe.ps1
          -Rid ${{ matrix.rid }}
          -SkipNativeAbiProbe
      - name: Execute hdSilk NativeAOT probe
        shell: pwsh
        run: ./eng/run-silk-probe.ps1 -Rid ${{ matrix.rid }}
      - name: Build package tests
        shell: pwsh
        # The MSVC developer environment exports Platform=x64, which makes MSBuild
        # write to bin\x64\Release instead of bin\Release and leaves the executable
        # the next step runs missing. Clear it for the managed build and run.
        env:
          Platform: ''
        run: dotnet build tests/OpenUsd.Package.Tests/OpenUsd.Package.Tests.csproj -c Release
      - name: Verify Metal package staging
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          dotnet pack `
            src/OpenUsd.Rendering.Silk.Metal/OpenUsd.Rendering.Silk.Metal.csproj `
            -c Release `
            -p:OpenUsdRequireMetalShaderLibrary=true `
            -p:OpenUsdMetalPythonExecutable=python `
            -o eng/shaders/out/package-metal
          python eng/shaders/scripts/verify-metal-package.py `
            --package-root eng/shaders/out/package-metal `
            --library eng/shaders/checked/mesh.metallib `
            --manifest eng/shaders/checked/mesh.metallib.manifest.json
      - name: Run required package execution gates
        shell: pwsh
        env:
          Platform: ''
        run: |
          $testApp = "tests/OpenUsd.Package.Tests/bin/Release/net10.0/OpenUsd.Package.Tests"
          if ($IsWindows) {
            $testApp += ".exe"
          }
          if (-not (Test-Path $testApp))
          {
            throw "The package test executable was not built at '$testApp'."
          }
          & $testApp --minimum-expected-tests 22
          exit $LASTEXITCODE
      - name: Require Linux ABI-7 SONAME topology and package-only evidence
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $archiveMode = $env:LINUX_NATIVE_SOURCE -eq 'archive'
          ./eng/validate-linux-package-evidence.ps1 `
            -RequireArchiveSource:$archiveMode
      - name: Require macOS signed Storm child package-only evidence
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $archiveMode = $env:MACOS_NATIVE_SOURCE -eq 'archive'
          ./eng/validate-macos-package-evidence.ps1 `
            -RequireArchiveSource:$archiveMode
      - name: Upload package test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.rid }}-package-test-results
          path: |
            tests/OpenUsd.Package.Tests/bin/Release/net10.0/TestResults
            eng/shaders/out/package-metal-library/metallib-manifest.json
            eng/shaders/out/package-metal-library/mesh.metallib
            eng/shaders/out/package-metal/*.nupkg
            artifacts/native-input/linux-x64/source.json
            artifacts/native-input/osx-arm64/source.json
            artifacts/package-linux-storm-child
            artifacts/package-macos-storm-child
