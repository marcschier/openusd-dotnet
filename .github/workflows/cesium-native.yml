name: cesium-native artifact pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/cesium-native.yml'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'native/cesium_probe/**'
      - 'src/OpenUsd.Runtime.Cesium.*/**'
      - 'src/OpenUsd.Runtime.Packaging/OpenUsd.Runtime.Cesium.Packaging.targets'
  pull_request:
    branches: [ master, main ]
    paths:
      - '.github/workflows/cesium-native.yml'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'native/cesium_probe/**'
      - 'src/OpenUsd.Runtime.Cesium.*/**'
      - 'src/OpenUsd.Runtime.Packaging/OpenUsd.Runtime.Cesium.Packaging.targets'

permissions:
  contents: read

concurrency:
  group: cesium-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }} locked cesium-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential cmake ninja-build pkg-config
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/.cache/vcpkg-56bb24116092
            native/install/cesium/${{ matrix.rid }}
            native/build/cesium/${{ matrix.rid }}
            native/build/cesium-probe/${{ matrix.rid }}
          key: >-
            cesium-native-${{ matrix.rid }}-${{ hashFiles(
              'eng/cesium.lock.json',
              'eng/fetch-cesium-native.ps1',
              'eng/build-cesium-native.ps1',
              'native/cesium_probe/**'
            ) }}
      - name: Build locked cesium-native
        shell: pwsh
        run: ./eng/build-cesium-native.ps1 -Rid ${{ matrix.rid }}
      - name: Pack opt-in Cesium runtime
        shell: pwsh
        run: >-
          ./eng/pack-packages.ps1
          -Scope cesium-runtime
          -Rid ${{ matrix.rid }}
          -OutputPath artifacts/cesium-nupkg
      - name: Report Cesium output sizes
        shell: pwsh
        run: |
          $install = Get-ChildItem native/install/cesium/${{ matrix.rid }} -Recurse -File |
            Measure-Object Length -Sum
          $libraries = Get-ChildItem native/install/cesium/${{ matrix.rid }}/lib -Recurse -File |
            Measure-Object Length -Sum
          $package = Get-ChildItem artifacts/cesium-nupkg/OpenUsd.Runtime.Cesium.${{ matrix.rid }}.*.nupkg |
            Select-Object -First 1
          "install-bytes=$($install.Sum)" | Tee-Object -FilePath artifacts/cesium-size-${{ matrix.rid }}.txt
          "library-bytes=$($libraries.Sum)" | Tee-Object -FilePath artifacts/cesium-size-${{ matrix.rid }}.txt -Append
          "package-bytes=$($package.Length)" | Tee-Object -FilePath artifacts/cesium-size-${{ matrix.rid }}.txt -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-runtime-cesium-${{ matrix.rid }}
          path: |
            artifacts/cesium-nupkg/
            artifacts/cesium-size-${{ matrix.rid }}.txt
          if-no-files-found: error
          retention-days: 30
