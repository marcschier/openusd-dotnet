name: cesium-native artifact pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/cesium-native.yml'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'eng/generate-native-notices.py'
      - 'eng/sbom/cesium-vcpkg-components.lock.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'native/cesium_probe/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - '.github/workflows/cesium-native.yml'
      - 'eng/cesium.lock.json'
      - 'eng/fetch-cesium-native.ps1'
      - 'eng/build-cesium-native.ps1'
      - 'eng/generate-native-notices.py'
      - 'eng/sbom/cesium-vcpkg-components.lock.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'native/cesium_probe/**'

permissions:
  contents: read

concurrency:
  group: cesium-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }} locked cesium-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential cmake ninja-build pkg-config
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/.cache/vcpkg-e456309491fd
            native/install/cesium/${{ matrix.rid }}
            native/build/cesium/${{ matrix.rid }}
            native/build/cesium-probe/${{ matrix.rid }}
          key: >-
            cesium-native-${{ matrix.rid }}-${{ hashFiles(
              'eng/cesium.lock.json',
              'eng/fetch-cesium-native.ps1',
              'eng/build-cesium-native.ps1',
              'eng/generate-native-notices.py',
              'eng/sbom/cesium-vcpkg-components.lock.json',
              'LICENSE',
              'NOTICE',
              'native/cesium_probe/**'
            ) }}
      - name: Build locked cesium-native
        shell: pwsh
        run: ./eng/build-cesium-native.ps1 -Rid ${{ matrix.rid }}
      - name: Report Cesium output sizes
        shell: pwsh
        run: |
          # Tee-Object does not create missing parents, so every leg of run
          # 31210680530 failed here after a successful 18-minute build.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $install = Get-ChildItem native/install/cesium/${{ matrix.rid }} -Recurse -File |
            Measure-Object Length -Sum
          $libraries = Get-ChildItem native/install/cesium/${{ matrix.rid }}/lib -Recurse -File |
            Measure-Object Length -Sum
          "install-bytes=$($install.Sum)" | Tee-Object -FilePath artifacts/cesium-size-${{ matrix.rid }}.txt
          "library-bytes=$($libraries.Sum)" | Tee-Object -FilePath artifacts/cesium-size-${{ matrix.rid }}.txt -Append
          "package-bytes=deferred-until-c-abi-shim" |
            Tee-Object -FilePath artifacts/cesium-size-${{ matrix.rid }}.txt -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openusd-cesium-native-size-${{ matrix.rid }}
          path: |
            artifacts/cesium-size-${{ matrix.rid }}.txt
          if-no-files-found: error
          retention-days: 30
