name: release gate

on:
  workflow_dispatch:
  push:
    branches: [ 'release/**' ]
    tags: [ 'v*' ]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  shaders:
    uses: ./.github/workflows/shaders.yml

  native:
    uses: ./.github/workflows/native.yml

  performance:
    uses: ./.github/workflows/performance.yml

  # Both of these rebuilt OpenUSD from source on every job, because they guarded
  # their archive path on github.event_name == 'workflow_call'. A called workflow
  # sees the CALLER's event, which here is the tag push, so that guard never fired
  # and the verified openusd-native-<rid> artifacts this run already produced went
  # unused. Pass the run id explicitly instead.
  packages:
    needs: [ ci, shaders, native ]
    uses: ./.github/workflows/package.yml
    with:
      native-pipeline-run-id: ${{ github.run_id }}

  render:
    needs: packages
    uses: ./.github/workflows/render.yml
    with:
      native-pipeline-run-id: ${{ github.run_id }}

  aggregate:
    name: aggregate release evidence
    if: always()
    needs: [ ci, shaders, native, performance, packages, render ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Write release gate evidence
        shell: pwsh
        run: |
          $results = [ordered]@{
            schemaVersion = 1
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            completedAt = [DateTimeOffset]::UtcNow.ToString('O')
            jobs = [ordered]@{
              ci = '${{ needs.ci.result }}'
              shaders = '${{ needs.shaders.result }}'
              native = '${{ needs.native.result }}'
              performance = '${{ needs.performance.result }}'
              packages = '${{ needs.packages.result }}'
              render = '${{ needs.render.result }}'
            }
          }
          $root = 'artifacts/release-gate'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $path = Join-Path $root 'release-gate.json'
          $results | ConvertTo-Json -Depth 5 | Set-Content $path
      - name: Upload release gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-${{ github.run_id }}
          path: artifacts/release-gate/release-gate.json
          if-no-files-found: error
          retention-days: 90
      - name: Require every release gate
        shell: pwsh
        run: |
          $results = @(
            '${{ needs.ci.result }}',
            '${{ needs.shaders.result }}',
            '${{ needs.native.result }}',
            '${{ needs.performance.result }}',
            '${{ needs.packages.result }}',
            '${{ needs.render.result }}')
          if ($results | Where-Object { $_ -cne 'success' }) {
            throw "Release gates failed: $($results -join ', ')."
          }

  pack:
    name: pack ${{ matrix.rid }} packages
    # Packing is split by platform out of necessity rather than preference. The Metal
    # package embeds the macOS-only mesh.metallib, and the Linux and macOS Imaging
    # packages run ELF and Mach-O validation that only their own platform can perform and
    # whose evidence is embedded in the package, so a single host cannot produce all of
    # them without changing what is published.
    #
    # This depends on the gates that validate these artifacts rather than on the
    # aggregate. ci, shaders, native and packages together build, verify and execute the
    # exact packages published here, with packages running the package-only consumer
    # gates on all three platforms. render covers viewer and windowing behaviour that no
    # published package depends on, and the aggregate requires it, so a render regression
    # still turns a release run red rather than being silently dropped.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ ci, shaders, native, packages ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.301
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux Cesium build prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential cmake ninja-build pkg-config libgl1-mesa-dev libglu1-mesa-dev
          libx11-dev libxt-dev libxtst-dev zlib1g-dev
      - name: Install macOS Cesium build prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Stamp the release version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Tag '${{ github.ref_name }}' is not a semantic version."
          }
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content version.json
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      # The archives come from the native job in this same run, so the published bytes
      # are the bytes the release gates verified.
      - name: Download the verified native archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          name: openusd-native-${{ matrix.rid }}
          path: artifacts/native-pipeline/${{ matrix.rid }}
      - name: Stage the native install
        shell: pwsh
        run: |
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid ${{ matrix.rid }} `
            -Source archive `
            -PipelineRoot artifacts/native-pipeline/${{ matrix.rid }}
          ./eng/native-install-metadata.ps1 -Operation Verify -Rid ${{ matrix.rid }}
      - id: cesium-vcpkg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            native/.cache/vcpkg-*
            native/build/cesium/${{ matrix.rid }}/vcpkg_installed
          key: >-
            cesium-vcpkg-${{ matrix.rid }}-${{ hashFiles(
              'eng/cesium.lock.json',
              'eng/fetch-cesium-native.ps1',
              'eng/build-cesium-native.ps1',
              'eng/build-cesium-shim.ps1'
            ) }}
      - name: Build Cesium native install
        shell: pwsh
        run: ./eng/build-cesium-native.ps1 -Rid ${{ matrix.rid }} -SkipSmokeProbe
      - name: Build Cesium shim
        shell: pwsh
        run: ./eng/build-cesium-shim.ps1 -Rid ${{ matrix.rid }}
      - name: Pack the runtime packages for this RID
        shell: pwsh
        env:
          Platform: ''
        run: |
          ./eng/pack-packages.ps1 `
            -Scope runtime `
            -Rid ${{ matrix.rid }} `
            -OutputPath artifacts/nupkg
      # The platform-neutral libraries are packed once, on Linux, so the same bytes are
      # not produced three times and then have to be reconciled.
      - name: Pack the platform-neutral packages
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: ./eng/pack-packages.ps1 -Scope managed -OutputPath artifacts/nupkg
      # mesh.metallib is a hosted macOS/Xcode artifact and is never fabricated elsewhere.
      - name: Prepare the validated Metal library and pack it
        if: matrix.rid == 'osx-arm64'
        shell: pwsh
        run: |
          ./eng/shaders/prepare-metal-library.ps1 `
            -OutputRoot eng/shaders/out/package-metal-library
          ./eng/pack-packages.ps1 -Scope metal -OutputPath artifacts/nupkg
      - name: Upload the packed packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-nupkg-${{ matrix.rid }}
          path: artifacts/nupkg
          if-no-files-found: error
          retention-days: 90

  viewer-distribution:
    name: viewer distribution ${{ matrix.rid }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - name: Install Linux viewer smoke prerequisites
        if: matrix.rid == 'linux-x64'
        shell: bash
        # libopengl0 and libglx0 carry libOpenGL.so.0 and libGLX.so.0. Without
        # them the bundle cannot load openusd_storm_child and the Viewer aborted
        # before drawing a frame. libgl1-mesa-dri alone supplies a driver, not
        # the GLVND entry points the loader actually resolves against; the other
        # jobs get them transitively from -dev packages a runtime smoke should
        # not need.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1 libgl1 libglx0 libopengl0 libgl1-mesa-dri libx11-6 xvfb
      - name: Stamp the release version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Tag '${{ github.ref_name }}' is not a semantic version."
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
      - name: Download packed packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openusd-nupkg-*
          merge-multiple: true
          path: artifacts/nupkg
      - name: Build package-only Viewer bundle
        shell: pwsh
        env:
          OPENUSD_WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.OPENUSD_WINDOWS_CODESIGN_PFX_BASE64 }}
          OPENUSD_WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.OPENUSD_WINDOWS_CODESIGN_PFX_PASSWORD }}
          OPENUSD_WINDOWS_TIMESTAMP_URL: ${{ secrets.OPENUSD_WINDOWS_TIMESTAMP_URL }}
          OPENUSD_APPLE_DEVELOPER_ID: ${{ secrets.OPENUSD_APPLE_DEVELOPER_ID }}
          OPENUSD_APPLE_ID: ${{ secrets.OPENUSD_APPLE_ID }}
          OPENUSD_APPLE_TEAM_ID: ${{ secrets.OPENUSD_APPLE_TEAM_ID }}
          OPENUSD_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.OPENUSD_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ./eng/publish-viewer-bundle.ps1 `
            -Rid ${{ matrix.rid }} `
            -PackageSource artifacts/nupkg `
            -PackageVersion $env:VERSION
      - name: Smoke the installed Viewer bundle
        if: matrix.rid != 'linux-x64'
        shell: pwsh
        run: |
          $archive = Get-ChildItem `
            artifacts/viewer-distribution/artifacts/${{ matrix.rid }} `
            -Filter 'OpenUsd.Viewer.${{ matrix.rid }}.*' |
            Where-Object { $_.Name -notmatch '\.symbols\.|\.sha256$|\.json$' } |
            Select-Object -First 1
          ./eng/test-viewer-bundle-smoke.ps1 `
            -Rid ${{ matrix.rid }} `
            -BundlePath $archive.FullName
      - name: Smoke the installed Linux Viewer bundle
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac -nolisten tcp \
            >artifacts/viewer-distribution/linux-xvfb.out \
            2>artifacts/viewer-distribution/linux-xvfb.err &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          bundle=$(find artifacts/viewer-distribution/artifacts/linux-x64 \
            -maxdepth 1 -name 'OpenUsd.Viewer.linux-x64.tar.gz' -print -quit)
          pwsh ./eng/test-viewer-bundle-smoke.ps1 \
            -Rid linux-x64 \
            -BundlePath "$bundle"
      - name: Upload Viewer distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-viewer-${{ matrix.rid }}
          path: artifacts/viewer-distribution/artifacts/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload Viewer smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-viewer-smoke-${{ matrix.rid }}
          path: artifacts/viewer-distribution-smoke
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish packages
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      # This job publishes rather than builds, so it carried no checkout. It
      # needs one now: the gate below reads the published set out of
      # eng/pack-packages.ps1 instead of restating a count, and that file has to
      # be on disk for it to do so.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.301
      - name: Download every packed set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openusd-nupkg-*
          merge-multiple: true
          path: artifacts/nupkg
      - name: Require the complete published set
        shell: pwsh
        # Compared by name against eng/pack-packages.ps1 rather than against a
        # count written here. A restated number drifts the instant the set
        # changes -- deferring the Cesium packages took it from 22 to 17 and
        # this gate only said so after a multi-hour run had already produced
        # every artifact. Comparing names also catches the wrong package being
        # present, which a count never could.
        run: |
          $expected = @(& ./eng/pack-packages.ps1 -ListPublished)
          if ($LASTEXITCODE -ne 0 -or $expected.Count -eq 0)
          {
            throw 'eng/pack-packages.ps1 -ListPublished produced no package ids.'
          }
          $packages = @(Get-ChildItem artifacts/nupkg -Filter '*.nupkg')
          Write-Host "Packed $($packages.Count) package(s):"
          $packages | ForEach-Object { Write-Host "  $($_.Name)" }
          $actual = @($packages | ForEach-Object {
            $_.Name -replace '\.\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?\.nupkg$', ''
          })
          $missing = @($expected | Where-Object { $actual -notcontains $_ })
          $unexpected = @($actual | Where-Object { $expected -notcontains $_ })
          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0)
          {
            throw (
              "The packed set does not match the published set. " +
              "Missing: $($missing -join ', '). Unexpected: $($unexpected -join ', ').")
          }
          Write-Host "Verified all $($expected.Count) published package(s)."
      - name: Generate release SBOM
        shell: pwsh
        run: |
          python eng/generate-sbom.py `
            --output artifacts/sbom/openusd-release.cdx.json
          python eng/generate-sbom.py `
            --output artifacts/sbom/openusd-release.cdx.json `
            --validate
      - name: Upload the release SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-release-sbom
          path: artifacts/sbom/openusd-release.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Ensure GitHub release exists for SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists."
            exit 0
          fi

          notes="Draft release created by release.yml so release artifacts can be attached. "
          notes+="Release notes are curated manually before publishing."
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --notes "$notes"
      - name: Upload the SBOM to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload
          '${{ github.ref_name }}'
          artifacts/sbom/openusd-release.cdx.json
          --clobber
      # GITHUB_TOKEN is auto-issued and this job requests packages: write, so the
      # GitHub Packages feed needs no additional secret. Every package goes here.
      # --no-symbols is required: dotnet nuget push uploads an adjacent .snupkg
      # automatically, and the GitHub feed rejects symbol packages.
      - name: Push to the GitHub Packages NuGet feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push 'artifacts/nupkg/*.nupkg' `
            --api-key $env:GITHUB_TOKEN `
            --source https://nuget.pkg.github.com/marcschier/index.json `
            --no-symbols `
            --skip-duplicate
      # nuget.org promotion is deliberately NOT done here. The trusted-publishing
      # policy on nuget.org is bound to a specific workflow filename, and it names
      # nuget.yml. Attempting the OIDC exchange from release.yml fails with
      # "Workflow mismatch for policy 'OpenUsd': expected 'nuget.yml', actual
      # 'release.yml'" (HTTP 401), which shipped as a failed publish job on the
      # 0.4.0-alpha release even though every package had already reached the
      # GitHub feed successfully.
      #
      # An earlier version of this job pushed to nuget.org from here on the
      # assumption that the policy would accept any workflow in the repository.
      # It does not, and binding the policy to one workflow is the safer
      # arrangement: only that one file can mint a nuget.org token.
      #
      # nuget.org is also a one-way door, so promotion stays a separate,
      # deliberate step. After this job completes, promote with:
      #
      #   gh workflow run nuget.yml -f version=<version>
      #
      # nuget.yml pulls the exact packages from the GitHub feed, so it promotes
      # what was actually published rather than rebuilding.
      - name: Upload the published packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openusd-published-nupkgs
          path: artifacts/nupkg
          if-no-files-found: error
          retention-days: 90
