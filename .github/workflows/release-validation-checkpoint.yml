name: release validation checkpoint

on:
  pull_request:
    branches: [ master, main ]
    paths:
      - '.github/workflows/release-validation-checkpoint.yml'
      - 'Directory.Packages.props'
      - 'eng/assert-volume-camera-evidence.ps1'
      - 'eng/assert-viewer-compiler-redistribution.ps1'
      - 'eng/diagnostics/metal-volume-math.metal'
      - 'eng/diagnostics/metal-volume-math.swift'
      - 'eng/managed-workflow-reports.ps1'
      - 'eng/mesa-lavapipe-test-runtime.lock.json'
      - 'eng/metal-volume-repro-report.ps1'
      - 'eng/primitive-id-transport-report.ps1'
      - 'eng/publish-viewer-bundle.ps1'
      - 'eng/run-windows-lavapipe-primitive-probe.ps1'
      - 'eng/select_native_diagnostic.py'
      - 'eng/silk-cubic-shadow-report.ps1'
      - 'eng/test-metal-volume-repro-report.ps1'
      - 'eng/test-primitive-id-transport-report.ps1'
      - 'eng/test-silk-cubic-shadow-report.ps1'
      - 'eng/test-windows-lavapipe-primitive-probe.ps1'
      - 'eng/test-viewer-compiler-redistribution.ps1'
      - 'eng/verify-nuget-promotion.py'
      - 'eng/verify-spirv-cross-provenance.py'
      - 'eng/tests/test_release_validation_checkpoint.py'
      - 'eng/tests/test_select_native_diagnostic.py'
      - 'eng/tests/test_verify_nuget_promotion.py'
      - 'eng/tests/test_verify_spirv_cross_provenance.py'
      - 'native/hdSilk/src/mesh.cpp'
      - 'native/hdSilk/src/sceneState.cpp'
      - 'native/hdSilk/tests/CMakeLists.txt'
      - 'native/hdSilk/tests/geometry_sync_test_hook.cpp'
      - 'native/hdSilk/tests/hdsilk_direct_lights_probe.cpp'
      - 'native/hdSilk/tests/hdsilk_mesh_preparation_probe.cpp'
      - 'native/hdSilk/tests/hdsilk_direct_lights_session_probe.cpp'
      - 'native/hdSilk/tests/hdsilk_direct_lights_test_decode.h'
      - 'native/hdSilk/include/openusd_hdsilk.h'
      - 'native/openusd_dotnet/include/openusd_dotnet.h'
      - 'native/include/openusd_render_camera.h'
      - 'tests/OpenUsd.Rendering.ConformanceTests/PrimitiveIdProbeVulkanDevice.cs'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-validation-checkpoint-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  shadow-report-contract:
    name: Shadow report contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate shadow and volume evidence guards
        shell: pwsh
        env:
          OPENUSD_TEST_WORK_ROOT: ${{ runner.temp }}/openusd-report-contract
        run: ./eng/test-silk-cubic-shadow-report.ps1

  native-session-probe-syntax:
    name: Native direct-light session probe syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile the session probe without linking
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsyntax-only \
            -Inative/hdSilk/tests \
            -Inative/hdSilk/include \
            -Inative/openusd_dotnet/include \
            -Inative/include \
            native/hdSilk/tests/hdsilk_direct_lights_session_probe.cpp

  linux-shadow-volume-repro:
    name: Linux shadow and volume native diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify native diagnostic selection
        run: python3 -m unittest eng.tests.test_select_native_diagnostic
      - name: Select a source-compatible Linux native artifact
        id: diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 ./eng/select_native_diagnostic.py \
            --repository "$GITHUB_REPOSITORY" --branch "$EXPECTED_BRANCH" --head "$EXPECTED_HEAD"
      - name: Record diagnostic archive provenance
        if: steps.diagnostic.outputs.compatible == 'true'
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          NATIVE_RUN: ${{ steps.diagnostic.outputs.native_run_id }}
          NATIVE_SOURCE: ${{ steps.diagnostic.outputs.native_source }}
          NATIVE_CHECKOUT: ${{ steps.diagnostic.outputs.native_checkout }}
          NATIVE_TREE: ${{ steps.diagnostic.outputs.native_tree }}
          NATIVE_STATUS: ${{ steps.diagnostic.outputs.native_status }}
          NATIVE_CONCLUSION: ${{ steps.diagnostic.outputs.native_conclusion }}
        run: |
          mkdir -p artifacts/shadow-volume-repro
          printf 'diagnosticHead=%s\nnativeRunId=%s\nnativeSource=%s\nnativeCheckout=%s\nnativeTree=%s\nnativeStatus=%s\nnativeConclusion=%s\n' \
            "$SOURCE_HEAD" "$NATIVE_RUN" "$NATIVE_SOURCE" "$NATIVE_CHECKOUT" "$NATIVE_TREE" "$NATIVE_STATUS" "$NATIVE_CONCLUSION" \
            > artifacts/shadow-volume-repro/native-source.txt
      - name: Download source-compatible native artifact for diagnosis
        if: steps.diagnostic.outputs.compatible == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.diagnostic.outputs.native_run_id }}
          name: openusd-native-linux-x64
          path: artifacts/diagnostic-native/linux-x64
      - name: Prepare and stage the native runtime
        if: steps.diagnostic.outputs.compatible == 'true'
        id: native
        shell: pwsh
        run: |
          ./eng/prepare-workflow-native-input.ps1 `
            -Rid linux-x64 -Source archive -PipelineRoot artifacts/diagnostic-native/linux-x64
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'artifacts/shadow-volume-repro/runtime'
          $bin = Join-Path $runtime 'bin'
          $lib = Join-Path $runtime 'lib'
          $plugins = Join-Path $runtime 'plugin/usd'
          New-Item -ItemType Directory -Force -Path $bin, $lib, $plugins | Out-Null
          foreach ($layout in @(
            @{ Source = 'native/install/linux-x64/bin'; Target = $bin },
            @{ Source = 'native/install/linux-x64/lib'; Target = $lib },
            @{ Source = 'native/install/shim/linux-x64/bin'; Target = $bin },
            @{ Source = 'native/install/shim/linux-x64/lib'; Target = $lib })) {
            if (Test-Path -LiteralPath $layout.Source -PathType Container) {
              Get-ChildItem -LiteralPath $layout.Source -File |
                Where-Object { $_.Name -match '\.dll$|\.dylib$|\.so($|\.)' } |
                Copy-Item -Destination $layout.Target -Force
            }
          }
          foreach ($source in @(
            'native/install/linux-x64/lib/usd',
            'native/install/linux-x64/plugin/usd',
            'native/install/shim/linux-x64/plugin/usd')) {
            if (Test-Path -LiteralPath $source -PathType Container) {
              Copy-Item (Join-Path $source '*') $plugins -Recurse -Force
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $plugins 'plugInfo.json') -PathType Leaf)) {
            throw 'The diagnostic runtime is missing the OpenUSD plugin root.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.diagnostic.outputs.compatible == 'true'
        with:
          dotnet-version: 10.0.403
      - name: Build current conformance tests
        if: steps.diagnostic.outputs.compatible == 'true'
        id: build
        shell: pwsh
        run: |
          dotnet build tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj `
            -c Release -f net10.0 -p:OpenUsdRequireMetalShaderLibrary=false -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install software Vulkan
        if: steps.diagnostic.outputs.compatible == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libopengl0
      - name: Locate lavapipe
        if: steps.diagnostic.outputs.compatible == 'true'
        id: vulkan
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d \
            /usr/lib/x86_64-linux-gnu/vulkan/icd.d \
            -name 'lvp_icd*.json' 2>/dev/null | sort | head -n1 || true)"
          if [ -z "$icd" ]; then
            echo "::error::A lavapipe ICD is required."
            exit 1
          fi
          echo "icd=$icd" >> "$GITHUB_OUTPUT"
      - name: Reproduce moved point-shadow update
        if: steps.diagnostic.outputs.compatible == 'true'
        id: point
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ steps.vulkan.outputs.icd }}
          VK_ICD_FILENAMES: ${{ steps.vulkan.outputs.icd }}
          OPENUSD_TEST_PLUGIN_PATH: ${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/plugin/usd
          OPENUSD_PLUGIN_PATH: ${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/plugin/usd
          OPENUSD_DIRECT_LIGHT_EXECUTION_REQUIRED: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/lib:${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/bin
        run: |
          $reportPath = 'tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/OpenUsd.Rendering.ConformanceTests-linux-net10.0.tunit-report.json'
          $retainedPath = 'artifacts/shadow-volume-repro/point-shadow.tunit-report.json'
          if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
            Remove-Item -LiteralPath $reportPath
          }
          try {
            ./eng/run-managed-tests.ps1 `
              -Project tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj `
              -Framework net10.0 -Configuration Release -MinimumExpectedTests 1 `
              -TestArguments @(
                '--treenode-filter',
                '/*/*/SilkPointShadowNativeConformanceTests/AuthoredBoundedPointShadowMatchesAnalyticPixelsWhenSupported')
          }
          finally {
            if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
              Copy-Item -LiteralPath $reportPath -Destination $retainedPath
            }
          }
          if (-not (Test-Path -LiteralPath $retainedPath -PathType Leaf)) {
            throw 'The moved point-shadow diagnostic report is missing.'
          }
          $report = Get-Content -LiteralPath $retainedPath -Raw | ConvertFrom-Json
          $results = @($report.groups | Where-Object {
            $_.className -ceq 'SilkPointShadowNativeConformanceTests'
          } | ForEach-Object { $_.tests } | Where-Object {
            $_.displayName -ceq 'AuthoredBoundedPointShadowMatchesAnalyticPixelsWhenSupported(Vulkan)' -and
              $_.status -ceq 'passed'
          })
          if ($report.summary.total -ne 1 -or $report.summary.passed -ne 1 -or
              $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
              $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0 -or
              $results.Count -ne 1) {
            throw 'The Vulkan moved point-shadow case did not pass exactly once without skips.'
          }
      - name: Reproduce native volume fixture cameras
        if: always() && steps.diagnostic.outputs.compatible == 'true' && steps.native.outcome == 'success' && steps.build.outcome == 'success' && steps.vulkan.outcome == 'success'
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ steps.vulkan.outputs.icd }}
          VK_ICD_FILENAMES: ${{ steps.vulkan.outputs.icd }}
          OPENUSD_PLUGIN_PATH: ${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/plugin/usd
          LD_LIBRARY_PATH: ${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/lib:${{ github.workspace }}/artifacts/shadow-volume-repro/runtime/bin
        run: |
          $project = 'tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj'
          ./eng/run-managed-tests.ps1 -Project $project -Framework net10.0 -Configuration Release `
            -MinimumExpectedTests 2 -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeRenderingConformanceTests/VolumeFixtureCameraPreservesClipMappingWithConventionalDepth')
          ./eng/run-managed-tests.ps1 -Project $project -Framework net10.0 -Configuration Release `
            -MinimumExpectedTests 2 -TestArguments @(
              '--treenode-filter',
              '/*/*/VolumeRenderingConformanceTests/(UniformDensityVolumeGatesOnVulkan|SampledOpenVdbDensityGatesOnVulkan)')
      - name: Retain diagnostic test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-shadow-volume-repro-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/shadow-volume-repro/native-source.txt
            artifacts/shadow-volume-repro/point-shadow.tunit-report.json
            tests/OpenUsd.Rendering.ConformanceTests/bin/Release/net10.0/TestResults/
          if-no-files-found: warn
          retention-days: 14

  linux-native-ctest-repro:
    name: Linux native geometry and shadow repro
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install native prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential clang cmake ninja-build pkg-config patchelf binutils
          libgl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev libxt-dev libxtst-dev
          libwayland-dev x11-utils xvfb xauth zlib1g-dev
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          fail-on-cache-miss: true
          path: |
            native/install/linux-x64
            native/install/vulkan-sdk-1.4.363.0
          key: >-
            openusd-install-linux-x64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - name: Verify native SDK inputs
        shell: pwsh
        run: ./eng/verify-sdk-build-input.ps1 -Rid linux-x64
      - name: Build current native probes
        shell: bash
        env:
          OPENUSD_ROOT: ${{ github.workspace }}/native/install/linux-x64
          VULKAN_SDK: ${{ github.workspace }}/native/install/vulkan-sdk-1.4.363.0
        run: |
          set -euo pipefail
          cd native
          cmake --preset linux-x64
          cmake --build --preset linux-x64 --target \
            hdsilk_probe hdsilk_direct_lights_probe hdsilk_mesh_preparation_probe
      - name: Repeat the failing native CTests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/artifacts/linux-native-ctest-repro"
          build="$GITHUB_WORKSPACE/native/build/shim/linux-x64"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-commit.txt"
          failed=0
          for test_name in hdsilk_geometry_non_geometry_sync hdsilk_direct_light_domes_shadows \
            hdsilk_mesh_preparation; do
            for attempt in 1 2; do
              name="$test_name-$attempt"
              rm -f -- "$build/Testing/Temporary/LastTest.log"
              if xvfb-run -a ctest --test-dir "$build" \
                -R "^${test_name}$" --no-tests=error --output-on-failure \
                --output-junit "$evidence/$name.xml" 2>&1 | tee "$evidence/$name.txt"; then
                :
              else
                failed=1
              fi
              if [[ -f "$build/Testing/Temporary/LastTest.log" ]]; then
                cp "$build/Testing/Temporary/LastTest.log" "$evidence/$name-LastTest.log"
              fi
            done
          done
          exit "$failed"
      - name: Upload native repro evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-native-ctest-repro-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linux-native-ctest-repro/
          if-no-files-found: warn
          retention-days: 14

  viewer-compiler-redistribution-guard:
    name: Viewer compiler redistribution guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test compiler redistribution guard
        shell: pwsh
        run: ./eng/test-viewer-compiler-redistribution.ps1

  spirv-cross-source-provenance:
    name: SPIRV-Cross source reproduction (${{ matrix.rid }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test compiler provenance verifier
        run: >-
          python -m unittest -v eng.tests.test_verify_spirv_cross_provenance
          eng.tests.test_verify_nuget_promotion eng.tests.test_release_validation_checkpoint
      - name: Check out the actual Silk.NET binary producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dotnet/Silk.NET
          ref: d01d143952ce161c151f771d02d5457d13235f0a
          path: .provenance/silk-producer
          persist-credentials: false
      - name: Check out the producer's SPIRV-Cross revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/SPIRV-Cross
          ref: d8e3e2b141b8c8a167b2e3984736a6baacff316c
          path: .provenance/spirv-cross
          persist-credentials: false
      - name: Fetch the binary and package source commits
        run: |
          git -C .provenance/silk-producer fetch --no-tags --depth=1 origin \
            6305f138f92df6132e566072b62a3d8f41fba9aa \
            94605142f7b7bd6e69c9201e8e721d245c69eb7e
      - name: Rebuild and compare the selected package asset
        shell: bash
        env:
          EXPECTED_PROJECT_COMMIT: ${{ github.event.pull_request.head.sha }}
          TARGET_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          zig_archive="$RUNNER_TEMP/zig-x86_64-linux-0.15.2.tar.xz"
          package="$RUNNER_TEMP/silk.net.spirv.cross.native.2.23.0.nupkg"
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            --output "$zig_archive"
          echo "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  $zig_archive" | sha256sum --check
          tar -xf "$zig_archive" -C "$RUNNER_TEMP"
          curl --fail --location --retry 3 \
            https://api.nuget.org/v3-flatcontainer/silk.net.spirv.cross.native/2.23.0/silk.net.spirv.cross.native.2.23.0.nupkg \
            --output "$package"
          python ./eng/verify-spirv-cross-provenance.py \
            --project "$GITHUB_WORKSPACE" \
            --project-commit "$EXPECTED_PROJECT_COMMIT" \
            --producer "$GITHUB_WORKSPACE/.provenance/silk-producer" \
            --source "$GITHUB_WORKSPACE/.provenance/spirv-cross" \
            --package "$package" \
            --zig-archive "$zig_archive" \
            --zig "$RUNNER_TEMP/zig-x86_64-linux-0.15.2/zig" \
            --rid "$TARGET_RID" \
            --receipt "$GITHUB_WORKSPACE/artifacts/spirv-cross-provenance/$TARGET_RID.json"
      - name: Upload compiler provenance receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spirv-cross-provenance-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/spirv-cross-provenance/${{ matrix.rid }}.json
          if-no-files-found: warn
          retention-days: 14

  package-compiler-consumer:
    name: Packaged D3D12 compiler consumer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OPENUSD_TEST_WORK_ROOT: D:\temp\openusd-package-tests-${{ github.run_id }}-${{ github.run_attempt }}
      DOTNET_CLI_HOME: D:\temp\openusd-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
      NUGET_PACKAGES: D:\temp\openusd-nuget-${{ github.run_id }}-${{ github.run_attempt }}
      NUGET_HTTP_CACHE_PATH: D:\temp\openusd-nuget-http-${{ github.run_id }}-${{ github.run_attempt }}
      NUGET_PLUGINS_CACHE_PATH: D:\temp\openusd-nuget-plugins-${{ github.run_id }}-${{ github.run_attempt }}
      NUGET_SCRATCH: D:\temp\openusd-nuget-scratch-${{ github.run_id }}-${{ github.run_attempt }}
      TEMP: D:\temp\openusd-process-${{ github.run_id }}-${{ github.run_attempt }}
      TMP: D:\temp\openusd-process-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Prepare isolated work directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            $env:OPENUSD_TEST_WORK_ROOT, $env:DOTNET_CLI_HOME, $env:NUGET_PACKAGES, `
            $env:NUGET_HTTP_CACHE_PATH, $env:NUGET_PLUGINS_CACHE_PATH, $env:NUGET_SCRATCH, `
            $env:TEMP | Out-Null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.426
            9.0.319
            10.0.403
      - name: Build package tests
        shell: pwsh
        run: |
          $project = 'tests/OpenUsd.Package.Tests/OpenUsd.Package.Tests.csproj'
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project -c Release -f net10.0 --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated compiler consumers and MCP package
        shell: pwsh
        run: |
          $cases = @(
            @{ Class = 'RuntimePackageTests'; Method = 'SilkPackageCarriesCheckedShadowAndMeshShadersForEveryFramework' },
            @{ Class = 'RuntimePackageTests'; Method = 'SilkPackageDeclaresSpirvCrossNativeRuntimeDependencyForEveryFramework' },
            @{ Class = 'RuntimePackageTests'; Method = 'SilkPackageGeneratedD3D12MaterialUsesPackagedSpirvCrossAndExternalDxc' },
            @{ Class = 'McpToolPackageTests'; Method = 'McpToolPackageMetadataDocumentsExternalNativeRuntime' },
            @{ Class = 'McpToolPackageTests'; Method = 'PackedMcpToolIsInstallableManagedOnlyPackage' }
          )
          $evidence = 'artifacts/package-compiler-consumer'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $reportPath = 'tests/OpenUsd.Package.Tests/bin/Release/net10.0/TestResults/OpenUsd.Package.Tests-windows-net10.0.tunit-report.json'
          foreach ($case in $cases) {
            if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
              Remove-Item -LiteralPath $reportPath
            }
            ./eng/run-managed-tests.ps1 `
              -Project tests/OpenUsd.Package.Tests/OpenUsd.Package.Tests.csproj `
              -Framework net10.0 -Configuration Release -MinimumExpectedTests 1 `
              -TestArguments @('--treenode-filter', "/*/*/$($case.Class)/$($case.Method)")
            if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              throw "The $($case.Method) report is missing."
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            $matches = @($report.groups | Where-Object {
              $_.className -ceq $case.Class
            } | ForEach-Object { $_.tests } | Where-Object {
              $_.methodName -ceq $case.Method -and $_.status -ceq 'passed'
            })
            if ($report.summary.total -ne 1 -or $report.summary.passed -ne 1 -or
                $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
                $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0 -or
                $matches.Count -ne 1) {
              throw "The exact $($case.Method) case did not pass without skips."
            }
            Copy-Item -LiteralPath $reportPath -Destination (
              Join-Path $evidence "$($case.Method).tunit-report.json")
          }
      - name: Upload compiler consumer reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-compiler-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/package-compiler-consumer/*.tunit-report.json
            tests/OpenUsd.Package.Tests/bin/Release/net10.0/TestResults/*.tunit-report.json
          if-no-files-found: warn
          retention-days: 14

  capture-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403
      - name: Build capture tests
        shell: pwsh
        run: |
          dotnet restore tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
            -p:TargetFramework=net10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
            -c Debug -f net10.0 --no-restore `
            -p:OpenUsdRequireMetalShaderLibrary=false -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run capture diagnostics tests
        shell: pwsh
        env:
          OPENUSD_SILK_SHADER_CACHE_DIR: ${{ runner.temp }}/openusd-capture-shaders
          OPENUSD_TEST_WORK_ROOT: ${{ runner.temp }}/openusd-tests
        run: |
          ./eng/run-managed-tests.ps1 `
            -Project tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
            -Framework net10.0 -Configuration Debug -MinimumExpectedTests 3 `
            -TestArguments @('--treenode-filter', '/*/*/SilkFrameCaptureDiagnosticsTests/*')
          $reportPath = 'tests/OpenUsd.Rendering.Tests/bin/Debug/net10.0/TestResults/OpenUsd.Rendering.Tests-linux-net10.0.tunit-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'The capture diagnostics report is missing.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $cases = @($report.groups | Where-Object {
            $_.className -ceq 'SilkFrameCaptureDiagnosticsTests'
          } | ForEach-Object { $_.tests })
          $recovery = @($cases | Where-Object {
            $_.methodName -ceq 'RetainedCapturePublishesShaderFailureAndKeepsItsSnapshotAfterRecovery' -and
              $_.status -ceq 'passed'
          })
          $display = @($cases | Where-Object {
            $_.methodName -ceq 'DisplayCapturePreservesShaderAndDisplayFailuresUntilTheirSeparateRecovery' -and
              $_.status -ceq 'passed'
          })
          if ($report.summary.total -ne 3 -or $report.summary.passed -ne 3 -or
              $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
              $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0 -or
              $recovery.Count -ne 2 -or $display.Count -ne 1) {
            throw 'All three named capture diagnostics cases must pass without skips.'
          }
          Copy-Item -LiteralPath $reportPath -Destination (
            Join-Path (Split-Path $reportPath) 'capture-diagnostics.json')
      - name: Run renderer shader diagnostic tests
        shell: pwsh
        env:
          OPENUSD_SILK_SHADER_CACHE_DIR: ${{ runner.temp }}/openusd-capture-shaders
          OPENUSD_TEST_WORK_ROOT: ${{ runner.temp }}/openusd-tests
        run: |
          ./eng/run-managed-tests.ps1 `
            -Project tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
            -Framework net10.0 -Configuration Debug -MinimumExpectedTests 2 `
            -TestArguments @('--treenode-filter', '/*/*/SilkMaterialShaderCompilerTests/Renderer*')
          $reportPath = 'tests/OpenUsd.Rendering.Tests/bin/Debug/net10.0/TestResults/OpenUsd.Rendering.Tests-linux-net10.0.tunit-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'The renderer shader diagnostics report is missing.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $cases = @($report.groups | Where-Object {
            $_.className -ceq 'SilkMaterialShaderCompilerTests'
          } | ForEach-Object { $_.tests })
          $expected = @(
            'RendererReportsOneDiagnosticPerFailedRuntimeShaderAndClearsItOnSuccess',
            'RendererBoundsFailedRuntimeShaderDiagnostics'
          )
          foreach ($method in $expected) {
            if (@($cases | Where-Object {
              $_.methodName -ceq $method -and $_.status -ceq 'passed'
            }).Count -ne 1) {
              throw "The renderer shader diagnostic test '$method' did not pass exactly once."
            }
          }
          if ($report.summary.total -ne 2 -or $report.summary.passed -ne 2 -or
              $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
              $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0) {
            throw 'Both renderer shader diagnostic tests must pass without skips.'
          }
          Copy-Item -LiteralPath $reportPath -Destination (
            Join-Path (Split-Path $reportPath) 'shader-diagnostic-fixture.json')
      - name: Run renderer shader lifecycle tests
        shell: pwsh
        env:
          OPENUSD_SILK_SHADER_CACHE_DIR: ${{ runner.temp }}/openusd-capture-shaders
          OPENUSD_TEST_WORK_ROOT: ${{ runner.temp }}/openusd-tests
        run: |
          ./eng/run-managed-tests.ps1 `
            -Project tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
            -Framework net10.0 -Configuration Debug -MinimumExpectedTests 2 `
            -TestArguments @('--treenode-filter', '/*/*/SilkTextureResidencyTests/RendererShaderDiagnostics*')
          $reportPath = 'tests/OpenUsd.Rendering.Tests/bin/Debug/net10.0/TestResults/OpenUsd.Rendering.Tests-linux-net10.0.tunit-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'The renderer shader lifecycle report is missing.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $cases = @($report.groups | Where-Object {
            $_.className -ceq 'SilkTextureResidencyTests'
          } | ForEach-Object { $_.tests })
          $expected = @(
            'RendererShaderDiagnosticsSurviveMaterialChangesUntilTheSameKeyIsReady',
            'RendererShaderDiagnosticsTrackRequestsFromRefusedFramesAndRetry'
          )
          foreach ($method in $expected) {
            if (@($cases | Where-Object {
              $_.methodName -ceq $method -and $_.status -ceq 'passed'
            }).Count -ne 1) {
              throw "The renderer shader lifecycle test '$method' did not pass exactly once."
            }
          }
          if ($report.summary.total -ne 2 -or $report.summary.passed -ne 2 -or
              $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
              $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0) {
            throw 'Both renderer shader lifecycle tests must pass without skips.'
          }
          Copy-Item -LiteralPath $reportPath -Destination (
            Join-Path (Split-Path $reportPath) 'shader-diagnostic-lifecycle.json')
      - name: Run unsupported Ptex fallback geometry tests
        shell: pwsh
        env:
          OPENUSD_SILK_SHADER_CACHE_DIR: ${{ runner.temp }}/openusd-capture-shaders
          OPENUSD_TEST_WORK_ROOT: ${{ runner.temp }}/openusd-tests
        run: |
          ./eng/run-managed-tests.ps1 `
            -Project tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
            -Framework net10.0 -Configuration Debug -MinimumExpectedTests 5 `
            -TestArguments @('--treenode-filter', '/*/*/SilkMaterialCommandTests/UnsupportedPtex*')
          $reportPath = 'tests/OpenUsd.Rendering.Tests/bin/Debug/net10.0/TestResults/OpenUsd.Rendering.Tests-linux-net10.0.tunit-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'The Ptex fallback geometry report is missing.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $cases = @($report.groups | Where-Object {
            $_.className -ceq 'SilkMaterialCommandTests'
          } | ForEach-Object { $_.tests })
          $expected = @(
            'UnsupportedPtexInputSamplesItsNonDefaultAuthoredFallback(Normal)',
            'UnsupportedPtexInputSamplesItsNonDefaultAuthoredFallback(Opacity)',
            'UnsupportedPtexNormalFallbackBuildsTangentsAndRestoresGeometry(Normal)',
            'UnsupportedPtexForbiddenInputIsRejectedAndCorrectedRetryWorks(DetailNormal)',
            'UnsupportedPtexForbiddenInputIsRejectedAndCorrectedRetryWorks(Displacement)'
          )
          foreach ($name in $expected) {
            if (@($cases | Where-Object {
              $_.displayName -ceq $name -and $_.status -ceq 'passed'
            }).Count -ne 1) {
              throw "The Ptex fallback test '$name' did not pass exactly once."
            }
          }
          if ($report.summary.total -ne 5 -or $report.summary.passed -ne 5 -or
              $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
              $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0 -or
              $cases.Count -ne 5) {
            throw 'All five Ptex fallback and refusal cases must pass without skips.'
          }
          Copy-Item -LiteralPath $reportPath -Destination (
            Join-Path (Split-Path $reportPath) 'ptex-fallback-geometry.json')
      - name: Run point-shadow depth and transaction tests
        shell: pwsh
        run: |
          $cases = @(
            @{
              Class = 'SilkPointShadowDepthEncodingTests'
              Filter = '*'
              Output = 'point-depth-encoding.json'
              Methods = [ordered]@{
                DistantCubeDepthSeparatesCastersWithoutFittingTheNearPlane = 1
                CubeBiasPreservesThePublishedPerspectiveBias = 3
                CubeFacesUseOneScaleWhenTheirFarPlanesDiffer = 1
                CubeGroupRejectsFaceWhoseLinearNearDepthWouldUnderflow = 1
                InvalidCubeDepthProjectionIsRejected = 4
                OrthographicMapsRetainTheirPublishedDepthBias = 1
                CasterInstanceWritesTheDepthScaleAndFaceLimit = 1
                CasterInstanceRejectsInvalidDepthScale = 3
                CasterInstanceRejectsInvalidPointFaceLimit = 6
                CasterInstanceRejectsFaceLimitWithoutPointDepthScale = 1
              }
            },
            @{
              Class = 'SilkShadowAtlasRetentionTests'
              Filter = '(CubeDisplacementRetainsTheOriginalNearPlaneAndExpandsFar|PreparedCubeRendersWithCandidateDepthScaleBeforePublication|InvalidCubeProjectionIsRejectedBeforeReplacingThePublishedAtlas)'
              Output = 'point-depth-transactions.json'
              Methods = [ordered]@{
                CubeDisplacementRetainsTheOriginalNearPlaneAndExpandsFar = 1
                PreparedCubeRendersWithCandidateDepthScaleBeforePublication = 1
                InvalidCubeProjectionIsRejectedBeforeReplacingThePublishedAtlas = 1
              }
            },
            @{
              Class = 'SilkShadowWireTests'
              Filter = 'SixFaceGroupsRetainTheirFirstSlotAcrossReplacementAndRetirement'
              Output = 'point-depth-wire.json'
              Methods = [ordered]@{
                SixFaceGroupsRetainTheirFirstSlotAcrossReplacementAndRetirement = 1
              }
            }
          )
          $reportPath = 'tests/OpenUsd.Rendering.Tests/bin/Debug/net10.0/TestResults/OpenUsd.Rendering.Tests-linux-net10.0.tunit-report.json'
          foreach ($case in $cases) {
            $expectedCount = ($case.Methods.Values | Measure-Object -Sum).Sum
            ./eng/run-managed-tests.ps1 `
              -Project tests/OpenUsd.Rendering.Tests/OpenUsd.Rendering.Tests.csproj `
              -Framework net10.0 -Configuration Debug -MinimumExpectedTests $expectedCount `
              -TestArguments @('--treenode-filter', "/*/*/$($case.Class)/$($case.Filter)")
            if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              throw "The $($case.Class) report is missing."
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            $results = @($report.groups | Where-Object {
              $_.className -ceq $case.Class
            } | ForEach-Object { $_.tests })
            foreach ($method in $case.Methods.GetEnumerator()) {
              if (@($results | Where-Object {
                $_.methodName -ceq $method.Key -and $_.status -ceq 'passed'
              }).Count -ne $method.Value) {
                throw "The point-shadow test '$($method.Key)' did not pass $($method.Value) time(s)."
              }
            }
            if ($report.summary.total -ne $expectedCount -or
                $report.summary.passed -ne $expectedCount -or
                $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
                $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0 -or
                $results.Count -ne $expectedCount) {
              throw "The $($case.Class) point-shadow cases did not all pass without skips."
            }
            Copy-Item -LiteralPath $reportPath -Destination (
              Join-Path (Split-Path $reportPath) $case.Output)
          }
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/OpenUsd.Rendering.Tests/bin/Debug/net10.0/TestResults/
          if-no-files-found: warn

  primitive-transport:
    needs: shader-receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate shader receipt identity
        shell: pwsh
        env:
          SHADER_RECEIPT_ARTIFACT_ID: ${{ needs.shader-receipts.outputs.artifact_id }}
        run: |
          if ($env:SHADER_RECEIPT_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') {
            throw 'The verified shader receipt artifact ID is missing or invalid.'
          }
      - name: Download verified shader receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.shader-receipts.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: .
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403
      - name: Build primitive transport test
        shell: pwsh
        run: |
          dotnet restore tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj `
            -c Debug -f net10.0 --no-restore `
            -p:OpenUsdRequireMetalShaderLibrary=false -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Locate software Vulkan
        id: vulkan
        shell: bash
        run: |
          set -euo pipefail
          icd="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d \
            /usr/lib/x86_64-linux-gnu/vulkan/icd.d \
            -name 'lvp_icd*.json' 2>/dev/null | sort | head -n1 || true)"
          if [ -z "$icd" ]; then
            echo "::error::A lavapipe ICD is required for the primitive transport test. Present manifests:"
            find /usr/share/vulkan /etc/vulkan /usr/lib/x86_64-linux-gnu/vulkan \
              -name '*.json' 2>/dev/null || true
            exit 1
          fi
          echo "Using lavapipe ICD $icd."
          echo "icd=$icd" >> "$GITHUB_OUTPUT"
      - name: Run primitive transport test
        shell: pwsh
        env:
          VK_DRIVER_FILES: ${{ steps.vulkan.outputs.icd }}
          VK_ICD_FILENAMES: ${{ steps.vulkan.outputs.icd }}
          OPENUSD_SILK_SHADER_CACHE_DIR: ${{ runner.temp }}/openusd-primitive-shaders
          OPENUSD_TEST_WORK_ROOT: ${{ runner.temp }}/openusd-tests
        run: |
          ./eng/run-managed-tests.ps1 `
            -Project tests/OpenUsd.Rendering.ConformanceTests/OpenUsd.Rendering.ConformanceTests.csproj `
            -Framework net10.0 -Configuration Debug -MinimumExpectedTests 3 `
            -TestArguments @('--treenode-filter', '/*/*/SilkPrimitiveIdTransportConformanceTests/*')
          $reportPath = 'tests/OpenUsd.Rendering.ConformanceTests/bin/Debug/net10.0/TestResults/OpenUsd.Rendering.ConformanceTests-linux-net10.0.tunit-report.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'The primitive transport report is missing.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $cases = @($report.groups | Where-Object {
            $_.className -ceq 'SilkPrimitiveIdTransportConformanceTests'
          } | ForEach-Object { $_.tests } | Where-Object {
            $_.methodName -ceq 'SingleIndexedDrawPreservesPrimitiveIdsWithoutProvingPtex' -and
              $_.status -ceq 'passed'
          })
          if ($report.summary.total -ne 3 -or $report.summary.passed -ne 3 -or
              $report.summary.failed -ne 0 -or $report.summary.skipped -ne 0 -or
              $report.summary.cancelled -ne 0 -or $report.summary.timedOut -ne 0 -or
              $cases.Count -ne 3) {
            throw 'All three primitive transport cases must pass without skips.'
          }
          foreach ($boundary in @(255, 32767, 65535)) {
            $name = "SingleIndexedDrawPreservesPrimitiveIdsWithoutProvingPtex(Vulkan, $boundary)"
            if (@($cases | Where-Object { $_.displayName -ceq $name }).Count -ne 1) {
              throw "The Vulkan primitive transport case '$name' did not pass exactly once."
            }
          }
      - name: Upload primitive transport evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: primitive-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/OpenUsd.Rendering.ConformanceTests/bin/Debug/net10.0/TestResults/
          if-no-files-found: warn

  d3d12-probes:
    needs: shader-receipts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEMP: 'D:\temp'
      TMP: 'D:\temp'
      DOTNET_CLI_HOME: 'D:\temp\dotnet-home'
      NUGET_PACKAGES: 'D:\temp\nuget\'
