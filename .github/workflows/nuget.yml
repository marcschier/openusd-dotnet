name: nuget

# Manual action: promote the published package set from the GitHub Packages NuGet feed
# to nuget.org using NuGet trusted publishing (OIDC) instead of a long-lived API key.
#
# The release workflow pushes tagged packages to the GitHub Packages feed, then this
# workflow promotes them to nuget.org. It exists for releases where the GitHub feed
# succeeded but nuget.org promotion still has to run, or has to be retried. It
# re-pushes the exact bytes that were released rather than rebuilding them, so
# promotion cannot alter what was verified.
#
# What it does when run:
#   1. Probes the GitHub Packages NuGet feed (flat-container protocol) for each
#      published id and the versions it has.
#   2. Picks the latest published version, or the version supplied as input.
#   3. Downloads every nupkg at that version straight from the GitHub feed.
#   4. Downloads the matching release run artifact to place each snupkg beside
#      its nupkg. The GitHub feed rejects snupkg files, so symbols cannot be
#      recovered from the feed even though release packing produced them.
#   5. Exchanges the workflow's OIDC token for a short-lived nuget.org key via
#      NuGet/login and pushes to nuget.org (idempotent).
#
# One-time setup on nuget.org (https://www.nuget.org/account/trustedpublishing):
#   Add policy -> Repository Owner: marcschier, Repository: openusd-dotnet,
#   Workflow File: nuget.yml, Environment: release.
# And a `release` GitHub Environment with secret NUGET_USER = the nuget.org username
# (not the email address).

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Exact package version to promote from the GitHub feed (for example 0.1.0).
          Leave blank to promote the latest published version.
        required: false
        type: string
      release_run_id:
        description: >-
          Optional release.yml run id holding openusd-published-nupkgs. Leave blank
          to use the latest completed v<version> release run.
        required: false
        type: string

permissions:
  id-token: write   # required: OIDC token for NuGet trusted publishing to nuget.org
  packages: read    # required: read packages from the GitHub Packages NuGet feed
  actions: read     # required: download snupkg files from the release run artifact
  contents: read

concurrency:
  group: nuget-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote GitHub-feed packages to nuget.org
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Resolve and download packages from the GitHub feed
        id: resolve
        env:
          # GITHUB_TOKEN (with packages: read) authenticates to the GitHub Packages
          # NuGet feed over the NuGet V3 protocol, so no read:packages PAT is needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_RELEASE_RUN_ID: ${{ github.event.inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # PackageBaseAddress (flat container) of the GitHub Packages NuGet feed.
          BASE="https://nuget.pkg.github.com/${OWNER}/download"

          # Keep this list identical to the published set in eng/pack-packages.ps1.
          # A candidate missing from the feed returns 404 and is skipped.
          CANDIDATES=(
            OpenUsd
            OpenUsd.Interop
            OpenUsd.Rendering
            OpenUsd.Rendering.Silk
            OpenUsd.Rendering.Silk.D3D12
            OpenUsd.Rendering.Silk.Metal
            OpenUsd.Rendering.Silk.Vulkan
            OpenUsd.Rendering.Storm
            OpenUsd.Cesium
            OpenUsd.Viewer
            OpenUsd.Runtime.Core
            OpenUsd.Runtime.Core.win-x64
            OpenUsd.Runtime.Core.linux-x64
            OpenUsd.Runtime.Core.osx-arm64
            OpenUsd.Runtime.Imaging
            OpenUsd.Runtime.Imaging.win-x64
            OpenUsd.Runtime.Imaging.linux-x64
            OpenUsd.Runtime.Imaging.osx-arm64
            OpenUsd.Runtime.Cesium
            OpenUsd.Runtime.Cesium.win-x64
            OpenUsd.Runtime.Cesium.linux-x64
            OpenUsd.Runtime.Cesium.osx-arm64
          )

          mkdir -p artifacts versions
          ALL_VERSIONS="versions/all.txt"
          : > "$ALL_VERSIONS"
          PUBLISHED=()

          for id in "${CANDIDATES[@]}"; do
            idl="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
            body="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${BASE}/${idl}/index.json" 2>/dev/null || true)"
            [ -n "$body" ] || continue
            vers="$(echo "$body" | jq -r '.versions[]?' 2>/dev/null || true)"
            [ -n "$vers" ] || continue
            PUBLISHED+=("$id")
            printf '%s\n' "$vers" > "versions/${idl}.txt"
            printf '%s\n' "$vers" >> "$ALL_VERSIONS"
          done

          if [ "${#PUBLISHED[@]}" -eq 0 ]; then
            echo "::error::No packages found on the GitHub feed for ${OWNER}."
            echo "::error::Confirm release.yml pushed to the GitHub Packages feed."
            exit 1
          fi
          echo "Found ${#PUBLISHED[@]} published package(s) on the GitHub feed."

          # Auto-select the highest version by semver precedence: map the leading '-' to
          # Debian '~' so sort -V ranks prereleases below the matching stable and orders
          # rc.9 before rc.10.
          if [ -n "${INPUT_VERSION}" ]; then
            TARGET="${INPUT_VERSION}"
            echo "Promoting requested version: ${TARGET}"
          else
            TARGET="$(sed 's/-/~/' "$ALL_VERSIONS" | sort -V | tail -n1 | sed 's/~/-/')"
            if [ -z "$TARGET" ]; then
              echo "::error::Could not determine the latest published version from the GitHub feed."
              exit 1
            fi
            echo "Auto-selected latest published version: ${TARGET}"
          fi

          if [ -n "${INPUT_RELEASE_RUN_ID}" ]; then
            release_run_id="${INPUT_RELEASE_RUN_ID}"
            echo "Using requested release workflow run: ${release_run_id}"
          else
            tag="v${TARGET}"
            runs_url="https://api.github.com/repos/${REPOSITORY}/actions/workflows/release.yml/runs"
            release_run_id="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${runs_url}?event=push&status=completed&per_page=100" | \
              jq -r --arg tag "$tag" \
                '.workflow_runs[] | select(.head_branch == $tag) | .id' | head -n1)"
            if [ -z "${release_run_id}" ]; then
              echo "::error::Could not find a completed release.yml run for ${tag}."
              echo "::error::Re-run with the release_run_id input so symbols can be downloaded."
              exit 1
            fi
            echo "Using release workflow run: ${release_run_id}"
          fi

          downloaded=0
          for id in "${PUBLISHED[@]}"; do
            idl="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
            if ! grep -qxF "$TARGET" "versions/${idl}.txt"; then
              echo "::notice::Skipping ${id}: version ${TARGET} is not on the feed."
              continue
            fi
            verl="$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')"
            echo "Downloading ${id} ${TARGET}"
            curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -o "artifacts/${idl}.${verl}.nupkg" \
              "${BASE}/${idl}/${verl}/${idl}.${verl}.nupkg"
            downloaded=$((downloaded + 1))
          done

          if [ "$downloaded" -eq 0 ]; then
            echo "::error::No .nupkg files were downloaded for version ${TARGET}."
            exit 1
          fi

          echo "Downloaded ${downloaded} package(s) at version ${TARGET}."
          {
            echo "version=${TARGET}"
            echo "count=${downloaded}"
            echo "release-run-id=${release_run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Download release symbol packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.release-run-id }}
          name: openusd-published-nupkgs
          path: release-artifacts/nupkg

      - name: Stage symbol packages for nuget.org
        shell: pwsh
        run: |
          # Only the managed libraries produce symbols. The twelve runtime packaging
          # projects set IncludeSymbols=false because they ship native payloads and
          # dependencies rather than assemblies, so demanding a .snupkg for every
          # .nupkg would fail every promotion.
          $expected = @(& ./eng/pack-packages.ps1 -ListSymbolPublished)
          if ($LASTEXITCODE -ne 0 -or $expected.Count -eq 0)
          {
            throw 'eng/pack-packages.ps1 -ListSymbolPublished produced no package ids.'
          }
          $packages = @(Get-ChildItem artifacts -Filter '*.nupkg')
          $symbols = @(Get-ChildItem release-artifacts/nupkg -Filter '*.snupkg')
          if ($symbols.Count -eq 0)
          {
            throw (
              'The release artifact did not contain .snupkg files. ' +
              'Release packing produced symbols, but dropping them made ' +
              'https://globalcdn.nuget.org/symbol-packages/openusd.0.6.0-alpha.snupkg 404.')
          }

          $byName = @{}
          foreach ($symbol in $symbols)
          {
            $byName[$symbol.Name.ToLowerInvariant()] = $symbol.FullName
          }

          $missing = @()
          foreach ($package in $packages)
          {
            $packageId = [IO.Path]::GetFileNameWithoutExtension($package.Name) -replace
              '\.\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$', ''
            if ($expected -notcontains $packageId)
            {
              continue
            }
            $symbolName = [IO.Path]::GetFileNameWithoutExtension($package.Name) + '.snupkg'
            $key = $symbolName.ToLowerInvariant()
            if (-not $byName.ContainsKey($key))
            {
              $missing += $symbolName
              continue
            }

            Copy-Item -LiteralPath $byName[$key] -Destination (Join-Path 'artifacts' $symbolName) -Force
          }

          if ($missing.Count -gt 0)
          {
            throw "Missing symbol package(s) in the release artifact: $($missing -join ', ')."
          }

          $staged = @(Get-ChildItem artifacts -Filter '*.snupkg')
          Write-Host "Staged $($staged.Count) symbol package(s) beside the nupkg files."

      # NuGet login happens right before the push so the short-lived token is fresh.
      - name: NuGet login (OIDC trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Summary
        if: always()
        run: |
          {
            echo "### nuget.org promotion"
            echo ""
            echo "- Version: \`${{ steps.resolve.outputs.version }}\`"
            echo "- Packages promoted: \`${{ steps.resolve.outputs.count }}\`"
            echo "- Release artifact run: `${{ steps.resolve.outputs.release-run-id }}`"
            echo "- Source: GitHub Packages nupkg bytes plus release-artifact snupkg symbols"
          } >> "$GITHUB_STEP_SUMMARY"
