name: nuget

# Manual action: promote the published package set from the GitHub Packages NuGet feed
# to nuget.org using NuGet trusted publishing (OIDC) instead of a long-lived API key.
#
# The release workflow pushes tagged packages to the GitHub Packages feed, then this
# workflow promotes them to nuget.org. It exists for releases where the GitHub feed
# succeeded but nuget.org promotion still has to run, or has to be retried. It
# re-pushes the exact bytes that were released rather than rebuilding them, so
# promotion cannot alter what was verified.
#
# What it does when run:
#   1. Probes the GitHub Packages NuGet feed (flat-container protocol) for each
#      published id and the versions it has.
#   2. Picks the latest published version, or the version supplied as input.
#   3. Downloads every nupkg at that version straight from the GitHub feed.
#   4. Downloads the matching release run artifact to place each snupkg beside
#      its nupkg. The GitHub feed rejects snupkg files, so symbols cannot be
#      recovered from the feed even though release packing produced them.
#   5. Exchanges the workflow's OIDC token for a short-lived nuget.org key via
#      NuGet/login and pushes to nuget.org (idempotent).
#   6. Retrieves every public package and symbol, compares its contents and
#      extraction attributes to the tagged release artifact, and retains the result.
#
# One-time setup on nuget.org (https://www.nuget.org/account/trustedpublishing):
#   Add policy -> Repository Owner: marcschier, Repository: openusd-dotnet,
#   Workflow File: nuget.yml, Environment: release.
# And a `release` GitHub Environment with secret NUGET_USER = the nuget.org username
# (not the email address).

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Exact package version to promote from the GitHub feed (for example 0.1.0).
          Leave blank to promote the latest published version.
        required: false
        type: string
      release_run_id:
        description: >-
          Optional release.yml run id holding openusd-published-nupkgs. Leave blank
          to use the latest completed v<version> release run.
        required: false
        type: string
      dry_run:
        description: >-
          Download and validate packages and symbols, but do not mint a nuget.org token
          or push to nuget.org.
        required: false
        type: boolean
        default: false

permissions:
  id-token: write   # required: OIDC token for NuGet trusted publishing to nuget.org
  packages: read    # required: read packages from the GitHub Packages NuGet feed
  actions: read     # required: download snupkg files from the release run artifact
  contents: read

concurrency:
  group: nuget-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote GitHub-feed packages to nuget.org
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve and download packages from the GitHub feed
        id: resolve
        env:
          # GITHUB_TOKEN (with packages: read) authenticates to the GitHub Packages
          # NuGet feed over the NuGet V3 protocol, so no read:packages PAT is needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_RELEASE_RUN_ID: ${{ github.event.inputs.release_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # PackageBaseAddress (flat container) of the GitHub Packages NuGet feed.
          BASE="https://nuget.pkg.github.com/${OWNER}/download"

          # The pack script is the release package source of truth. Deriving the
          # probe candidates here keeps newly published IDs in the irreversible
          # promotion path without maintaining a second package list.
          published_output="$(pwsh -NoLogo -NoProfile \
            -File ./eng/pack-packages.ps1 -ListPublished)"
          if [ -z "${published_output}" ]; then
            echo "::error::eng/pack-packages.ps1 -ListPublished produced no package ids."
            exit 1
          fi
          published_output="${published_output//$'\r'/}"
          mapfile -t CANDIDATES <<< "${published_output}"

          mkdir -p artifacts versions
          ALL_VERSIONS="versions/all.txt"
          : > "$ALL_VERSIONS"
          PUBLISHED=()

          for id in "${CANDIDATES[@]}"; do
            idl="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
            body="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${BASE}/${idl}/index.json" 2>/dev/null || true)"
            [ -n "$body" ] || continue
            vers="$(echo "$body" | jq -r '.versions[]?' 2>/dev/null || true)"
            [ -n "$vers" ] || continue
            PUBLISHED+=("$id")
            printf '%s\n' "$vers" > "versions/${idl}.txt"
            printf '%s\n' "$vers" >> "$ALL_VERSIONS"
          done

          if [ "${#PUBLISHED[@]}" -eq 0 ]; then
            echo "::error::No packages found on the GitHub feed for ${OWNER}."
            echo "::error::Confirm release.yml pushed to the GitHub Packages feed."
            exit 1
          fi
          echo "Found ${#PUBLISHED[@]} published package(s) on the GitHub feed."

          # Auto-select the highest version by semver precedence: map the leading '-' to
          # Debian '~' so sort -V ranks prereleases below the matching stable and orders
          # rc.9 before rc.10.
          if [ -n "${INPUT_VERSION}" ]; then
            TARGET="${INPUT_VERSION}"
            echo "Promoting requested version: ${TARGET}"
          else
            TARGET="$(sed 's/-/~/' "$ALL_VERSIONS" | sort -V | tail -n1 | sed 's/~/-/')"
            if [ -z "$TARGET" ]; then
              echo "::error::Could not determine the latest published version from the GitHub feed."
              exit 1
            fi
            echo "Auto-selected latest published version: ${TARGET}"
          fi

          if [[ ! "${TARGET}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::An exact supported NuGet version is required."
            exit 1
          fi

          if [ -n "${INPUT_RELEASE_RUN_ID}" ]; then
            release_run_id="${INPUT_RELEASE_RUN_ID}"
            echo "Using requested release workflow run: ${release_run_id}"
          else
            tag="v${TARGET}"
            runs_url="https://api.github.com/repos/${REPOSITORY}/actions/workflows/release.yml/runs"
            release_run_id="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${runs_url}?event=push&status=completed&per_page=100" | \
              jq -r --arg tag "$tag" \
                '.workflow_runs[] | select(.head_branch == $tag) | .id' | head -n1)"
            if [ -z "${release_run_id}" ]; then
              echo "::error::Could not find a completed release.yml run for ${tag}."
              echo "::error::Re-run with the release_run_id input so symbols can be downloaded."
              exit 1
            fi
            echo "Using release workflow run: ${release_run_id}"
          fi

          if [[ ! "${release_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A positive release workflow run ID is required."
            exit 1
          fi

          downloaded=0
          for id in "${PUBLISHED[@]}"; do
            idl="$(echo "$id" | tr '[:upper:]' '[:lower:]')"
            if ! grep -qxF "$TARGET" "versions/${idl}.txt"; then
              echo "::notice::Skipping ${id}: version ${TARGET} is not on the feed."
              continue
            fi
            verl="$(echo "$TARGET" | tr '[:upper:]' '[:lower:]')"
            echo "Downloading ${id} ${TARGET}"
            curl -fSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -o "artifacts/${idl}.${verl}.nupkg" \
              "${BASE}/${idl}/${verl}/${idl}.${verl}.nupkg"
            downloaded=$((downloaded + 1))
          done

          if [ "$downloaded" -eq 0 ]; then
            echo "::error::No .nupkg files were downloaded for version ${TARGET}."
            exit 1
          fi

          echo "Downloaded ${downloaded} package(s) at version ${TARGET}."
          {
            echo "version=${TARGET}"
            echo "count=${downloaded}"
            echo "release-run-id=${release_run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Require complete GitHub-feed package set
        shell: pwsh
        run: |
          $expected = @(& ./eng/pack-packages.ps1 -ListPublished)
          if ($LASTEXITCODE -ne 0 -or $expected.Count -eq 0)
          {
            throw 'eng/pack-packages.ps1 -ListPublished produced no package ids.'
          }

          $packages = @(Get-ChildItem artifacts -Filter '*.nupkg')
          $actual = @($packages | ForEach-Object {
            $_.Name -replace '\.\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?\.nupkg$', ''
          })

          $actualSet = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          foreach ($id in $actual)
          {
            [void]$actualSet.Add($id)
          }

          $expectedSet = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          foreach ($id in $expected)
          {
            [void]$expectedSet.Add($id)
          }

          $missing = @($expected | Where-Object { -not $actualSet.Contains($_) })
          $unexpected = @($actual | Where-Object { -not $expectedSet.Contains($_) })
          if ($missing.Count -gt 0 -or $unexpected.Count -gt 0)
          {
            throw (
              "The GitHub feed package set for ${{ steps.resolve.outputs.version }} is incomplete. " +
              "Missing: $($missing -join ', '). Unexpected: $($unexpected -join ', ').")
          }

          Write-Host "Verified all $($expected.Count) GitHub-feed package(s)."

      - name: Download release gate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.release-run-id }}
          name: release-gate-${{ steps.resolve.outputs.release-run-id }}
          path: release-artifacts/release-gate

      - name: Require successful release gate evidence
        shell: pwsh
        run: |
          $path = 'release-artifacts/release-gate/release-gate.json'
          if (-not (Test-Path -LiteralPath $path))
          {
            throw "Release gate evidence was not downloaded from run ${{ steps.resolve.outputs.release-run-id }}."
          }

          $evidence = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $expectedRef = "refs/tags/v${{ steps.resolve.outputs.version }}"
          if ($evidence.runId -ne '${{ steps.resolve.outputs.release-run-id }}' -or
              $evidence.ref -ne $expectedRef)
          {
            throw (
              "Release gate evidence does not describe $expectedRef in run " +
              "${{ steps.resolve.outputs.release-run-id }}.")
          }

          $failed = @()
          foreach ($job in $evidence.jobs.PSObject.Properties)
          {
            if ($job.Value -cne 'success')
            {
              $failed += "$($job.Name)=$($job.Value)"
            }
          }

          if ($failed.Count -gt 0)
          {
            throw (
              "nuget.org promotion requires a fully successful release gate. " +
              "Failed or skipped gate(s): $($failed -join ', ').")
          }

          Write-Host "Release gate evidence is successful for $expectedRef."

      - name: Download release symbol packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.release-run-id }}
          name: openusd-published-nupkgs
          path: release-artifacts/nupkg

      - name: Stage symbol packages for nuget.org
        shell: pwsh
        run: |
          # Only the managed libraries produce symbols. The twelve runtime packaging
          # projects set IncludeSymbols=false because they ship native payloads and
          # dependencies rather than assemblies, so demanding a .snupkg for every
          # .nupkg would fail every promotion.
          $expected = @(& ./eng/pack-packages.ps1 -ListSymbolPublished)
          if ($LASTEXITCODE -ne 0 -or $expected.Count -eq 0)
          {
            throw 'eng/pack-packages.ps1 -ListSymbolPublished produced no package ids.'
          }
          $packages = @(Get-ChildItem artifacts -Filter '*.nupkg')
          $symbols = @(Get-ChildItem release-artifacts/nupkg -Filter '*.snupkg')
          if ($symbols.Count -eq 0)
          {
            throw (
              'The release artifact did not contain .snupkg files. ' +
              'Release packing produced symbols, but dropping them made ' +
              'https://globalcdn.nuget.org/symbol-packages/openusd.0.6.0-alpha.snupkg 404.')
          }

          $byName = @{}
          foreach ($symbol in $symbols)
          {
            $byName[$symbol.Name.ToLowerInvariant()] = $symbol.FullName
          }

          $missing = @()
          foreach ($package in $packages)
          {
            $packageId = [IO.Path]::GetFileNameWithoutExtension($package.Name) -replace
              '\.\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$', ''
            if ($expected -notcontains $packageId)
            {
              continue
            }
            $symbolName = [IO.Path]::GetFileNameWithoutExtension($package.Name) + '.snupkg'
            $key = $symbolName.ToLowerInvariant()
            if (-not $byName.ContainsKey($key))
            {
              $missing += $symbolName
              continue
            }

            Copy-Item -LiteralPath $byName[$key] -Destination (Join-Path 'artifacts' $symbolName) -Force
          }

          if ($missing.Count -gt 0)
          {
            throw "Missing symbol package(s) in the release artifact: $($missing -join ', ')."
          }

          $staged = @(Get-ChildItem artifacts -Filter '*.snupkg')
          Write-Host "Staged $($staged.Count) symbol package(s) beside the nupkg files."

      - name: Check existing nuget.org packages
        shell: bash
        env:
          PROMOTION_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p public-existing
          version="${PROMOTION_VERSION,,}"
          for file in artifacts/*.nupkg artifacts/*.snupkg; do
            name="$(basename "$file")"
            extension="${name##*.}"
            id="$(basename "$file" ".${version}.${extension}")"
            output="public-existing/${name}"
            if [ "$extension" = "snupkg" ]; then
              url="https://globalcdn.nuget.org/symbol-packages/${name}"
            else
              url="https://api.nuget.org/v3-flatcontainer/${id}/${version}/${name}"
            fi
            if ! status="$(curl -sSL --connect-timeout 15 --max-time 120 \
                --retry 3 --retry-delay 2 --output "$output" --write-out '%{http_code}' "$url")"; then
              echo "::error::Could not check the existing public package ${id}."
              exit 1
            fi
            case "$status" in
              200) echo "Downloaded existing public package ${id}." ;;
              404) rm -- "$output"; echo "No existing public package ${id}." ;;
              *) echo "::error::Public package check returned HTTP ${status} for ${id}."; exit 1 ;;
            esac
          done

      - name: Verify promotion bytes and tagged source
        id: verify_inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_RUN_ID: ${{ steps.resolve.outputs.release-run-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $run = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID"
          if ($LASTEXITCODE -ne 0)
          {
            throw 'Could not read the selected release workflow run.'
          }
          $run | Set-Content 'release-artifacts/release-run.json'
          $commit = & gh api "repos/$env:GITHUB_REPOSITORY/commits/v$env:PROMOTION_VERSION" --jq '.sha'
          if ($LASTEXITCODE -ne 0)
          {
            throw 'Could not resolve the selected release tag to a commit.'
          }
          $published = @(& ./eng/pack-packages.ps1 -ListPublished)
          if ($LASTEXITCODE -ne 0)
          {
            throw 'Could not read the published package inventory.'
          }
          $symbols = @(& ./eng/pack-packages.ps1 -ListSymbolPublished)
          if ($LASTEXITCODE -ne 0)
          {
            throw 'Could not read the symbol package inventory.'
          }
          [ordered]@{ packages = $published; symbols = $symbols } |
            ConvertTo-Json -Depth 3 | Set-Content 'release-artifacts/promotion-inventory.json'
          python ./eng/verify-nuget-promotion.py `
            --packages artifacts `
            --release-packages release-artifacts/nupkg `
            --evidence release-artifacts/release-gate/release-gate.json `
            --release-run release-artifacts/release-run.json `
            --inventory release-artifacts/promotion-inventory.json `
            --version $env:PROMOTION_VERSION `
            --run-id $env:RELEASE_RUN_ID `
            --repository $env:GITHUB_REPOSITORY `
            --tag-commit $commit `
            --public-packages public-existing `
            --allow-partial-public
          if ($LASTEXITCODE -ne 0)
          {
            throw 'NuGet promotion input verification failed.'
          }

      # NuGet login happens right before the push so the short-lived token is fresh.
      - name: NuGet login (OIDC trusted publishing)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: push
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Verify published nuget.org packages and symbols
        if: >-
          ${{ !cancelled() && github.event.inputs.dry_run != 'true' &&
              steps.verify_inputs.outcome == 'success' &&
              (steps.push.outcome == 'success' || steps.push.outcome == 'failure') }}
        id: verify_public
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_RUN_ID: ${{ steps.resolve.outputs.release-run-id }}
          PUSH_RESULT: ${{ steps.push.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = & gh api "repos/$env:GITHUB_REPOSITORY/commits/v$env:PROMOTION_VERSION" --jq '.sha'
          if ($LASTEXITCODE -ne 0)
          {
            throw 'Could not resolve the selected release tag to a commit.'
          }
          $retry = @()
          if ($env:PUSH_RESULT -eq 'failure')
          {
            $retry = @('--public-attempts', '1')
          }
          $report = & python ./eng/verify-nuget-promotion.py `
            --packages artifacts `
            --release-packages release-artifacts/nupkg `
            --evidence release-artifacts/release-gate/release-gate.json `
            --release-run release-artifacts/release-run.json `
            --inventory release-artifacts/promotion-inventory.json `
            --version $env:PROMOTION_VERSION `
            --run-id $env:RELEASE_RUN_ID `
            --repository $env:GITHUB_REPOSITORY `
            --tag-commit $commit `
            --public-packages public-published `
            --wait-for-public `
            --public-progress release-artifacts/public-verification-progress.json `
            @retry
          if ($LASTEXITCODE -ne 0)
          {
            throw 'The complete nuget.org package and symbol set was not verified.'
          }
          $report | Tee-Object -FilePath 'release-artifacts/public-verification.json'

      - name: Retain public package verification
        if: >-
          ${{ !cancelled() && github.event.inputs.dry_run != 'true' &&
              steps.verify_inputs.outcome == 'success' &&
              (steps.push.outcome == 'success' || steps.push.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-public-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-artifacts/public-verification.json
            release-artifacts/public-verification-progress.json
            release-artifacts/promotion-inventory.json
            release-artifacts/release-run.json
            release-artifacts/release-gate/release-gate.json
          if-no-files-found: error
          retention-days: 90

      - name: Dry-run result
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Validated package/symbol bytes against the successful tagged release."
          echo "Skipping NuGet/login and dotnet nuget push because dry_run=true."

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PACKAGE_COUNT: ${{ steps.resolve.outputs.count }}
          RELEASE_RUN_ID: ${{ steps.resolve.outputs.release-run-id }}
          INPUT_RESULT: ${{ steps.verify_inputs.outcome }}
          PUSH_RESULT: ${{ steps.push.outcome }}
          PUBLIC_RESULT: ${{ steps.verify_public.outcome }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          {
            echo "### nuget.org promotion"
            echo ""
            echo "- Version: \`${VERSION:-not resolved}\`"
            echo "- GitHub-feed packages resolved: \`${PACKAGE_COUNT:-not available}\`"
            echo "- Release artifact run: \`${RELEASE_RUN_ID:-not resolved}\`"
            echo "- Source: GitHub Packages nupkg bytes plus release-artifact snupkg symbols"
            echo "- Input verification: \`${INPUT_RESULT:-not run}\`"
            echo "- Upload: \`${PUSH_RESULT:-not run}\`"
            echo "- Public package and symbol verification: \`${PUBLIC_RESULT:-not run}\`"
            echo "- Dry run: \`${DRY_RUN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
