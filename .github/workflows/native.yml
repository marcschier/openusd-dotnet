name: Windows bounded exact admission replay; not qualification
on:
  workflow_dispatch:
    inputs:
      producer-run:
        required: true
        type: string
      producer-source:
        required: true
        type: string
      producer-ref:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  original-main-replay:
    name: One exact-built original probe; bounded diagnostic only
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller-source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.producer-source }}
          path: original-source
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build only the first-party bounded Win32 controller
        shell: pwsh
        run: |
          Set-Location controller-source/eng/diagnostics
          cl /nologo /std:c++17 /EHsc /W4 /WX /Od /Zi `
            /Fewindows_main_stall.exe /Fowindows_main_stall.obj /Fdwindows_main_stall.pdb windows_main_stall.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the original built input and execute one bounded original case
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_SOURCE: ${{ inputs.producer-source }}
          PRODUCER_RUN: ${{ inputs.producer-run }}
          PRODUCER_REF: ${{ inputs.producer-ref }}
        run: >
          python controller-source/eng/diagnostics/run_exact_replay.py
          --source-root original-source
          --helper controller-source/eng/diagnostics/windows_main_stall.exe
          --producer-source $env:PRODUCER_SOURCE --producer-run $env:PRODUCER_RUN
          --producer-ref $env:PRODUCER_REF --session original-source/artifacts/one-owned-replay
      - name: Retain only bounded owned diagnostic JSON, never SDK payloads or dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-original-main-replay-${{ github.run_id }}
          path: |
            original-source/artifacts/one-owned-replay/host-comparison.json
            original-source/artifacts/one-owned-replay/replay-summary.json
            original-source/artifacts/one-owned-replay/one-subject-result/*.json
          if-no-files-found: warn
          retention-days: 7
