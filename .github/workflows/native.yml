name: Windows main-thread controller SDK-free control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-controller-control:
    name: SDK-free Win32 primary-thread control; not qualification
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Compile only first-party Win32 SDK-free helper and owned control
        shell: pwsh
        run: |
          Set-Location eng/diagnostics
          cl /nologo /std:c++17 /EHsc /W4 /WX /Od /Zi `
            /Fewindows_main_stall.exe /Fowindows_main_stall.obj /Fdwindows_main_stall.pdb `
            windows_main_stall.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /EHsc /W4 /WX /Od /Zi `
            /Feowned_native_control.exe /Foowned_native_control.obj /Fdowned_native_control.pdb `
            owned_native_control.cpp /link psapi.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute only owned SDK-free control processes
        shell: pwsh
        run: python eng/diagnostics/run_native_controls.py
      - name: Retain only bounded structured SDK-free control data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-main-controller-sdk-free-${{ github.run_id }}
          path: eng/diagnostics/control-results/**/*.json
          if-no-files-found: warn
          retention-days: 7
