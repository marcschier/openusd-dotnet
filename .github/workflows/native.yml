name: GitHub feed version preflight (read only)
on:
  workflow_dispatch:
permissions: {}
jobs:
  feed-version-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Read exact intended package versions
        shell: bash
        env:
          FEED_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          VERSION = "0.15.0-alpha"
          OWNER = "marcschier"
          PACKAGES = """OpenUsd
          OpenUsd.Bridge.Grpc
          OpenUsd.Bridge.Protocol
          OpenUsd.Cesium
          OpenUsd.Interop
          OpenUsd.LiveAuthoring
          OpenUsd.Mcp.Tool
          OpenUsd.Physics
          OpenUsd.Rendering
          OpenUsd.Rendering.Silk
          OpenUsd.Rendering.Silk.D3D12
          OpenUsd.Rendering.Silk.Metal
          OpenUsd.Rendering.Silk.Vulkan
          OpenUsd.Rendering.Storm
          OpenUsd.Runtime.Cesium
          OpenUsd.Runtime.Cesium.linux-x64
          OpenUsd.Runtime.Cesium.osx-arm64
          OpenUsd.Runtime.Cesium.win-x64
          OpenUsd.Runtime.Core
          OpenUsd.Runtime.Core.linux-x64
          OpenUsd.Runtime.Core.osx-arm64
          OpenUsd.Runtime.Core.win-x64
          OpenUsd.Runtime.Imaging
          OpenUsd.Runtime.Imaging.linux-x64
          OpenUsd.Runtime.Imaging.osx-arm64
          OpenUsd.Runtime.Imaging.win-x64
          OpenUsd.Runtime.Physics
          OpenUsd.Runtime.Physics.linux-x64
          OpenUsd.Runtime.Physics.win-x64
          OpenUsd.Viewer
          OpenUsd.Viewer.Bridge.Grpc""".split()

          class MetadataError(Exception):
              def __init__(self, kind, status=None):
                  super().__init__(kind)
                  self.kind, self.status = kind, status

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  return None

          def approved_url(url):
              try:
                  parsed = urllib.parse.urlsplit(url)
                  port = parsed.port
              except ValueError:
                  raise MetadataError("unapproved-feed-url") from None
              if (parsed.scheme != "https" or parsed.hostname != "nuget.pkg.github.com"
                      or port not in (None, 443) or parsed.username or parsed.password
                      or parsed.query or parsed.fragment or not parsed.path.startswith("/marcschier/")
                      or "\\" in parsed.path
                      or ".." in urllib.parse.unquote(parsed.path).split("/")):
                  raise MetadataError("unapproved-feed-url")
              return url

          def read_json(url, token):
              credentials = base64.b64encode((OWNER + ":" + token).encode()).decode()
              request = urllib.request.Request(approved_url(url), headers={
                  "Authorization": "Basic " + credentials,
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                      if response.status != 200:
                          raise MetadataError("http", response.status)
                      data = response.read(1048577)
                      if len(data) > 1048576:
                          raise MetadataError("metadata-too-large")
                      return json.loads(data)
              except urllib.error.HTTPError as error:
                  raise MetadataError("http", error.code) from None
              except (urllib.error.URLError, TimeoutError):
                  raise MetadataError("network-unavailable") from None
              except (ValueError, UnicodeError):
                  raise MetadataError("invalid-json") from None

          def version_result(package, value):
              if not isinstance(value, dict):
                  raise MetadataError("invalid-version-inventory")
              versions = value.get("versions")
              if (not isinstance(versions, list) or len(versions) > 4096
                      or any(not isinstance(item, str) or len(item) > 128 for item in versions)):
                  raise MetadataError("invalid-version-inventory")
              return {"package": package, "httpStatus": 200, "visibility": "verified",
                      "versionExists": any(item.casefold() == VERSION for item in versions),
                      "visibleVersionCount": len(versions)}

          def main():
              if (os.environ.get("GITHUB_REPOSITORY") != "marcschier/openusd-dotnet"
                      or os.environ.get("GITHUB_REPOSITORY_ID") != "1309934941"):
                  raise MetadataError("unexpected-repository")
              token = os.environ["FEED_READ_TOKEN"]
              if len(PACKAGES) != 31 or len(set(PACKAGES)) != 31:
                  raise MetadataError("invalid-intended-package-list")
              results = []
              try:
                  index = read_json("https://nuget.pkg.github.com/marcschier/index.json", token)
                  if (not isinstance(index, dict) or not isinstance(index.get("resources"), list)
                          or any(not isinstance(item, dict) for item in index["resources"])):
                      raise MetadataError("invalid-service-index")
                  addresses = [item["@id"] for item in index.get("resources", [])
                               if item.get("@type") == "PackageBaseAddress/3.0.0"]
                  if len(addresses) != 1:
                      raise MetadataError("base-address-unavailable")
                  address = approved_url(addresses[0]).rstrip("/") + "/"
              except MetadataError as error:
                  results = [{"package": package, "visibility": "unverified",
                              "versionExists": None, "errorKind": error.kind,
                              "httpStatus": error.status} for package in PACKAGES]
              else:
                  for package in PACKAGES:
                      try:
                          value = read_json(address + package.lower() + "/index.json", token)
                          results.append(version_result(package, value))
                      except MetadataError as error:
                          results.append({"package": package, "visibility": "unverified",
                                          "versionExists": None, "errorKind": error.kind,
                                          "httpStatus": error.status})
              report = {"schemaVersion": 1, "publicationPreflightOnly": True,
                        "notNativeQualification": True, "version": VERSION,
                        "runId": os.environ["GITHUB_RUN_ID"],
                        "sourceHead": os.environ["GITHUB_SHA"],
                        "intendedCount": 31, "results": results}
              with Path("feed-version-preflight.json").open("x", encoding="utf-8") as output:
                  json.dump(report, output, indent=2)
                  output.write("\n")
              collisions = [item["package"] for item in results if item["versionExists"] is True]
              unknown = [item["package"] for item in results if item["versionExists"] is None]
              print(json.dumps({"version": VERSION, "queriedCount": len(results),
                                "collisions": collisions, "unverified": unknown}))
              return 1 if collisions or unknown else 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
      - name: Retain bounded version metadata only
        if: always() && hashFiles('feed-version-preflight.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openusd-feed-version-preflight
          path: feed-version-preflight.json
          if-no-files-found: error
          retention-days: 7
