name: native artifact pipeline

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/native.yml'
      - 'eng/openusd.lock.json'
      - 'eng/openusd.install.lock.json'
      - 'eng/openusd-runtime-patches.lock.json'
      - 'eng/openusd-storage-admission.lock.json'
      - 'eng/patches/openusd/storage-admission-v1.patch'
      - 'eng/patches/openusd/render-product-hash-adl.patch'
      - 'eng/sdk-storage-admission-metadata.ps1'
      - 'eng/patches/openusd/storm-aov-restoration.patch'
      - 'eng/patches/openusd/strict-compiler-portability.patch'
      - 'eng/patches/openusd/list-edit-validation.patch'
      - 'eng/patches/openusd/windows-resource-path-consistency.patch'
      - 'eng/patches/openusd/scoped-sublayer-resolution.patch'
      - 'eng/apply-openusd-source-patches.ps1'
      - 'eng/sdk-runtime-patch-metadata.ps1'
      - 'eng/test-sdk-runtime-patch-metadata.ps1'
      - 'eng/fetch-native.ps1'
      - 'eng/build-native.ps1'
      - 'eng/physx.lock.json'
      - 'eng/fetch-physx-native.ps1'
      - 'eng/build-physx-native.ps1'
      - 'eng/build-physx-shim.ps1'
      - 'eng/mdl.lock.json'
      - 'eng/fetch-mdl-sdk.ps1'
      - 'eng/build-mdl-shim.ps1'
      - 'eng/build-vulkan-sdk.ps1'
      - 'eng/cmake/ShaderCompiler.cmake'
      - 'eng/generate-native-notices.py'
      - 'eng/shaderc-source-patches.lock.json'
      - 'eng/patches/shaderc/**'
      - 'eng/generate-sbom.py'
      - 'LICENSE'
      - 'NOTICE'
      - 'eng/check-linux-native-prerequisites.ps1'
      - 'eng/native-install-metadata.ps1'
      - 'eng/prepare-render-native.ps1'
      - 'eng/create-native-archive.ps1'
      - 'eng/run-native-fuzz.ps1'
      - 'eng/run-windows-native-tests.ps1'
      - 'eng/prepare-mesa-wgl-test-runtime.ps1'
      - 'eng/mesa-wgl-test-runtime.lock.json'
      - 'eng/native-fuzz-lsan.supp'
      - 'native/**'
      - 'test-assets/fuzz-seeds/**'
      - 'test-assets/omniverse/mdl-only-omnipbr.usda'
  pull_request:
    branches: [ master, main ]
    paths:
      - '.github/workflows/native.yml'
      - 'eng/openusd.lock.json'
      - 'eng/openusd.install.lock.json'
      - 'eng/openusd-runtime-patches.lock.json'
      - 'eng/openusd-storage-admission.lock.json'
      - 'eng/patches/openusd/storage-admission-v1.patch'
      - 'eng/patches/openusd/render-product-hash-adl.patch'
      - 'eng/sdk-storage-admission-metadata.ps1'
      - 'eng/patches/openusd/storm-aov-restoration.patch'
      - 'eng/patches/openusd/strict-compiler-portability.patch'
      - 'eng/patches/openusd/list-edit-validation.patch'
      - 'eng/patches/openusd/windows-resource-path-consistency.patch'
      - 'eng/patches/openusd/scoped-sublayer-resolution.patch'
      - 'eng/apply-openusd-source-patches.ps1'
      - 'eng/sdk-runtime-patch-metadata.ps1'
      - 'eng/test-sdk-runtime-patch-metadata.ps1'
      - 'eng/fetch-native.ps1'
      - 'eng/build-native.ps1'
      - 'eng/physx.lock.json'
      - 'eng/fetch-physx-native.ps1'
      - 'eng/build-physx-native.ps1'
      - 'eng/build-physx-shim.ps1'
      - 'eng/mdl.lock.json'
      - 'eng/fetch-mdl-sdk.ps1'
      - 'eng/build-mdl-shim.ps1'
      - 'eng/build-vulkan-sdk.ps1'
      - 'eng/cmake/ShaderCompiler.cmake'
      - 'eng/generate-native-notices.py'
      - 'eng/shaderc-source-patches.lock.json'
      - 'eng/patches/shaderc/**'
      - 'eng/generate-sbom.py'
      - 'LICENSE'
      - 'NOTICE'
      - 'eng/check-linux-native-prerequisites.ps1'
      - 'eng/native-install-metadata.ps1'
      - 'eng/prepare-render-native.ps1'
      - 'eng/create-native-archive.ps1'
      - 'eng/run-native-fuzz.ps1'
      - 'eng/run-windows-native-tests.ps1'
      - 'eng/prepare-mesa-wgl-test-runtime.ps1'
      - 'eng/mesa-wgl-test-runtime.lock.json'
      - 'eng/native-fuzz-lsan.supp'
      - 'native/**'
      - 'test-assets/fuzz-seeds/**'
      - 'test-assets/omniverse/mdl-only-omnipbr.usda'

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  # Not cancelled on main. This pipeline is the only producer of the OpenUSD
  # install cache that ci.yml's coverage gate restores, and a full run takes
  # about ninety minutes. Cancelling on every push starves that gate
  # permanently whenever main is being pushed to faster than the pipeline can
  # finish, which is exactly what happened while landing the schema wave: six
  # consecutive runs were cancelled and the cache was never written.
  #
  # Cancelling is still right on branches, where runs are superseded quickly
  # and no cache consumer depends on them. The key is content-addressed over
  # the abi-free install lock and the build scripts, so a run that completes for
  # an older commit still produces a cache valid for every later commit with the
  # same locked install inputs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.rid }} verified native archive
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-15
    env:
      OpenUsdRequireMetalShaderLibrary: >-
        ${{ matrix.rid == 'osx-arm64' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential clang cmake ninja-build pkg-config patchelf binutils
          libgl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev libx11-dev libxcursor-dev
          libxi-dev libxinerama-dev libxrandr-dev libxt-dev libxtst-dev
          libwayland-dev x11-utils xvfb zlib1g-dev
      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Validate Linux prerequisite contract
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          ./eng/test-linux-native-prerequisites.ps1
          ./eng/check-linux-native-prerequisites.ps1
      - name: Validate archive producer and consumer
        shell: pwsh
        run: |
          ./eng/test-sdk-runtime-patch-metadata.ps1
          ./eng/test-render-native-archive.ps1
      - name: Validate native fuzz source contract
        shell: pwsh
        run: ./eng/run-native-fuzz.ps1 -SelfTest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: |
            native/install/${{ matrix.rid }}
            native/install/shim/${{ matrix.rid }}
            native/install/vulkan-sdk-1.4.363.0
            native/install/shaderc/${{ matrix.rid }}
            native/build/shim/${{ matrix.rid }}
          key: >-
            native-${{ matrix.rid }}-${{ hashFiles(
              'eng/openusd.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/cmake/ShaderCompiler.cmake',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE',
              'eng/check-linux-native-prerequisites.ps1',
              'eng/native-install-metadata.ps1',
              'native/CMakeLists.txt',
              'native/CMakePresets.json',
              'native/**/CMakeLists.txt',
              'native/**/*.cmake',
              'native/**/*.json',
              'native/**/*.in',
              'native/**/resources/**',
              'native/**/*.c',
              'native/**/*.cc',
              'native/**/*.cpp',
              'native/**/*.cxx',
              'native/**/*.m',
              'native/**/*.mm',
              'native/**/*.h',
              'native/**/*.hh',
              'native/**/*.hpp',
              'native/**/*.hxx',
              'native/**/*.inc',
              'native/**/*.inl',
              '!native/build/**',
              '!native/install/**',
              '!native/downloads/**',
              '!native/src/**',
              '!native/.cache/**'
            ) }}
      # The coverage gate in .github/workflows/ci.yml restores the expensive
      # OpenUSD install on its own, narrower key: it builds the shim fresh from
      # the commit under test, so it must not depend on the shim inputs above or
      # on the ABI section in eng/openusd.lock.json.
      # This key and path list must stay character-identical to the
      # `openusd-cache` step in ci.yml, because hashFiles over a different file
      # list yields a different digest and the restore would silently never hit.
      #
      # A wide hit must never be overwritten by a narrow restore. Separate
      # lookup-only branches inspect the SDK key without downloading it, so
      # verified wide data can also fill an absent SDK pair. Each RID saves
      # that pair exactly once after metadata and full notices pass, before
      # later tests. The wide cache keeps its final-success-only post-save.
      # Linux retains ci.yml's exact eleven inputs/two paths. Windows uses
      # the same SDK/Vulkan closure; macOS also binds its CPU compiler policy.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-linux-restore
        if: >-
          matrix.rid == 'linux-x64' &&
          steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/install/linux-x64
            native/install/vulkan-sdk-1.4.363.0
          key: >-
            openusd-install-linux-x64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-linux-lookup
        if: >-
          matrix.rid == 'linux-x64' &&
          steps.native-cache.outputs.cache-hit == 'true'
        with:
          lookup-only: true
          path: |
            native/install/linux-x64
            native/install/vulkan-sdk-1.4.363.0
          key: >-
            openusd-install-linux-x64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-win-restore
        if: >-
          matrix.rid == 'win-x64' &&
          steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/install/win-x64
            native/install/vulkan-sdk-1.4.363.0
          key: >-
            openusd-install-win-x64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-win-lookup
        if: >-
          matrix.rid == 'win-x64' &&
          steps.native-cache.outputs.cache-hit == 'true'
        with:
          lookup-only: true
          path: |
            native/install/win-x64
            native/install/vulkan-sdk-1.4.363.0
          key: >-
            openusd-install-win-x64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-mac-restore
        if: >-
          matrix.rid == 'osx-arm64' &&
          steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/install/osx-arm64
            native/install/shaderc/osx-arm64
          key: >-
            openusd-install-osx-arm64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/cmake/ShaderCompiler.cmake',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sdk-mac-lookup
        if: >-
          matrix.rid == 'osx-arm64' &&
          steps.native-cache.outputs.cache-hit == 'true'
        with:
          lookup-only: true
          path: |
            native/install/osx-arm64
            native/install/shaderc/osx-arm64
          key: >-
            openusd-install-osx-arm64-${{ hashFiles(
              'eng/openusd.install.lock.json',
              'eng/fetch-native.ps1',
              'eng/build-native.ps1',
              'eng/build-vulkan-sdk.ps1',
              'eng/cmake/ShaderCompiler.cmake',
              'eng/generate-native-notices.py',
              'eng/shaderc-source-patches.lock.json',
              'eng/patches/shaderc/spirv-tools-explicit-case-breaks.patch',
              'eng/patches/shaderc/shaderc-zero-padded-string-copy.patch',
              'eng/generate-sbom.py',
              'LICENSE',
              'NOTICE'
            ) }}
      - name: Fetch locked native sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./eng/fetch-native.ps1 -Rid ${{ matrix.rid }}
      - name: Build locked native install
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./eng/build-native.ps1 -Rid ${{ matrix.rid }}
      - name: Verify native install metadata
        shell: pwsh
        run: |
          ./eng/sdk-storage-admission-metadata.ps1 `
            -Operation Verify `
            -SdkRoot native/install/${{ matrix.rid }} `
            -Rid ${{ matrix.rid }}
          ./eng/native-install-metadata.ps1 `
            -Operation Verify `
            -Rid ${{ matrix.rid }} `
            -RequireVulkanRuntime:$IsWindows
      - name: Verify complete native redistribution notices
        shell: pwsh
        run: |
          python ./eng/generate-native-notices.py verify `
            --rid ${{ matrix.rid }} --install-root native/install/${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw 'Native redistribution notices are incomplete or stale.' }
      - name: Verify complete SDK build-cache pair
        shell: pwsh
        run: |
          $lock = Get-Content eng/openusd.install.lock.json -Raw | ConvertFrom-Json
          $rid = '${{ matrix.rid }}'
          $sdk = "native/install/$rid"
          $required = @(
            "$sdk/.openusd-install-metadata.json",
            "$sdk/.openusd-runtime-patches.json",
            "$sdk/.openusd-storage-admission.json",
            "$sdk/.openusd-native-notices.json",
            "$sdk/THIRD-PARTY.md")
          if ($rid -eq 'osx-arm64')
          {
            $compiler = "native/install/shaderc/$rid"
            $required += @(
              "$compiler/include/shaderc/shaderc.hpp",
              "$compiler/lib/libshaderc_combined.a",
              "$compiler/shaderc-provenance.json")
          }
          else
          {
            $compiler = "native/install/vulkan-sdk-$($lock.vulkanSdk.version)"
            $include = if ($rid -eq 'win-x64') { 'Include' } else { 'include' }
            $lib = if ($rid -eq 'win-x64') { 'Lib' } else { 'lib' }
            $required += @(
              "$compiler/$include/vulkan/vulkan.h",
              "$compiler/$include/vulkan/vk_enum_string_helper.h",
              "$compiler/$include/vma/vk_mem_alloc.h")
            $required += if ($rid -eq 'win-x64')
            {
              @("$compiler/$lib/shaderc_combined.lib", "$compiler/$lib/shaderc_combinedd.lib",
                "$compiler/Bin/vulkan-1.dll")
            }
            else
            {
              @("$compiler/$lib/libshaderc_combined.a", "$compiler/$lib/libvulkan.so")
            }
          }
          foreach ($file in $required)
          {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or
                (Get-Item -LiteralPath $file).Length -eq 0)
            {
              throw "The verified SDK build-cache pair is incomplete: $file"
            }
          }
          if ($rid -eq 'osx-arm64')
          {
            $receipt = Get-Content "$compiler/shaderc-provenance.json" -Raw | ConvertFrom-Json
            $manifest = @($lock.vulkanSdk.repositories | Where-Object name -CEQ 'shaderc-source-manifest')
            if ($manifest.Count -ne 1 -or $receipt.schemaVersion -ne 1 -or
                $receipt.kind -cne 'cpu-only-static-shaderc' -or
                $receipt.sourceManifestCommit -cne $manifest[0].commit -or
                $receipt.sourceManifestSha256 -cne '6CF717A56592553E7D88FDA3C01E74529054FECBC2CA6DDE31CBF305B9FC276F' -or
                $receipt.buildScriptSha256 -cne (Get-FileHash eng/build-vulkan-sdk.ps1).Hash -or
                $receipt.compilerPolicySha256 -cne (Get-FileHash eng/cmake/ShaderCompiler.cmake).Hash -or
                $receipt.sourcePatchLockSha256 -cne $lock.vulkanSdk.sourcePatchLockSha256 -or
                $receipt.library -cne 'lib/libshaderc_combined.a' -or
                $receipt.librarySha256 -cne (Get-FileHash "$compiler/lib/libshaderc_combined.a").Hash)
            {
              throw 'The private CPU shader compiler cache provenance differs from its exact locked build.'
            }
            $profile = Get-Content $lock.vulkanSdk.sourcePatchLock -Raw | ConvertFrom-Json
            $expected = @(
              foreach ($component in $profile.components)
              {
                foreach ($file in $component.files)
                {
                  "$($component.component)|$($file.file)|$($file.afterSha256)"
                }
              })
            $actual = @($receipt.repairedSources | ForEach-Object {
              "$($_.component)|$($_.file)|$($_.sha256)" })
            if (@(Compare-Object ($expected | Sort-Object) ($actual | Sort-Object) -CaseSensitive).Count -ne 0)
            {
              throw 'The private CPU compiler cache lacks the exact reviewed repaired-source inventory.'
            }
          }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          success() && matrix.rid == 'linux-x64' &&
          steps.sdk-linux-restore.outputs.cache-hit != 'true' &&
          steps.sdk-linux-lookup.outputs.cache-hit != 'true'
        with:
          path: |
            native/install/linux-x64
            native/install/vulkan-sdk-1.4.363.0
          key: ${{ steps.sdk-linux-restore.outputs.cache-primary-key || steps.sdk-linux-lookup.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          success() && matrix.rid == 'win-x64' &&
          steps.sdk-win-restore.outputs.cache-hit != 'true' &&
          steps.sdk-win-lookup.outputs.cache-hit != 'true'
        with:
          path: |
            native/install/win-x64
            native/install/vulkan-sdk-1.4.363.0
          key: ${{ steps.sdk-win-restore.outputs.cache-primary-key || steps.sdk-win-lookup.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          success() && matrix.rid == 'osx-arm64' &&
          steps.sdk-mac-restore.outputs.cache-hit != 'true' &&
          steps.sdk-mac-lookup.outputs.cache-hit != 'true'
        with:
          path: |
            native/install/osx-arm64
            native/install/shaderc/osx-arm64
          key: ${{ steps.sdk-mac-restore.outputs.cache-primary-key || steps.sdk-mac-lookup.outputs.cache-primary-key }}
      - name: Run bounded native fuzzers
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/run-native-fuzz.ps1 -MaxTotalTime 60
      - name: Upload native fuzz crash artifacts
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openusd-native-fuzz-linux-x64
          path: artifacts/native-fuzz/linux-x64/
          if-no-files-found: warn
          retention-days: 14
      - name: Build and validate Metal shader library
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          ./eng/shaders/fetch-toolchain.ps1 -Rid osx-arm64
          ./eng/shaders/build-toolchain.ps1 -Rid osx-arm64
          ./eng/shaders/build-shaders.ps1 `
            -Rid osx-arm64 `
            -ArtifactScope Metal `
            -OutputRoot eng/shaders/out/native-macos
          ./eng/shaders/prepare-metal-library.ps1 `
            -OutputRoot eng/shaders/out/checked-payload/osx-arm64
      - name: Run Windows native CTest
        if: runner.os == 'Windows'
        shell: pwsh
        # This unfiltered run is the adapter-absent half of the MDL evidence:
        # the default configuration registers hdsilk_probe without
        # HDSILK_PROBE_MDL_ADAPTER, so it asserts the state every base package
        # ships in. --no-tests=error keeps it fail-closed -- a build tree that
        # configured no tests at all would otherwise report success.
        # Hosted Windows has no WGL 4.5 driver. Stage the already-pinned Mesa
        # runtime beside the Storm probes so AOV coverage executes rather than skips.
        run: ./eng/run-windows-native-tests.ps1 -BuildRoot native/build/shim/win-x64 -ObserveAdmissionPhases
      - name: Build and test optional MDL adapter
        if: runner.os == 'Windows'
        shell: pwsh
        # The adapter is never installed and never packaged, so this step builds
        # in place and runs the hdSilk probe from the MDL build tree. That probe
        # is the only place the distillation half of the MDL slice is proven:
        # the default configuration's probe compiles the adapter-absent checks
        # alone, because asserting distillation with no adapter asserts nothing.
        #
        # The SDK-backed sibling is deliberately not built here. It needs the
        # ~276 MiB acquisition eng/fetch-mdl-sdk.ps1 performs and a user-supplied
        # MDL SDK runtime, neither of which any package contains or may contain,
        # so eng/mdl.lock.json and the support manifest record that slice as
        # implemented-not-gated rather than claiming a workflow proves it.
        run: ./eng/build-mdl-shim.ps1 -Rid win-x64 -RunProbe
      - name: Build and test optional PhysX shim
        if: runner.os == 'Windows'
        shell: pwsh
        # The install prefix lives in eng/build-physx-shim.ps1 rather than here.
        # The physics preset configures the whole native project, so installing it
        # over native/install/shim/win-x64 would replace archive-verified core,
        # Hydra, hdSilk and Storm child binaries at exactly the paths packaging
        # reads. Stating that prefix in one place is what keeps this job and the
        # packaging agreeing about it.
        run: |
          $env:VULKAN_SDK = (Resolve-Path native/install/vulkan-sdk-1.4.363.0).Path
          ./eng/build-physx-native.ps1 -Rid win-x64
          ./eng/build-physx-shim.ps1 -Rid win-x64
          ./eng/run-windows-native-tests.ps1 -BuildRoot native/build/shim/win-x64-physx -ObserveAdmissionPhases
      - name: Run PhysX shim managed coverage tests
        if: runner.os == 'Windows'
        shell: pwsh
        # Two things this step must own that the native step above cannot.
        # Nothing in this job builds managed assemblies, so the test runner had
        # no DLL to launch. And the MSVC developer environment exports
        # Platform=x64, which makes MSBuild both write to and resolve TargetPath
        # under bin\x64\Release; clearing it keeps the build and the runner
        # agreeing on bin\Release, as package.yml already does.
        env:
          Platform: ''
        run: |
          dotnet build `
            tests/OpenUsd.NativeCoverage.Tests/OpenUsd.NativeCoverage.Tests.csproj `
            -c Release
          ./eng/run-native-managed-tests.ps1 `
            -Project tests/OpenUsd.NativeCoverage.Tests/OpenUsd.NativeCoverage.Tests.csproj `
            -Rid win-x64 `
            -Configuration Release `
            -MinimumExpectedTests 31
      - name: Run Linux native CTest under Xvfb
        if: runner.os == 'Linux'
        run: |
          export DISPLAY=:94
          Xvfb "$DISPLAY" -screen 0 1280x720x24 -ac -nolisten tcp \
            >artifacts/native-ctest-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            sleep 0.05
          done
          ctest --test-dir native/build/shim/linux-x64 --no-tests=error --output-on-failure
      - name: Run macOS native CTest
        if: runner.os == 'macOS'
        env:
          OPENUSD_DOTNET_OWN_PROPERTY_PHASES: '1'
        run: ctest --test-dir native/build/shim/osx-arm64 --no-tests=error --output-on-failure
      - name: Execute staged NativeAOT probes
        shell: pwsh
        run: |
          ./eng/run-native-probe.ps1 `
            -Rid ${{ matrix.rid }} `
            -SkipNativeAbiProbe
          ./eng/run-silk-probe.ps1 -Rid ${{ matrix.rid }}
      - name: Create immutable native archive
        shell: pwsh
        run: |
          $root = 'artifacts/native-archive/${{ matrix.rid }}'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          ./eng/create-native-archive.ps1 `
            -Rid ${{ matrix.rid }} `
            -OutputPath (Join-Path $root 'openusd-native-${{ matrix.rid }}.tar.gz') `
            -MetadataOutputPath (Join-Path $root 'native-artifact.json')
      - name: Upload verified native archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openusd-native-${{ matrix.rid }}
          path: artifacts/native-archive/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openusd-native-diagnostics-${{ matrix.rid }}
          path: |
            artifacts/native-ctest-xvfb.log
            native/build/shim/${{ matrix.rid }}/Testing/
            native/build/shim/${{ matrix.rid }}-physx/Testing/
            artifacts/native-probe/${{ matrix.rid }}
            artifacts/silk-probe/${{ matrix.rid }}
          if-no-files-found: warn
          retention-days: 14
